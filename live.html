*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 82% -10%,#17385f 0,#07111f 43%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.wrap{max-width:1280px;margin:auto;padding:16px 14px 54px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.title{font-size:24px;font-weight:850}.subtitle,.tiny{font-size:12px;color:var(--muted);line-height:1.55}.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.lock,.fresh,.pill{font-size:11px;border:1px solid var(--line);background:#0b1a2b;padding:5px 8px;border-radius:999px;white-space:nowrap}.good{color:#73e4ad}.warn{color:#ffd27c}.bad{color:#ff91a0}.fresh.good,.pill.good{border-color:#24764f}.fresh.warn,.pill.warn{border-color:#765821}.fresh.bad,.pill.bad{border-color:#713342}nav{display:flex;gap:8px;overflow:auto;padding:14px 0 10px;scrollbar-width:none}nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 13px;border-radius:10px;white-space:nowrap;font-size:14px}nav button.active{background:#14345a;border-color:#24558c;color:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}.refresh,.historybtn,.backbtn{border:1px solid #2b5681;background:#123153;color:#d9edff;border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer}.logout{border:0;background:transparent;color:#7691aa;font-size:12px}.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;margin-bottom:12px}.heroMain,.metric,.card{background:linear-gradient(180deg,#0f2238,#0b192a);border:1px solid var(--line);border-radius:14px;padding:14px}.heroMain{border-color:#28577e}.heroTitle{font-size:12px;color:#9ecbff}.heroValue{font-size:24px;font-weight:900;margin:8px 0}.heroSide,.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{min-height:104px}.metric.good{border-color:#24764f}.metric.warn{border-color:#765821}.metric.bad{border-color:#713342}.ml{font-size:12px;color:var(--muted)}.mv{font-size:22px;font-weight:850;margin:9px 0 5px}.section{margin-top:13px;background:rgba(11,25,42,.9);border:1px solid var(--line);border-radius:16px;overflow:hidden}.shead{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.shead h2{font-size:16px;margin:0}.shead span{color:var(--muted);font-size:12px;text-align:right}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.card.feature{border-color:#28577e;background:linear-gradient(180deg,#112a46,#0d2035)}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.bigpick{font-size:18px;font-weight:850;margin:7px 0}.notice{border:1px solid #765821;background:#2b2314;color:#ffd985;border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.55}.notice.good{border-color:#1e6e4b;background:#10291f;color:#8cedb9}.notice.bad{border-color:#713342;background:#321820;color:#ff9dad}.tablewrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:9px 10px;border-bottom:1px solid #142d49;text-align:left;white-space:nowrap}th{color:#9cb3ca;background:#0b1b2e;position:sticky;top:0;z-index:1}tbody tr:hover{background:#102740}.clickrow{cursor:pointer}.kv{display:grid;grid-template-columns:145px 1fr;gap:8px 12px;font-size:12px;line-height:1.55}.kv>div:nth-child(odd){color:var(--muted)}.sourcegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px}.sourceCard{background:#0e2035;border:1px solid #183655;border-radius:13px;padding:12px}.sourceCard.good{border-color:#24764f;color:var(--text)}.sourceCard.warn{border-color:#765821;color:var(--text)}.sourceCard.bad{border-color:#713342;color:var(--text)}.sourceName{font-size:13px;font-weight:800}.sourceVal{font-size:19px;font-weight:850;margin:8px 0}.sourceMeta{font-size:11px;color:var(--muted);line-height:1.55}.login{min-height:84vh;display:grid;place-items:center;padding:16px}.loginbox{width:min(92vw,390px);background:#0d1b2d;border:1px solid #1d3a5a;border-radius:20px;padding:24px}.loginbox h1{font-size:22px;margin:0 0 8px}.loginbox label{font-size:12px;color:#9bb1c8;display:block;margin:12px 0 6px}.loginbox input{width:100%;border:1px solid #274867;background:#081522;color:white;border-radius:11px;padding:13px 12px;font-size:16px}.loginbox button{width:100%;margin-top:18px;border:0;border-radius:11px;background:#2e83e6;color:white;padding:13px;font-size:16px;font-weight:780}.err{display:none;background:#3a1720;border:1px solid #7a3142;color:#ff9dad;border-radius:10px;padding:9px 11px;margin-bottom:12px;font-size:13px}.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}.footer{color:#637c95;text-align:center;font-size:11px;margin-top:16px;line-height:1.6}

/* Mobile layout hardening v2 */
html,body,#app{width:100%;max-width:100%;min-width:0;overflow-x:hidden}

<body>
<div id="app"><div class="loading">正在连接豪模型控制台…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';
const APP_BUILD='2026-08-31 22:48 豪传详情冻结证据补全';
let DATA=null,TAB='dashboard',AUTO_TIMER=null,DETAIL=null;
async function checkBuildVersion(){try{const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(j&&j.build&&j.build!==APP_BUILD){const u=new URL(location.href);if(u.searchParams.get('v')!==String(j.build)){u.searchParams.set('v',j.build);location.replace(u.toString())}}}catch(_){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?(a*100/b).toFixed(1)+'%':'—';
const fmtTime=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return String(v)}};
const ageMinutes=v=>v?Math.max(0,Math.round((Date.now()-new Date(v).getTime())/60000)):null;
const code=v=>v==='主胜'?'3':v==='平'?'1':v==='客胜'?'0':'';
const hitTop=r=>!!(r.top1&&r.result_verified&&code(r.top1)===r.result_1x2);
const hitTicket=r=>!!(r.ticket_pick&&r.result_verified&&String(r.ticket_pick).includes(String(r.result_1x2)));
const result=r=>!r.result_verified?'待结算':(r.result_home??'?')+'-'+(r.result_away??'?')+' · '+(r.result_1x2==='3'?'主胜':r.result_1x2==='1'?'平':'客胜');
function token(){return localStorage.getItem('hao_console_token')||''}
function activeNames(){const ks=Object.keys(DATA?.active_models||{});const hj=DATA?.role_models?.hj||ks.find(k=>k.includes('豪竟')||k.includes('豪竞'))||'豪竞';const hc=DATA?.role_models?.hc||ks.find(k=>k.includes('豪传'))||'豪传';return {hj,hc}}
function activeByRole(role){const n=activeNames();return DATA?.active_models?.[role==='hj'?n.hj:n.hc]||null}
function metric(l,v,s='',c=''){return '<div class="metric '+c+'"><div class="ml">'+esc(l)+'</div><div class="mv">'+esc(v)+'</div><div class="tiny">'+esc(s)+'</div></div>'}
function runFresh(run){const m=ageMinutes(run?.run_time);if(m==null)return {text:'无运行',tone:'bad'};if(m<=75)return {text:'更新 '+m+' 分钟前',tone:'good'};if(m<=180)return {text:'更新 '+m+' 分钟前',tone:'warn'};return {text:'已 '+m+' 分钟未更新',tone:'bad'}}
function shell(body){const f=runFresh(DATA?.hj?.run),n=activeNames();return '<div class="wrap"><div class="top"><div><div class="title">豪模型私人控制台</div><div class="subtitle">'+esc(n.hj)+' × '+esc(n.hc)+' · 数据源已切换至澳客/500 SP镜像 + William + 四机构亚洲盘</div></div><div class="topright"><span class="fresh '+f.tone+'">'+esc(f.text)+'</span><span class="lock">🔒 私人访问</span><button class="logout" onclick="logout()">退出</button></div></div><nav>'+[['dashboard','总览'],['haojing',n.hj],['haochuan',n.hc],['cumulative','累计'],['history','历史'],['sources','数据状态']].map(x=>'<button onclick="setTab(\''+x[0]+'\')" class="'+(TAB===x[0]?'active':'')+'">'+esc(x[1])+'</button>').join('')+'</nav><div class="actions"><button class="refresh" onclick="load(true)">🔄 立即刷新</button></div>'+body+'<div class="footer">页面每60秒读取一次数据库；缺失数据保持未确认，不用其他机构冒充补齐。最后API读取：'+esc(fmtTime(DATA?.server_time))+' · 版本：'+esc(APP_BUILD)+'</div></div>'}
function login(){clearInterval(AUTO_TIMER);document.getElementById('app').innerHTML='<div class="login"><form class="loginbox" id="lf"><h1>🔒 豪模型私人控制台</h1><div class="subtitle">私人版 · 自动读取当前active模型</div><div class="err" id="err">账号或密码不正确。</div><label>用户名</label><input id="u" autocomplete="username" value="hao"><label>密码</label><input id="p" type="password" autocomplete="current-password"><button>进入控制台</button></form></div>';document.getElementById('lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'?login=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const j=await r.json();if(r.ok&&j.token){localStorage.setItem('hao_console_token',j.token);load(true)}else document.getElementById('err').style.display='block'}catch(_){document.getElementById('err').style.display='block'}}}
function logout(){localStorage.removeItem('hao_console_token');DATA=null;login()}
async function load(show=false){if(!token()){login();return}if(show)document.getElementById('app').innerHTML='<div class="loading">正在读取最新冻结数据…</div>';try{const r=await fetch(API+'?api=1',{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(r.status===401){logout();return}const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DATA=j;render();clearInterval(AUTO_TIMER);AUTO_TIMER=setInterval(()=>{if(document.visibilityState==='visible')load(false)},60000)}catch(e){document.getElementById('app').innerHTML='<div class="loading">连接失败：'+esc(e.message)+'<br><br><button class="refresh" onclick="load(true)">重试</button></div>'}}
function setTab(t){TAB=t;DETAIL=null;render();scrollTo(0,0)}
function modelHeader(){const n=activeNames(),hm=activeByRole('hj'),cm=activeByRole('hc'),hr=DATA.hj?.run,cr=DATA.hc?.run,hcur=!!(hr&&hm&&Number(hr.model_revision_id)===Number(hm.id)),ccur=!!(cr&&cm&&Number(cr.model_revision_id)===Number(cm.id));return '<div class="hero"><div class="heroMain"><div class="heroTitle">当前正式模型</div><div class="heroValue">'+esc(n.hj)+' × '+esc(n.hc)+'</div><div class="tiny">豪竞：'+esc(hm?.revision_tag||'未登记')+'<br>豪传：'+esc(cm?.revision_tag||'未登记')+'</div></div><div class="heroSide">'+metric('豪竞当前修订',hcur?'已运行':'待运行',hr?fmtTime(hr.run_time):'暂无当前修订运行',hcur?'good':'warn')+metric('豪传当前修订',ccur?'已运行':'待运行',cr?fmtTime(cr.run_time):'等待任9赛前冻结运行',ccur?'good':'warn')+'</div></div>'}
function srcTone(status,count,total){if(status==='ok'&&count>0)return count>=total?'good':'warn';return count>0?'warn':'bad'}
function sourceCard(name,status,count,total,last,note){const c=srcTone(status,count,total);return '<div class="sourceCard '+c+'"><div class="row"><div class="sourceName">'+esc(name)+'</div><span class="pill '+c+'">'+(c==='good'?'✅ 正常':c==='warn'?'⚠️ 部分':'🔴 缺失')+'</span></div><div class="sourceVal">'+esc(count)+'/'+esc(total)+'</div><div class="sourceMeta">'+esc(note)+'<br>更新：'+esc(fmtTime(last))+'</div></div>'}
function sourceStatusSection(){const s=DATA.hj?.source_snapshot||{},sp=s.sp_mirrors||{},a=s.asia4||{},total=Number(s.total_matches||DATA.hj?.run?.total_matches||0)||0;const ok=sp.okooo||{},f=sp.fivehundred||{},bet=a.bet365||{},crown=a.crown||{},wah=a.william_ah||{},b12=a.bet12||{};let html='<section class="section"><div class="shead"><h2>📡 当前主链数据</h2><span>真实数据库覆盖 · 不再显示澳门/体彩官网直连</span></div><div class="sourcegrid">';html+=sourceCard('澳客 SP 主镜像',ok.status,ok.matched||0,total,ok.last_capture,'HAD '+(ok.had_matches||0)+'/'+total+' · HHAD '+(ok.hhad_matches||0)+'/'+total);html+=sourceCard('500 SP 核验镜像',f.status,f.matched||0,total,f.last_capture,'HAD '+(f.had_matches||0)+'/'+total+' · HHAD '+(f.hhad_matches||0)+'/'+total);const wh=s.william||{},whCount=Number(wh.matches??0),whStatus=wh.status||'missing',whLast=wh.last_capture||s.william_last_success;html+=sourceCard('William Hill 欧赔',whStatus,whCount,total,whLast,'同公司欧赔初→即→临/当前 · '+esc(wh.source_code||'主源'));html+=sourceCard('Bet365 亚洲盘',bet.status,bet.matches||0,total,bet.last_capture,'独立机构盘口+水位');html+=sourceCard('皇冠 亚洲盘',crown.status,crown.matches||0,total,crown.last_capture,'独立机构盘口+水位');html+=sourceCard('William AH',wah.status,wah.matches||0,total,wah.last_capture,'William Hill亚洲盘');html+=sourceCard('12Bet 亚洲盘',b12.status,b12.matches||0,total,b12.last_capture,'独立机构盘口+水位');html+='<div class="sourceCard '+(s.core_chain_complete?'good':'warn')+'"><div class="sourceName">模型主链闸门</div><div class="sourceVal">'+(s.core_chain_complete?'完整':'待运行确认')+'</div><div class="sourceMeta">逐场记录 '+(s.row_coverage||0)+'/'+total+'<br>本状态只读数据库，不在前端补算</div></div></div></section>';return html}
function playCard(title,p){if(!p)return '<div class="card feature"><div class="row"><b>'+title+'</b><span class="warn">未冻结</span></div><div class="tiny">模型本轮没有保存该项正式输出。</div></div>';const st=String(p.status||p.state||'READY').toUpperCase();if(/PASS|NO_TICKET|DISABLED|UNAVAILABLE/.test(st))return '<div class="card feature"><div class="row"><b>'+title+'</b><span class="bad">⛔ PASS</span></div><div class="tiny">'+esc(p.reason||p.note||'模型正式输出为PASS')+'</div></div>';const legs=Array.isArray(p.legs)?p.legs:Array.isArray(p.selections)?p.selections:[];return '<div class="card feature"><div class="row"><b>'+title+'</b><span class="good">✅ 正式</span></div><div class="bigpick">'+esc(legs.map(l=>typeof l==='string'?l:[l.match_no,l.home_team&&l.away_team?l.home_team+'-'+l.away_team:'',l.pick||l.top1||''].filter(Boolean).join(' ')).join(' × ')||p.text||'已冻结')+'</div><div class="tiny">'+esc(p.reason||p.note||'')+'</div></div>'}
function plays(){const rec=DATA.hj?.recommendations,s=rec?.saved||{};return '<section class="section"><div class="shead"><h2>🔥 当前可执行玩法</h2><span>'+esc(DATA.hj?.run?.pool_label||'暂无竞彩池')+'</span></div><div class="cards">'+(rec?.eligible?playCard('🟢 A 最稳二串一',s.A||s.a||s.safe2)+playCard('🟡 B 性价比二串一',s.B||s.b||s.value2)+playCard('🔵 C 三串一',s.C||s.c||s.triple3):'<div class="card feature" style="grid-column:1/-1"><div class="row"><b>当前结论</b><span class="bad">⛔ PASS / 不可执行</span></div><div class="tiny">'+esc(rec?.reason||'当前无正式可执行输出')+'</div></div>')+'</div></section>'}
function statusZh(v){
 const s=String(v||'');
 const m={
  'NO_ANCHOR_RED':'🔴 红灯淘汰',
  'REVIEW_YELLOW':'🟡 黄灯复核',
  'ANCHOR_ELIGIBLE':'🟢 正式稳腿',
  'HAD_ANCHOR_ELIGIBLE':'🟢 正式稳腿',
  'NO_ANCHOR_QUALITY':'⚠️ 未达稳腿标准',
  'NO_ANCHOR_TEACHER_STRONG_CONFLICT':'🔴 二审强冲突淘汰',
  'NO_ANCHOR_TEACHER_REVIEW':'🟡 二审复核淘汰',
  'TEACHER_STRONG_CONFLICT_REMOVE':'🔴 二审强冲突淘汰',
  'TEACHER_REVIEW_NO_REPROOF_REMOVE':'🟡 二审复核未获再证明',
  'FAIL_HAD_QUALITY':'⚠️ 未达稳腿标准',
  'NO_ANCHOR_SP_UNAVAILABLE':'⛔ SP数据不足',
  'FAIL_ALL_SP_UNAVAILABLE':'⛔ 数据不足',
  'HHAD_REVIEW_CONFLICT':'🟠 让球冲突',
  'HHAD_POISSON_CONFLICT':'🟠 让球冲突',
  'HHAD_POISSON_UNAVAILABLE':'⚪ Poisson未确认',
  'HHAD_MARKET_ONLY':'⚪ 仅市场让球判断',
  'HHAD_POISSON_COMPLETE':'✅ 让球Poisson确认',
  'HHAD_POISSON_ALIGNED':'✅ 让球同向确认',
  'R9_RETAINED':'✅ 任9保留',
  'R9_DISCARDED':'⛔ 任9舍弃',
  'PASS':'⛔ PASS'
 };
 return m[s]||s||'—';
}
function statusRaw(v){return esc(statusZh(v))}

function renderCumulative(){const c=DATA.cumulative||{},h=c.hj||{},r=c.hc||{};return '<div class="grid4">'+metric('豪竞正式Top1',(h.hits||0)+'/'+(h.scored||0),pct(h.hits,h.scored))+metric('豪竞正式竞彩日',String(h.days||0),'完整正式样本')+metric('豪传9/9',String(r.full9||0),'正式期数 '+String(r.issues||0))+metric('豪传累计票面',(r.hits||0)+'/'+(r.scored||0),pct(r.hits,r.scored))+'</div><section class="section"><div class="shead"><h2>决策质量</h2><span>正式累计</span></div><div class="grid4" style="padding:12px">'+metric('Anchor',(h.anchorHits||0)+'/'+(h.anchorScored||0),pct(h.anchorHits,h.anchorScored))+metric('高信心',(h.highHits||0)+'/'+(h.highScored||0),pct(h.highHits,h.highScored))+metric('PASS隔离',String(h.passIsolated||0),'错误场成功隔离')+metric('PASS误杀',String(h.passFalseKills||0),'被PASS但Top1命中')+'</div></section>'}
function renderHistory(){const arr=DATA.history||[];return '<section class="section"><div class="shead"><h2>历史运行记录</h2><span>点击查看逐场明细</span></div><div class="tablewrap"><table><thead><tr><th>日期</th><th>模型</th><th>修订</th><th>池</th><th>状态</th><th>完整</th><th>正式</th><th>运行时间</th></tr></thead><tbody>'+arr.map(r=>'<tr class="clickrow" onclick="openRun('+Number(r.id)+')"><td>'+esc(r.pool_date)+'</td><td><b>'+esc(r.model_name)+' '+esc(r.model_version||'')+'</b></td><td>'+esc(r.model_revision_tag||'未记录')+'</td><td>'+esc(r.pool_label||r.pool_kind||'—')+'</td><td>'+esc(r.status||'—')+'</td><td>'+(r.data_complete?'✅':'⚠️')+'</td><td>'+(r.formal_allowed?'✅':'否')+'</td><td>'+esc(fmtTime(r.run_time))+'</td></tr>').join('')+'</tbody></table></div></section>'}
async function openRun(id){document.getElementById('app').innerHTML='<div class="loading">正在读取历史复盘…</div>';try{const r=await fetch(API+'?api=1&run_id='+id,{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DETAIL={history:j.detail};TAB='history';render()}catch(e){DETAIL=null;render()}}
function historyDetail(){const d=DETAIL?.history;if(!d)return null;const run=d.run||{},rows=d.rows||[];return '<div><button class="backbtn" onclick="DETAIL=null;render()">← 返回历史</button></div><div class="grid4" style="margin-top:10px">'+metric('日期',run.pool_date||'—',run.pool_label||'')+metric('模型',run.model_name||'—',run.model_revision_tag||'')+metric('状态',run.status||'—',run.formal_allowed?'正式':'仅复盘')+metric('逐场记录',String(rows.length),'run_id '+run.id)+'</div><section class="section"><div class="tablewrap"><table><thead><tr><th>场</th><th>对阵</th><th>Top1</th><th>第二</th><th>票面</th><th>DQ</th><th>HUR</th><th>DTR</th><th>DLR</th><th>处理</th><th>赛果</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.match_no)+'</td><td>'+esc(r.home_team)+' - '+esc(r.away_team)+'</td><td>'+esc(r.top1||'—')+'</td><td>'+esc(r.second_pick||'—')+'</td><td>'+esc(r.ticket_pick_after_gate||r.ticket_pick||'—')+'</td><td>'+esc(r.dq||'—')+'</td><td>'+esc(r.hur||'—')+'</td><td>'+esc(r.dtr||'—')+'</td><td>'+esc(r.dlr||'—')+'</td><td>'+esc(r.final_handling||r.keep_discard||'—')+'</td><td>'+esc(result(r))+'</td></tr>').join('')+'</tbody></table></div></section>'}
function renderSources(){return sourceStatusSection()+'<section class="section"><div class="shead"><h2>数据纪律</h2><span>新主链正式展示口径</span></div><div class="cards"><div class="card"><b>竞彩SP</b><div class="tiny">澳客为主镜像，500为备用/交叉核验。两边保留真实来源标签，不冒充Sporttery官网直连；冲突时降DQ并保持未确认。</div></div><div class="card"><b>亚洲盘委员会</b><div class="tiny">Bet365、皇冠、William Hill亚洲盘、12Bet分别核验，不互相冒充；同向不按机构数量机械重复加权。</div></div><div class="card"><b>欧赔</b><div class="tiny">William Hill同公司欧赔初→即→临/当前；外围平均欧赔不能补成William。</div></div><div class="card"><b>刷新原则</b><div class="tiny">数据库无新赛前快照时保持原状态；开赛后不把赛中赔率写回赛前冻结。</div></div></div></section>'}
function render(){if(!DATA)return;let b;if(DETAIL?.history)b=historyDetail();else if(DETAIL?.row)b=matchDetail();else if(TAB==='dashboard')b=dashboard();else if(TAB==='haojing')b=renderHaojing();else if(TAB==='haochuan')b=renderHaochuan();else if(TAB==='cumulative')b=renderCumulative();else if(TAB==='history')b=renderHistory();else b=renderSources();document.getElementById('app').innerHTML=shell(b)}
checkBuildVersion();setInterval(checkBuildVersion,30000);load(true);
</script>
</body>
</html>
