<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>索伦引擎</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#20242b;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:#f7f8fa;padding-bottom:78px}.head{background:linear-gradient(135deg,#17191e,#343942);color:#fff;padding:22px 18px 26px;border-radius:0 0 24px 24px}.brand{font-size:22px;font-weight:900;letter-spacing:1px}.sub{font-size:12px;color:#bfc5cf;margin-top:5px}.hero{margin-top:18px;display:flex;justify-content:space-between;align-items:end}.hero b{font-size:27px}.hero span{font-size:12px;color:#d6dae0}.content{padding:14px}.notice{background:#fff;border-radius:14px;padding:13px 14px;font-size:12px;color:#69707b;box-shadow:0 2px 12px #00000008;margin-bottom:12px}.sectiontitle{font-size:17px;font-weight:850;margin:17px 2px 10px}.match{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 14px #00000008}.meta{display:flex;justify-content:space-between;color:#9299a3;font-size:11px}.teams{font-size:16px;font-weight:800;margin:11px 0}.picks{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#f1f3f5;border-radius:8px;padding:7px 9px;font-size:12px}.tag.main{background:#22262d;color:#fff}.confidence{font-size:11px;color:#8d949d;margin-top:10px}.empty{text-align:center;color:#9aa0a8;padding:50px 15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#fff;border-radius:14px;padding:14px 8px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#9299a3}.usercard{background:linear-gradient(135deg,#252932,#111318);color:white;border-radius:18px;padding:20px}.avatar{width:52px;height:52px;border-radius:50%;background:#fff;color:#20242b;display:grid;place-items:center;font-weight:900;font-size:20px}.userrow{display:flex;gap:13px;align-items:center}.vip{font-size:11px;background:#d9b76e;color:#272117;padding:4px 7px;border-radius:6px;display:inline-block;margin-top:5px}.menu{background:#fff;border-radius:15px;margin-top:12px;overflow:hidden}.menu div{padding:15px;border-bottom:1px solid #f0f1f3;font-size:14px}.menu div:last-child{border:0}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:#fff;border-top:1px solid #eceef1;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:10}.tab{border:0;background:transparent;color:#969ca5;font-size:11px}.tab b{display:block;font-size:20px;margin-bottom:2px}.tab.active{color:#17191d;font-weight:800}.loading{text-align:center;padding:50px;color:#999}.hit{color:#168d55}.miss{color:#d64b57}@media(min-width:700px){body{background:#e9ebee}.app{box-shadow:0 0 30px #00000012}}</style></head><body><main class="app"><div id="page"></div></main><nav class="tabbar"><button class="tab active" data-tab="home"><b>⌂</b>首页</button><button class="tab" data-tab="matches"><b>▦</b>赛事</button><button class="tab" data-tab="history"><b>✓</b>战绩</button><button class="tab" data-tab="user"><b>○</b>我的</button></nav><script>const API='https://ttydbcejxqxdkcfoizkj.supabase.co/functions/v1/soren-public-api-v1';let TODAY=[],HISTORY=[],tab='home';const page=document.getElementById('page');const nameResult=x=>x==='H'?'主胜':x==='D'?'平':x==='A'?'客胜':'—';async function load(view){const r=await fetch(API+'?view='+view,{cache:'no-store'});const j=await r.json();if(!j.ok)throw Error('load');return j.rows||[]}function card(x){return `<div class="match"><div class="meta"><span>${x.no||''} · ${x.league||''}</span><span>${x.version?'索伦 '+x.version:''}</span></div><div class="teams">${x.home} <span style="color:#a2a7ae;font-weight:500">vs</span> ${x.away}</div><div class="picks">${x.direction&&x.direction!=='PASS'?`<span class="tag main">${x.direction}</span>`:`<span class="tag">观察</span>`}${x.handicap?`<span class="tag">${x.handicap}</span>`:''}${x.verified?`<span class="tag ${x.top1Hit?'hit':'miss'}">赛果 ${nameResult(x.result)} · ${x.top1Hit?'命中':'未中'}</span>`:''}</div><div class="confidence">模型置信度 ${x.confidence??'—'}%</div></div>`}function home(){const picks=TODAY.filter(x=>x.direction&&x.direction!=='PASS');page.innerHTML=`<header class="head"><div class="brand">索伦引擎</div><div class="sub">足球赛事智能分析平台</div><div class="hero"><div><span>今日精选</span><br><b>${picks.length}</b></div><span>数据持续更新</span></div></header><section class="content"><div class="notice">分析结果仅作赛事研究与交流参考，请理性判断。</div><div class="sectiontitle">今日精选</div>${picks.length?picks.slice(0,6).map(card).join(''):'<div class="empty">今日暂无正式精选</div>'}</section>`}function matches(){page.innerHTML=`<header class="head"><div class="brand">今日赛事</div><div class="sub">索伦引擎 3.3 · 正式发布数据</div></header><section class="content">${TODAY.length?TODAY.map(card).join(''):'<div class="empty">暂无赛事数据</div>'}</section>`}function history(){const done=HISTORY.filter(x=>x.verified),hits=done.filter(x=>x.top1Hit).length;page.innerHTML=`<header class="head"><div class="brand">历史战绩</div><div class="sub">仅统计已核验赛果</div></header><section class="content"><div class="stats"><div class="stat"><b>${done.length}</b><span>已核验</span></div><div class="stat"><b>${hits}</b><span>Top1命中</span></div><div class="stat"><b>${done.length?Math.round(hits/done.length*100):0}%</b><span>命中率</span></div></div><div class="sectiontitle">最近赛果</div>${done.slice(0,30).map(card).join('')}</section>`}function user(){page.innerHTML=`<header class="head"><div class="brand">我的</div><div class="sub">索伦引擎会员中心</div></header><section class="content"><div class="usercard"><div class="userrow"><div class="avatar">索</div><div><b>索伦用户</b><br><span class="vip">FREE</span></div></div></div><div class="menu"><div>会员中心 <span style="float:right">›</span></div><div>我的收藏 <span style="float:right">›</span></div><div>浏览记录 <span style="float:right">›</span></div><div>关于索伦引擎 <span style="float:right">›</span></div></div></section>`}function render(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));({home,matches,history,user}[tab])()}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;render()});(async()=>{page.innerHTML='<div class="loading">正在连接索伦引擎…</div>';try{[TODAY,HISTORY]=await Promise.all([load('today'),load('history')]);render()}catch(e){page.innerHTML='<div class="empty">暂时无法连接数据，请稍后刷新</div>'}})();</script></body></html>
