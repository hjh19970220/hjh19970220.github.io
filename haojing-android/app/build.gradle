plugins {
    id 'com.android.application'
}

android {
    namespace 'com.haojing.client'
    compileSdk 35

    defaultConfig {
        applicationId 'com.haojing.client'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.7.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
