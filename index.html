<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国学生活助手 · 测试版</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#254439;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 70px}header{padding:26px 8px 20px;text-align:center}header small{letter-spacing:5px;color:#9b7e49}h1{font-size:32px;margin:12px 0}p{color:#748078;line-height:1.7}.card{background:#fffefa;border:1px solid #e9dfcf;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #294c3309}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:1px solid #e9e4d7;border-radius:15px;background:#fff;padding:18px 5px;text-align:center;cursor:pointer;color:#244639;min-height:110px}.tile i{font-size:29px;display:block;font-style:normal;margin-bottom:10px}.tile b{font-size:14px}.tile small{display:block;color:#87948b;font-size:11px;margin-top:6px}.tile:active{background:#e9f0e8}h2{font-size:20px;margin:0 0 15px}.panel{display:none}.panel.active{display:block}label{display:block;font-size:13px;color:#68796e;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d9dace;border-radius:10px;background:white;font-size:16px;color:#244639}button.primary{width:100%;border:0;background:#275240;color:white;padding:14px;border-radius:12px;margin-top:18px;font-size:16px}.back{border:0;background:#e7eee7;color:#275240;padding:9px 14px;border-radius:9px;margin-bottom:15px}.result{margin-top:16px;padding:16px;border-radius:12px;background:#f1f5ef;line-height:1.9}.notice{font-size:13px;color:#8a866f}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}footer{text-align:center;font-size:12px;color:#999;margin-top:35px}a{color:#275240}</style></head><body><main class="wrap"><header><small>中华传统文化 · 生活工具</small><h1>国学生活助手</h1><p>历法 · 八字 · 起名 · 生肖 · 诗词</p></header><div id="home"><section class="card"><h2>传统文化工具箱</h2><div class="grid"><button class="tile" onclick="location.href='bazi/'"><i>🔮</i><b>八字五行</b><small>已开放</small></button><button class="tile" onclick="show('name')"><i>👶</i><b>宝宝起名</b><small>已开放</small></button><button class="tile" onclick="show('zodiac')"><i>🐉</i><b>生肖查询</b><small>已开放</small></button><button class="tile" onclick="show('star')"><i>✨</i><b>星座查询</b><small>已开放</small></button><button class="tile" onclick="show('calendar')"><i>📅</i><b>节气与农历</b><small>测试功能</small></button><button class="tile" onclick="show('five')"><i>📖</i><b>姓名文化</b><small>已开放</small></button><button class="tile" onclick="show('soon')"><i>❤️</i><b>八字合婚</b><small>规划中</small></button><button class="tile" onclick="show('soon')"><i>☯️</i><b>周易排盘</b><small>规划中</small></button><button class="tile" onclick="show('soon')"><i>🌌</i><b>紫微斗数</b><small>规划中</small></button></div></section><section class="card"><h2>今日推荐</h2><p>输入出生日期，探索传统干支历与五行文化。基础工具免费使用，无需注册。</p><button class="primary" onclick="location.href='bazi/'">开始八字五行查询 →</button></section></div><section class="card panel" id="panel"><button class="back" onclick="back()">← 返回首页</button><h2 id="title"></h2><div id="body"></div><div id="out" class="result" style="display:none"></div></section><footer>传统民俗文化及趣味参考，不用于科学命运预测 · 测试版</footer></main><script>const $=id=>document.getElementById(id);const names=['梓涵','沐辰','清禾','知远','若溪','书瑶','景行','云舒','怀瑾','嘉言','予安','星澜','明轩','诗宁','思齐','望舒','清越','锦书','亦舟','乐知'];const meanings={'梓':'树木，寓意成长','涵':'包容、涵养','沐':'润泽','辰':'星辰与时光','清':'清澈、纯净','禾':'谷物、丰收','知':'知识、明理','远':'志向长远','若':'如、似','溪':'溪流','书':'书香、学识','瑶':'美玉','景':'景致、敬仰','行':'行动、实践','云':'云彩','舒':'舒展、从容','怀':'胸怀','瑾':'美玉','嘉':'美好','言':'言语、诚信','予':'给予','安':'安宁'};function show(k){$('home').style.display='none';$('panel').classList.add('active');$('out').style.display='none';let title='',body='';if(k==='name'){title='宝宝起名灵感';body='<label>姓氏</label><input id="surname" placeholder="例如：陈" maxlength="2"><label>宝宝性别</label><select id="gender"><option value="boy">男宝宝</option><option value="girl">女宝宝</option><option value="neutral">不限 / 中性</option></select><label>风格</label><select id="style"><option value="0">清雅诗意</option><option value="1">明朗大气</option><option value="2">温柔自然</option></select><button class="primary" onclick="makeNames()">生成名字参考</button>'}else if(k==='zodiac'){title='生肖查询';body='<label>出生年份（公历）</label><input id="zy" type="number" value="1997"><button class="primary" onclick="zodiac()">查询生肖</button><p class="notice">生肖年份传统上有立春或春节两种划分口径；此工具按公历年份粗略查询，年初出生请以专业历法核对。</p>'}else if(k==='star'){title='星座查询';body='<div class="row"><div><label>出生月份</label><input id="sm" type="number" min="1" max="12" value="8"></div><div><label>出生日期</label><input id="sd" type="number" min="1" max="31" value="18"></div></div><button class="primary" onclick="star()">查询星座</button>'}else if(k==='calendar'){title='农历与节气';body='<p>公历日期与农历转换请使用八字五行页面中的出生日期功能。二十四节气完整日历正在开发。</p><button class="primary" onclick="location.href=\'bazi/\'">前往历法查询</button>'}else if(k==='five'){title='姓名文化解析';body='<label>输入名字</label><input id="fullName" maxlength="8" placeholder="输入姓名"><button class="primary" onclick="meaning()">查看汉字文化寓意</button><p class="notice">当前仅收录部分常见汉字，暂不提供无依据的姓名分数。</p>'}else{title='功能开发中';body='<p>此功能尚未完成算法与测试，暂不展示虚构的计算结果。</p>'}$('title').textContent=title;$('body').innerHTML=body;window.scrollTo(0,0)}function back(){$('panel').classList.remove('active');$('home').style.display='block'}function result(t){$('out').style.display='block';$('out').innerHTML=t}function makeNames(){const surname=$('surname').value.trim()||'林',style=+$('style').value,gender=$('gender').value;const pool={boy:[['知远','景行','怀瑾','思齐','亦舟','清越','书衡'],['明轩','沐辰','嘉言','修远','承宇','星野','卓然'],['云舟','清川','柏舟','景澄','予安','青山','林深']],girl:[['若溪','书瑶','清禾','锦书','诗宁','知微','云舒'],['星澜','嘉宁','昭月','明玥','清妍','念初','舒窈'],['沐晴','芷宁','语汐','南栀','溪月','雨桐','安禾']],neutral:[['知远','清禾','云舒','思齐','予安','清越','锦书'],['沐辰','星澜','嘉言','明轩','诗宁','望舒','书瑶'],['亦舟','清川','安禾','云舟','青禾','景澄','若溪']]};const list=pool[gender][style];result('<b>'+(gender==='boy'?'男宝宝':gender==='girl'?'女宝宝':'中性')+'名字灵感</b><br>'+list.map(n=>surname+n).join(' · ')+'<p class="notice">按性别偏好和风格筛选，仅供文化参考；名字不限定性别，也不代表八字喜用神判断。</p>')}function zodiac(){const y=+$('zy').value;if(y<1||y>9999)return result('请输入有效年份');const a='鼠牛虎兔龙蛇马羊猴鸡狗猪';result(y+'年对应生肖（粗略）：<b>'+a[(y-4%12+12000)%12]+'</b>')}function star(){const m=+$('sm').value,d=+$('sd').value;if(m<1||m>12||d<1||d>31||new Date(2024,m-1,d).getMonth()!==m-1)return result('请输入有效日期');const cut=[20,19,21,20,21,22,23,23,23,24,23,22];const a=['摩羯座','水瓶座','双鱼座','白羊座','金牛座','双子座','巨蟹座','狮子座','处女座','天秤座','天蝎座','射手座'];result('西方太阳星座（常用日期划分）：<b>'+a[(m-1+(d>=cut[m-1]?1:0))%12]+'</b>')}function meaning(){const n=$('fullName').value.trim();if(!n)return result('请输入姓名');result([...n].map(c=>'<b>'+c+'</b>：'+(meanings[c]||'暂未收录此字的文化寓意')).join('<br>'))}</script></body></html>
