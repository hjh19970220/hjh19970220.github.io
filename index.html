<body>
<div id="app"><div class="loading">正在连接豪模型控制台…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';
const APP_BUILD='2026-09-01 强制版本刷新+情报修复v2';
let DATA=null,TAB='dashboard',AUTO_TIMER=null,DETAIL=null,RESET_HJ_SCROLL=false;
async function checkBuildVersion(){try{const r=await fetch('/version.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(j&&j.build&&j.build!==APP_BUILD){const u=new URL(location.href);u.searchParams.set('v',j.build);u.searchParams.set('t',Date.now());location.replace(u.toString());return true}return false}catch(_){return false}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?(a*100/b).toFixed(1)+'%':'—';
const fmtTime=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return String(v)}};
const ageMinutes=v=>v?Math.max(0,Math.round((Date.now()-new Date(v).getTime())/60000)):null;
const code=v=>v==='主胜'?'3':v==='平'?'1':v==='客胜'?'0':'';
const hitTop=r=>!!(r.top1&&r.result_verified&&code(r.top1)===r.result_1x2);
const hitTicket=r=>!!(r.ticket_pick&&r.result_verified&&String(r.ticket_pick).includes(String(r.result_1x2)));
const result=r=>!r.result_verified?'待结算':(r.result_home??'?')+'-'+(r.result_away??'?')+' · '+(r.result_1x2==='3'?'主胜':r.result_1x2==='1'?'平':'客胜');
function token(){return localStorage.getItem('hao_console_token')||''}
function activeNames(){const ks=Object.keys(DATA?.active_models||{});const hj=DATA?.role_models?.hj||ks.find(k=>k.includes('豪竟')||k.includes('豪竞'))||'豪竞';const hc=DATA?.role_models?.hc||ks.find(k=>k.includes('豪传'))||'豪传';const hb=DATA?.role_models?.hb||ks.find(k=>k.includes('豪篮'))||'豪篮1.0';return {hj,hc,hb}}
function activeByRole(role){const n=activeNames(),name=role==='hj'?n.hj:role==='hc'?n.hc:n.hb;return DATA?.active_models?.[name]||null}
function metric(l,v,s='',c=''){return '<div class="metric '+c+'"><div class="ml">'+esc(l)+'</div><div class="mv">'+esc(v)+'</div><div class="tiny">'+esc(s)+'</div></div>'}
function runFresh(run){const m=ageMinutes(run?.run_time);if(m==null)return {text:'模型无运行',tone:'bad'};if(m<=75)return {text:'模型更新 '+m+' 分钟前',tone:'good'};if(m<=180)return {text:'模型更新 '+m+' 分钟前',tone:'warn'};return {text:'模型已 '+m+' 分钟未运行',tone:'bad'}}
function nextModelRunText(){const now=DATA?.server_time?new Date(DATA.server_time):new Date(),parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now),p={};for(const x of parts)p[x.type]=x.value;const h=Number(p.hour),m=Number(p.minute),slots=[12,14,16,18,20,21,22],n=slots.find(x=>x>h||(x===h&&m<1));if(n!=null)return String(n).padStart(2,'0')+':00';return '明天 12:00'}
function shell(body){const f=runFresh(DATA?.hj?.run),n=activeNames();return '<div class="wrap"><div class="top"><div><div class="title">豪模型私人控制台</div><div class="subtitle">'+esc(n.hj)+' × '+esc(n.hc)+' × '+esc(n.hb)+' · 足球 + 竞彩篮球量化控制台</div></div><div class="topright"><span class="fresh good">页面同步 '+esc(fmtTime(DATA?.server_time))+'</span><span class="fresh '+f.tone+'">'+esc(f.text)+' · 下次三模型 '+esc(nextModelRunText())+'</span><span class="lock">🔒 私人访问</span><button class="logout" onclick="logout()">退出</button></div></div><nav>'+[['dashboard','总览'],['haojing',n.hj],['haochuan',n.hc],['haolan',n.hb],['cumulative','累计'],['history','历史'],['sources','数据状态']].map(x=>'<button onclick="setTab(\''+x[0]+'\')" class="'+(TAB===x[0]?'active':'')+'">'+esc(x[1])+'</button>').join('')+'</nav><div class="actions"><button class="refresh" onclick="load(true)">🔄 立即刷新</button></div>'+body+'<div class="footer">页面每60秒读取一次数据库；三模型自动时段：12/14/16/18/20/21/22点（北京时间），周末追加22:30；系统每小时自动自检并安全自愈。缺失数据保持未确认，不用其他机构冒充补齐。最后API读取：'+esc(fmtTime(DATA?.server_time))+' · 版本：'+esc(APP_BUILD)+'</div></div>'}
function login(){clearInterval(AUTO_TIMER);document.getElementById('app').innerHTML='<div class="login"><form class="loginbox" id="lf"><h1>🔒 豪模型私人控制台</h1><div class="subtitle">私人版 · 自动读取当前active模型</div><div class="err" id="err">账号或密码不正确。</div><label>用户名</label><input id="u" autocomplete="username" value="hao"><label>密码</label><input id="p" type="password" autocomplete="current-password"><button>进入控制台</button></form></div>';document.getElementById('lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'?login=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const j=await r.json();if(r.ok&&j.token){localStorage.setItem('hao_console_token',j.token);load(true)}else document.getElementById('err').style.display='block'}catch(_){document.getElementById('err').style.display='block'}}}
function logout(){localStorage.removeItem('hao_console_token');DATA=null;login()}
async function load(show=false){if(await checkBuildVersion())return;if(!token()){login();return}if(show)document.getElementById('app').innerHTML='<div class="loading">正在读取最新冻结数据…</div>';try{const r=await fetch(API+'?api=1&t='+Date.now(),{headers:{Authorization:'Bearer '+token(),'Cache-Control':'no-cache'},cache:'no-store'});if(r.status===401){logout();return}const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DATA=j;render();clearInterval(AUTO_TIMER);AUTO_TIMER=setInterval(()=>{if(document.visibilityState==='visible')load(false)},60000)}catch(e){document.getElementById('app').innerHTML='<div class="loading">连接失败：'+esc(e.message)+'<br><br><button class="refresh" onclick="load(true)">重试</button></div>'}}
function setTab(t){TAB=t;DETAIL=null;if(t==='haojing')RESET_HJ_SCROLL=true;render();scrollTo(0,0)}
function modelHeader(){const n=activeNames(),hm=activeByRole('hj'),cm=activeByRole('hc'),bm=activeByRole('hb'),hr=DATA.hj?.run,ha=DATA.hj?.latest_attempt,cr=DATA.hc?.run,ca=DATA.hc?.latest_attempt,br=DATA.hb?.run,hcur=!!(hr&&hm&&Number(hr.model_revision_id)===Number(hm.id)),ccur=!!(cr&&cm&&Number(cr.model_revision_id)===Number(cm.id)),bcur=!!(br&&bm&&Number(br.model_revision_id)===Number(bm.id)),hFrozen=!!(hr&&ha&&Number(hr.total_matches||0)>0&&Number(ha.total_matches||0)===0&&String(ha.pool_date||'')>String(hr.pool_date||'')),hcFrozen=!!(cr&&ca&&Number(cr.id)!==Number(ca.id));const hState=hcur?'已运行':hFrozen?'冻结盘':'待运行',hMeta=hFrozen?('继续展示 '+String(hr.pool_date||'上一销售日')+' · 新销售池尚未建立'):(hr?fmtTime(hr.run_time):'暂无当前修订运行'),hcState=hcFrozen?'冻结盘':ccur?'已运行':'待运行',hcMeta=hcFrozen?('当前 '+String(ca?.pool_label||'新期')+' 数据不足 · 继续展示 '+String(cr?.pool_label||'上一有效期')):(cr?fmtTime(cr.run_time):'等待任9赛前冻结运行');return '<div class="hero"><div class="heroMain"><div class="heroTitle">当前正式模型</div><div class="heroValue">'+esc(n.hj)+' × '+esc(n.hc)+' × '+esc(n.hb)+'</div><div class="tiny">豪竞：'+esc(hm?.revision_tag||'未登记')+'<br>豪传：'+esc(cm?.revision_tag||'未登记')+'<br>豪篮：'+esc(bm?.revision_tag||'未登记')+'</div></div><div class="heroSide">'+metric('豪竞当前销售池',hState,hMeta,hcur?'good':hFrozen?'warn':'warn')+metric('豪传当前修订',hcState,hcMeta,hcFrozen?'warn':ccur?'good':'warn')+metric('豪篮当前修订',bcur?'已运行':'待数据',br?fmtTime(br.run_time):'等待竞彩篮球在售池接入',bcur?'good':'warn')+'</div></div>'}
function srcTone(status,count,total){if(status==='ok'&&count>0)return count>=total?'good':'warn';return count>0?'warn':'bad'}

 const acts=Array.isArray(x.actions)?x.actions:[],bad=Array.isArray(x.unresolved)?x.unresolved:[],rs=x.run_status||{};
 const snap=H.last_snapshot||{},ago=ageMinutes(x.checked_at);

 html+='<div class="cards" style="padding:0 12px 12px"><div class="card"><b>豪竞</b><div class="tiny" style="margin-top:6px">'+esc(modelState(rs.haojing,'豪竞'))+'</div></div><div class="card"><b>豪传</b><div class="tiny" style="margin-top:6px">'+esc(modelState(rs.haochuan,'豪传'))+'</div></div><div class="card"><b>豪篮</b><div class="tiny" style="margin-top:6px">'+esc(modelState(rs.haolan,'豪篮'))+'</div></div></div>';
 if(bad.length)html+='<div class="notice bad" style="margin:0 12px 12px"><b>未解决：</b> '+esc(bad.map(v=>v.type||'unknown').join('、'))+'</div>';
 else if(acts.length)html+='<div class="notice warn" style="margin:0 12px 12px">🛠️ 本轮已自动处理：'+esc(acts.map(v=>v.type||'repair').join('、'))+'</div>';

 return html+'</section>';
}

 '</section>';
}
function renderHaochuan(){const a=activeByRole('hc'),r=DATA.hc?.run,latest=DATA.hc?.latest_attempt,cur=!!(a&&r&&Number(a.id)===Number(r.model_revision_id)),frozen=!!(r&&latest&&Number(r.id)!==Number(latest.id));const msg=frozen?('🧊 当前 '+esc(latest?.pool_label||'新一期')+' 关键赛前主链尚未形成，最新PASS空跑只保留后台审计，不再覆盖主表。下面继续展示 '+esc(r?.pool_label||'上一有效期')+' 的有效冻结盘；上方情报卡仍可显示当前期已抓到的情报。'):(cur?'✅ 豪传当前active修订已有运行结果。先看下面“本期结论”，需要时再展开逐场明细。':'⚠️ 豪传2.3当前还没有形成可展示的有效任9冻结盘；未确认不得猜。');return modelHeader()+'<div class="notice '+(frozen?'warn':cur?'good':'warn')+'">'+msg+'</div>'+hcSummary()+intelStatusSection('hc')+rowsTable('hc')+sourceStatusSection()}
function hbPct(v){return v==null?'—':(Number(v)*100).toFixed(1)+'%'}
function hbLight(v){const x=String(v||'').toUpperCase();if(/GREEN|绿|ELIGIBLE|READY/.test(x))return '🟢 通过';if(/YELLOW|黄|REVIEW/.test(x))return '🟡 复核';if(/RED|红|PASS|BLOCK/.test(x))return '🔴 淘汰';return v||'⚪ 未确认'}
function renderHaolan(){const n=activeNames(),a=activeByRole('hb'),run=DATA.hb?.run,rows=DATA.hb?.rows||[],cur=!!(a&&run&&Number(a.id)===Number(run.model_revision_id));let h=modelHeader();const hs=DATA?.sources?.health||[],hb500=hs.find(x=>x.source_code==='hb_500_jclq_live')||{},hbform=hs.find(x=>x.source_code==='hb_recent_form')||{};h+='<div class="notice '+(cur?'good':'warn')+'">'+(cur?'✅ 豪篮当前active修订已有竞彩篮球赛前运行。':'🏀 豪篮自动链已经接通；当前若没有真实在售池就等待，不生成0场假run、不猜比赛。')+'</div>';
h+='<section class="section"><div class="shead"><h2>🏀 豪篮1.0｜竞彩篮球自动运行架构</h2><span>机构级目标 · 当前Bootstrap自动链</span></div><div class="cards"><div class="card feature"><b>预计比分引擎</b><div class="tiny">回合数 × 对手调整攻防效率 × 阵容 × 赛程 × 对位 → 主客预计得分；联合建模分差与总分，并做至少2万次模拟。</div></div><div class="card feature"><b>胜负闸门</b><div class="tiny">输出主/客胜率、公平赔率、竞彩隐含概率与价值差。初始正式候选：胜率≥60%、相对市场Edge≥4个百分点、DQ-A/B。</div></div><div class="card feature"><b>让分闸门</b><div class="tiny">先判断能不能赢，再判断赢多少。初始候选：穿盘率≥56.5%、模型分差与官方线差≥1.5分。</div></div><div class="card feature"><b>大小分闸门</b><div class="tiny">由预期回合与攻防效率共同生成总分分布。初始候选：概率≥56.5%、模型总分与官方线差≥3分。</div></div><div class="card"><b>阵容与伤停</b><div class="tiny">核心球员Questionable不只做文字提示，而是多情景模拟并扩大方差；足以改变方向时直接红灯PASS。</div></div><div class="card"><b>市场与数据质量</b><div class="tiny">竞彩SP为目标市场；主流篮球盘用于校准与异常审计。数据按DQ-A/B/C/D分层，缺核心盘口、伤停或球队匹配时不形成正式腿。</div></div></div></section>';
h+='<section class="section"><div class="shead"><h2>📡 豪篮自动数据链</h2><span>每轮运行前自动刷新</span></div><div class="sourcegrid">'+sourceCard('500竞彩篮球池/市场',hb500.status||'missing',Number(hb500.verified_matches||0),Number(hb500.expected_matches||0),hb500.last_success_at||hb500.last_attempt_at,'胜负/让分/大小分镜像 · 空池不猜')+sourceCard('近14日真实赛果形态',hbform.status||'missing',Number(hbform.verified_matches||0),Number(hbform.expected_matches||0),hbform.last_success_at||hbform.last_attempt_at,'近期得失分/波动/休息天数 · 不冒充ORtg/Pace')+sourceCard('高级回合效率','missing',0,1,null,'Pace/ORtg/DRtg/Elo 未确认时DQ最高C')+sourceCard('阵容与伤停','missing',0,1,null,'可靠球员状态未确认时不放行正式绿灯')+'</div></section>';if(!rows.length)return h+'<section class="section"><div class="shead"><h2>今日竞彩篮球全池</h2><span>等待真实在售池</span></div><div class="cards"><div class="card feature" style="grid-column:1/-1"><b>暂无正式逐场预测</b><div class="tiny">自动采集已经接通。当前500竞彩篮球在售页没有比赛时这里会保持空池；一旦开售，系统会自动抓比赛身份、胜负/让分/大小分、近14日真实赛果形态，再运行2万次Bootstrap并显示全池概率。高级回合效率或阵容不足时会保持DQ-C/黄灯或PASS，不会硬凑。</div></div></div></section>';
const rs=rows.map(r=>{const hw=Number(r.p_home_win)>=Number(r.p_away_win),hc=Number(r.p_home_cover)>=Number(r.p_away_cover),ov=Number(r.p_over)>=Number(r.p_under);return '<tr><td><b>'+esc(r.match_no)+'</b></td><td>'+esc(r.away_team)+' @ '+esc(r.home_team)+'</td><td>'+esc(r.expected_away_points==null?'—':Number(r.expected_away_points).toFixed(1))+' : '+esc(r.expected_home_points==null?'—':Number(r.expected_home_points).toFixed(1))+'</td><td>'+esc(hw?'主胜':'客胜')+'</td><td>'+esc(hbPct(hw?r.p_home_win:r.p_away_win))+'</td><td>'+esc(r.official_spread_home??'—')+'</td><td>'+esc(hc?'让分主胜':'让分客胜')+'</td><td>'+esc(hbPct(hc?r.p_home_cover:r.p_away_cover))+'</td><td>'+esc(r.official_total??'—')+'</td><td>'+esc(ov?'大分':'小分')+'</td><td>'+esc(hbPct(ov?r.p_over:r.p_under))+'</td><td>'+esc(r.dq||'—')+'</td><td>'+esc(hbLight(r.lineup_light))+'</td><td>'+esc(hbLight(r.market_volatility_light))+'</td><td>'+esc(hbLight(r.final_selection_light))+'</td></tr>'}).join('');
return h+'<section class="section"><div class="shead"><h2>今日竞彩篮球全池</h2><span>点击刷新读取最新赛前冻结</span></div><div class="tablewrap"><table><thead><tr><th>场</th><th>对阵</th><th>预计比分</th><th>胜负Top1</th><th>胜率</th><th>官方让分</th><th>让分Top1</th><th>穿盘率</th><th>官方总分</th><th>大小Top1</th><th>概率</th><th>DQ</th><th>阵容灯</th><th>市场灯</th><th>最终灯</th></tr></thead><tbody>'+rs+'</tbody></table></div></section>'}

function renderCumulative(){const c=DATA.cumulative||{},h=c.hj||{},r=c.hc||{};return '<div class="grid4">'+metric('豪竞正式Top1',(h.hits||0)+'/'+(h.scored||0),pct(h.hits,h.scored))+metric('豪竞正式竞彩日',String(h.days||0),'完整正式样本')+metric('豪传9/9',String(r.full9||0),'正式期数 '+String(r.issues||0))+metric('豪传累计票面',(r.hits||0)+'/'+(r.scored||0),pct(r.hits,r.scored))+'</div><section class="section"><div class="shead"><h2>FT决策质量</h2><span>正式累计</span></div><div class="grid4" style="padding:12px">'+metric('Anchor',(h.anchorHits||0)+'/'+(h.anchorScored||0),pct(h.anchorHits,h.anchorScored))+metric('高信心',(h.highHits||0)+'/'+(h.highScored||0),pct(h.highHits,h.highScored))+metric('PASS隔离',String(h.passIsolated||0),'错误场成功隔离')+metric('PASS误杀',String(h.passFalseKills||0),'被PASS但Top1命中')+'</div></section><section class="section"><div class="shead"><h2>让球决策质量</h2><span>仅统计上线后真实赛前灯</span></div><div class="grid4" style="padding:12px">'+metric('🟢绿灯',(h.handicapGreenHits||0)+'/'+(h.handicapGreenScored||0),pct(h.handicapGreenHits,h.handicapGreenScored))+metric('🟡黄灯',(h.handicapYellowHits||0)+'/'+(h.handicapYellowScored||0),pct(h.handicapYellowHits,h.handicapYellowScored))+metric('实际出手',(h.handicapOutHits||0)+'/'+(h.handicapOutScored||0),pct(h.handicapOutHits,h.handicapOutScored))+metric('🔴PASS',String(h.handicapRedPass||0),'避错 '+String(h.handicapPassAvoided||0)+' · 误杀 '+String(h.handicapPassFalseKills||0))+'</div></section>'}
function renderHistory(){const arr=DATA.history||[];return '<section class="section"><div class="shead"><h2>历史运行记录</h2><span>点击查看逐场明细</span></div><div class="tablewrap"><table><thead><tr><th>日期</th><th>模型</th><th>修订</th><th>池</th><th>状态</th><th>完整</th><th>正式</th><th>运行时间</th></tr></thead><tbody>'+arr.map(r=>'<tr class="clickrow" onclick="openRun('+Number(r.id)+')"><td>'+esc(r.pool_date)+'</td><td><b>'+esc(r.model_name)+' '+esc(r.model_version||'')+'</b></td><td>'+esc(r.model_revision_tag||'未记录')+'</td><td>'+esc(r.pool_label||r.pool_kind||'—')+'</td><td>'+esc(r.status||'—')+'</td><td>'+(r.data_complete?'✅':'⚠️')+'</td><td>'+(r.formal_allowed?'✅':'否')+'</td><td>'+esc(fmtTime(r.run_time))+'</td></tr>').join('')+'</tbody></table></div></section>'}
async function openRun(id){document.getElementById('app').innerHTML='<div class="loading">正在读取历史复盘…</div>';try{const r=await fetch(API+'?api=1&run_id='+id,{headers:{Authorization:'Bearer '+token()},cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DETAIL={history:j.detail};TAB='history';render()}catch(e){DETAIL=null;render()}}
function historyDetail(){const d=DETAIL?.history;if(!d)return null;const run=d.run||{},rows=d.rows||[];return '<div><button class="backbtn" onclick="DETAIL=null;render()">← 返回历史</button></div><div class="grid4" style="margin-top:10px">'+metric('日期',run.pool_date||'—',run.pool_label||'')+metric('模型',run.model_name||'—',run.model_revision_tag||'')+metric('状态',run.status||'—',run.formal_allowed?'正式':'仅复盘')+metric('逐场记录',String(rows.length),'run_id '+run.id)+'</div><section class="section"><div class="tablewrap"><table><thead><tr><th>场</th><th>对阵</th><th>Top1</th><th>第二</th><th>票面</th><th>DQ</th><th>HUR</th><th>DTR</th><th>DLR</th><th>处理</th><th>赛果</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.match_no)+'</td><td>'+esc(r.home_team)+' - '+esc(r.away_team)+'</td><td>'+esc(r.top1||'—')+'</td><td>'+esc(r.second_pick||'—')+'</td><td>'+esc(r.ticket_pick_after_gate||r.ticket_pick||'—')+'</td><td>'+esc(r.dq||'—')+'</td><td>'+esc(r.hur||'—')+'</td><td>'+esc(r.dtr||'—')+'</td><td>'+esc(r.dlr||'—')+'</td><td>'+esc(r.final_handling||r.keep_discard||'—')+'</td><td>'+esc(result(r))+'</td></tr>').join('')+'</tbody></table></div></section>'}
function renderSources(){return systemHealthSection()+sourceStatusSection()+'<section class="section"><div class="shead"><h2>数据纪律</h2><span>新主链正式展示口径</span></div><div class="cards"><div class="card"><b>竞彩SP</b><div class="tiny">SP必须同时核验销售日、场号和主客队身份。澳客/500只有身份严格确认后才进入verified；无法确认时使用明确标注的球来乐结构化备用且DQ最高B，任何来源都不冒充Sporttery官网直连。</div></div><div class="card"><b>亚洲盘委员会</b><div class="tiny">Bet365、皇冠、William Hill亚洲盘、12Bet分别核验，不互相冒充；同向不按机构数量机械重复加权。</div></div><div class="card"><b>欧赔</b><div class="tiny">William Hill同公司欧赔初→即→临/当前；外围平均欧赔不能补成William。</div></div><div class="card"><b>刷新原则</b><div class="tiny">数据库无新赛前快照时保持原状态；开赛后不把赛中赔率写回赛前冻结。</div></div></div></section>'}
function render(){if(!DATA)return;let b;if(DETAIL?.history)b=historyDetail();else if(DETAIL?.row)b=matchDetail();else if(TAB==='dashboard')b=dashboard();else if(TAB==='haojing')b=renderHaojing();else if(TAB==='haochuan')b=renderHaochuan();else if(TAB==='haolan')b=renderHaolan();else if(TAB==='cumulative')b=renderCumulative();else if(TAB==='history')b=renderHistory();else b=renderSources();document.getElementById('app').innerHTML=shell(b);if(RESET_HJ_SCROLL){requestAnimationFrame(()=>{document.querySelectorAll('.hjtablewrap').forEach(el=>{el.scrollLeft=0});RESET_HJ_SCROLL=false})}}
checkBuildVersion();setInterval(checkBuildVersion,30000);load(true);
</script>
