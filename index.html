<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>豪模型私人控制台</title>
<style>
:root{
  --bg:#07111f;--panel:#0d1b2d;--panel2:#10233b;--line:#1b3554;
  --text:#ecf5ff;--muted:#91a8bf;--good:#27d17f;--warn:#ffc04b;
  --bad:#ff6475;--blue:#5aa9ff;--cyan:#64d8ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 82% -10%,#17385f 0,#07111f 43%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh}
button,input{font:inherit}
.wrap{max-width:1280px;margin:auto;padding:16px 14px 54px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.title{font-size:24px;font-weight:850;letter-spacing:.2px}
.subtitle{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lock,.fresh{font-size:11px;border:1px solid var(--line);background:#0b1a2b;padding:6px 9px;border-radius:999px;white-space:nowrap}
.fresh.good{border-color:#24764f;color:#73e4ad}.fresh.warn{border-color:#765821;color:#ffd27c}.fresh.bad{border-color:#713342;color:#ff91a0}
nav{display:flex;gap:8px;overflow:auto;padding:14px 0 10px;scrollbar-width:none}
nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 13px;border-radius:10px;white-space:nowrap;font-size:14px}
nav button.active{background:#14345a;border-color:#24558c;color:white}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px}
.refresh,.historybtn,.backbtn{border:1px solid #2b5681;background:#123153;color:#d9edff;border-radius:9px;padding:7px 10px;font-size:12px;cursor:pointer}
.refresh:hover,.historybtn:hover,.backbtn:hover{background:#18436f}
.logout{border:0;background:transparent;color:#7691aa;font-size:12px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;margin-bottom:12px}
.heroMain{background:linear-gradient(180deg,#102943,#0a1a2c);border:1px solid #28577e;border-radius:16px;padding:16px}
.heroTitle{font-size:12px;color:#9ecbff}.heroValue{font-size:24px;font-weight:900;margin:8px 0}.heroSub{font-size:12px;color:var(--muted);line-height:1.6}
.heroSide{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.metric{background:linear-gradient(180deg,#0f2238,#0b192a);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:106px}
.metric.good{border-color:#1e6e4b}.metric.warn{border-color:#765821}.metric.bad{border-color:#713342}
.ml{font-size:12px;color:var(--muted)}.mv{font-size:24px;font-weight:850;margin:9px 0 5px}.ms{font-size:12px;color:var(--muted);line-height:1.45}
.notice{border:1px solid #765821;background:#2b2314;color:#ffd985;border-radius:12px;padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.55}
.notice.bad{border-color:#713342;background:#321820;color:#ff9dad}
.notice.good{border-color:#1e6e4b;background:#10291f;color:#8cedb9}
.section{margin-top:13px;background:rgba(11,25,42,.9);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.shead{padding:13px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.shead h2{font-size:16px;margin:0}.shead span{color:var(--muted);font-size:12px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.card{background:#0e2035;border:1px solid #183655;border-radius:13px;padding:12px}
.card.feature{background:linear-gradient(180deg,#112a46,#0d2035);border-color:#28577e}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.no{font-weight:850;color:#a4ceff}.teams{font-weight:780;margin-top:5px}
.tiny{font-size:12px;color:var(--muted);line-height:1.6;margin-top:7px}
.bigpick{font-size:18px;font-weight:850;margin:7px 0}
.ok{color:var(--good);font-weight:780}.x{color:var(--bad);font-weight:780}.pending{color:var(--warn);font-weight:750}
.pill{display:inline-block;padding:3px 7px;border-radius:999px;background:#162b45;border:1px solid #244668;margin:4px 4px 0 0;font-size:11px}
.pill.good{border-color:#24764f;color:#73e4ad}.pill.warn{border-color:#765821;color:#ffd27c}.pill.bad{border-color:#713342;color:#ff91a0}
.tablewrap{overflow:auto;max-height:72vh}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:9px 10px;border-bottom:1px solid #142d49;text-align:left;white-space:nowrap}
th{color:#9cb3ca;background:#0b1b2e;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#102740}
.clickrow{cursor:pointer}
.login{min-height:84vh;display:grid;place-items:center;padding:16px}
.loginbox{width:min(92vw,390px);background:#0d1b2d;border:1px solid #1d3a5a;border-radius:20px;padding:24px;box-shadow:0 24px 80px #0007}
.loginbox h1{font-size:22px;margin:0 0 8px}
.loginbox .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.loginbox label{font-size:12px;color:#9bb1c8;display:block;margin:12px 0 6px}
.loginbox input{width:100%;border:1px solid #274867;background:#081522;color:white;border-radius:11px;padding:13px 12px;font-size:16px;outline:none}
.loginbox input:focus{border-color:#4c9cff}
.loginbox button{width:100%;margin-top:18px;border:0;border-radius:11px;background:#2e83e6;color:white;padding:13px;font-size:16px;font-weight:780}
.err{display:none;background:#3a1720;border:1px solid #7a3142;color:#ff9dad;border-radius:10px;padding:9px 11px;margin-bottom:12px;font-size:13px}
.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.footer{color:#637c95;text-align:center;font-size:11px;margin-top:16px;line-height:1.6}
.detailcards{display:none}
.changeUp{color:#73e4ad}.changeDown{color:#ff91a0}.changeFlat{color:#ffd27c}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:12px;line-height:1.55}
.kv>div:nth-child(odd){color:var(--muted)}
.evidence{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.evbox{border:1px solid #244668;background:#0b1b2e;border-radius:10px;padding:9px}
.evname{font-size:11px;color:var(--muted)}.evval{font-size:13px;font-weight:760;margin-top:5px}
.timeline{display:grid;gap:8px}
.tline{display:grid;grid-template-columns:90px 1fr 1fr 1fr;gap:8px;padding:8px 0;border-bottom:1px solid #142d49;font-size:12px}
.tline:last-child{border-bottom:0}
.rank{font-size:22px;font-weight:900}
.warnbox{border:1px solid #765821;background:#2b2314;border-radius:12px;padding:10px}
@media(max-width:650px){.kv{grid-template-columns:110px 1fr}.evidence{grid-template-columns:repeat(2,1fr)}.tline{grid-template-columns:72px 1fr 1fr 1fr;font-size:11px}}
@media(max-width:900px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.mv{font-size:22px}.metric{min-height:96px}}
@media(max-width:650px){
  .title{font-size:21px}.topright{max-width:48%}.heroSide{grid-template-columns:1fr 1fr}
  .desktopDetail{display:none}.detailcards{display:grid;grid-template-columns:1fr;gap:10px;padding:12px}
  .wrap{padding-left:10px;padding-right:10px}.shead{align-items:flex-start}
}
</style>
</head>
<body>
<div id="app"><div class="loading">正在连接豪模型控制台…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';
let DATA=null,TAB='dashboard',AUTO_TIMER=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?(a*100/b).toFixed(1)+'%':'—';
const code=v=>v==='主胜'?'3':v==='平'?'1':v==='客胜'?'0':'';
const hitTop=r=>!!(r.top1&&r.result_verified&&code(r.top1)===r.result_1x2);
const hitTicket=r=>!!(r.ticket_pick&&r.result_verified&&String(r.ticket_pick).includes(String(r.result_1x2)));
const result=r=>!r.result_verified?'待结算':(r.result_home??'?')+'-'+(r.result_away??'?')+' · '+(r.result_1x2==='3'?'主胜':r.result_1x2==='1'?'平':'客胜');
const tone=v=>/Anchor|A档核心|通过|完整/.test(v||'')?'good':/PASS|未恢复|缺|红|不完整|未确认/.test(v||'')?'bad':/黄|中|候选|部分/.test(v||'')?'warn':'';
const fmtTime=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return String(v)}};
const ageMinutes=v=>v?Math.max(0,Math.round((Date.now()-new Date(v).getTime())/60000)):null;
function metric(l,v,s='',c=''){return '<div class="metric '+c+'"><div class="ml">'+esc(l)+'</div><div class="mv">'+esc(v)+'</div><div class="ms">'+esc(s)+'</div></div>'}
function token(){return localStorage.getItem('hao_console_token')||''}
function activeModel(name){return DATA?.active_models?.[name]||null}
function runFresh(run){const m=ageMinutes(run?.run_time);if(m==null)return {text:'无运行',tone:'bad'};if(m<=75)return {text:'更新 '+m+' 分钟前',tone:'good'};if(m<=180)return {text:'更新 '+m+' 分钟前',tone:'warn'};return {text:'已 '+m+' 分钟未更新',tone:'bad'}}
function shell(body){
 const f=runFresh(DATA?.hj?.run);
 return '<div class="wrap"><div class="top"><div><div class="title">豪模型私人控制台</div><div class="subtitle">豪竞2.2 × 豪传2.2 · 模型负责判断，数据库负责冻结，网页只负责展示</div></div><div class="topright"><span class="fresh '+f.tone+'">'+esc(f.text)+'</span><span class="lock">🔒 私人访问</span><button class="logout" onclick="logout()">退出</button></div></div>'+
 '<nav>'+[['dashboard','总览'],['haojing','豪竞2.2'],['haochuan','豪传2.2'],['cumulative','累计'],['history','历史'],['sources','数据状态']].map(x=>'<button onclick="setTab(\''+x[0]+'\')" class="'+((TAB===x[0]||(TAB==='detail'&&x[0]==='history'))?'active':'')+'">'+x[1]+'</button>').join('')+'</nav>'+
 '<div class="actions"><button class="refresh" onclick="load(true)">🔄 立即刷新</button></div>'+body+
 '<div class="footer">页面每60秒读取一次最新冻结数据；不会自行重算方向、补猜缺失主链或用赛果倒推。最后API读取：'+esc(fmtTime(DATA?.server_time))+'</div></div>';
}
function login(){
 clearInterval(AUTO_TIMER);
 document.getElementById('app').innerHTML='<div class="login"><form class="loginbox" id="lf"><h1>🔒 豪模型私人控制台</h1><div class="sub">私人版 · 豪竞2.2 × 豪传2.2</div><div class="err" id="err">账号或密码不正确。</div><label>用户名</label><input id="u" autocomplete="username" value="hao"><label>密码</label><input id="p" type="password" autocomplete="current-password"><button>进入控制台</button></form></div>';
 document.getElementById('lf').onsubmit=async ev=>{
  ev.preventDefault();document.getElementById('err').style.display='none';
  try{
   const r=await fetch(API+'?login=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
   const j=await r.json().catch(()=>({}));
   if(r.ok&&j.token){localStorage.setItem('hao_console_token',j.token);await load(true)}
   else document.getElementById('err').style.display='block';
  }catch(_){document.getElementById('err').textContent='连接失败，请稍后重试。';document.getElementById('err').style.display='block'}
 };
}
function logout(){localStorage.removeItem('hao_console_token');DATA=null;login()}
async function load(showLoading=false){
 const t=token();if(!t){login();return}
 if(showLoading)document.getElementById('app').innerHTML='<div class="loading">正在读取最新冻结数据…</div>';
 try{
  const r=await fetch(API+'?api=1',{headers:{'Authorization':'Bearer '+t},cache:'no-store'});
  if(r.status===401){localStorage.removeItem('hao_console_token');login();return}
  const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');
  DATA=j;render();
  clearInterval(AUTO_TIMER);AUTO_TIMER=setInterval(()=>{if(document.visibilityState==='visible')load(false)},60000);
 }catch(err){document.getElementById('app').innerHTML='<div class="loading">连接失败：'+esc(err.message)+'<br><br><button class="refresh" onclick="load(true)">重试</button></div>'}
}
function setTab(t){TAB=t;render();scrollTo(0,0)}
function openMatch(kind,matchNo){
 const src=kind==='hc'?(DATA.hc?.rows||[]):(DATA.hj?.rows||[]);
 const row=src.find(r=>String(r.match_no)===String(matchNo));
 if(!row)return;
 DATA.matchDetail={kind,row};
 TAB='match';
 render();
 scrollTo(0,0);
}
async function openRun(id){
 const local=(DATA.history||[]).find(x=>Number(x.id)===Number(id));
 const rows=Array.isArray(local?.raw_summary?.detail_rows)?local.raw_summary.detail_rows:[];
 if(local&&rows.length){DATA.detail={run:local,rows,score:null};TAB='detail';render();scrollTo(0,0);return}
 document.getElementById('app').innerHTML='<div class="loading">正在读取历史复盘明细…</div>';
 try{
  const r=await fetch(API+'?api=1&run_id='+encodeURIComponent(id),{headers:{'Authorization':'Bearer '+token()},cache:'no-store'});
  if(r.status===401){localStorage.removeItem('hao_console_token');login();return}
  const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'历史明细读取失败');
  DATA.detail=j.detail;TAB='detail';render();scrollTo(0,0);
 }catch(err){document.getElementById('app').innerHTML='<div class="loading">历史明细读取失败：'+esc(err.message)+'<br><br><button class="refresh" onclick="load(true)">返回控制台</button></div>'}
}
function modelStatusBlock(){
 const hm=activeModel('豪竞2.2'),cm=activeModel('豪传2.2'),hr=DATA.hj?.run,cr=DATA.hc?.run;
 const hCurrent=!!DATA.hj?.recommendations?.current_revision,cCurrent=!!DATA.hc?.current_revision;
 return '<div class="hero"><div class="heroMain"><div class="heroTitle">当前正式模型</div><div class="heroValue">豪竞2.2 × 豪传2.2</div><div class="heroSub">'+
  '豪竞修订：'+esc(hm?.revision_tag||'未登记')+'<br>豪传修订：'+esc(cm?.revision_tag||'未登记')+
  '</div></div><div class="heroSide">'+
  metric('最近豪竞运行',fmtTime(hr?.run_time),hCurrent?'✅ 已绑定当前修订':'⚠️ 未绑定当前修订',hCurrent?'good':'warn')+
  metric('最近豪传运行',fmtTime(cr?.run_time),cCurrent?'✅ 已绑定当前修订':'⚠️ 未绑定当前修订',cCurrent?'good':'warn')+
  '</div></div>';
}
function integrityNotice(){
 const r=DATA.hj?.run,rec=DATA.hj?.recommendations;
 if(rec?.eligible)return '<div class="notice good">✅ 当前豪竞运行已通过完整性、正式执行资格和当前模型修订核验，网站只展示模型已经冻结的正式A/B/C。</div>';
 let reason=rec?.reason||'当前无正式可执行输出';
 return '<div class="notice bad">🚨 '+esc(reason)+'。本页不会根据低SP、强队身份或前端评分自行补出二串一/三串一。</div>';
}
function normalizePlay(saved,keyAliases){
 if(!saved)return null;
 for(const k of keyAliases)if(saved[k])return saved[k];
 return null;
}
function legName(l){
 if(typeof l==='string')return l;
 const no=l?.match_no||l?.no||'', h=l?.home_team||'',a=l?.away_team||'',p=l?.pick||l?.top1||l?.selection||'';
 return [no,(h&&a)?h+'-'+a:'',p].filter(Boolean).join(' ');
}
function legSp(l){
 if(typeof l!=='object'||!l)return null;
 const c=[l.official_sp,l.sp,l.price,l?.source_status?.official_sp,l?.source_status?.sporttery_sp];
 for(const x of c){const n=Number(x);if(Number.isFinite(n)&&n>1)return n}return null;
}
function playCard(title,p){
 if(!p)return '<div class="card feature"><div class="row"><b>'+esc(title)+'</b><span class="pending">未冻结</span></div><div class="tiny">当前模型运行没有保存这一项正式输出，网页不补算。</div></div>';
 const status=String(p.status||p.state||'READY').toUpperCase();
 if(/PASS|NO_TICKET|DISABLED|UNAVAILABLE/.test(status))return '<div class="card feature"><div class="row"><b>'+esc(title)+'</b><span class="x">⛔ PASS</span></div><div class="tiny">'+esc(p.reason||p.note||'模型正式输出为PASS')+'</div></div>';
 const legs=Array.isArray(p.legs)?p.legs:Array.isArray(p.selections)?p.selections:[];
 let product=1,all=true;for(const l of legs){const s=legSp(l);if(s)product*=s;else all=false}
 const lines=legs.length?legs.map(l=>'<div class="tiny">• '+esc(legName(l))+(legSp(l)?' ｜ SP '+legSp(l).toFixed(2):'')+'</div>').join(''):'<div class="tiny">'+esc(p.text||p.summary||'已冻结正式输出')+'</div>';
 const extras=[all&&legs.length?('组合SP≈'+product.toFixed(2)):null,p.ev!=null?('EV '+p.ev):null,p.confidence?('信心 '+p.confidence):null,p.risk?('风险 '+p.risk):null].filter(Boolean).join(' ｜ ');
 const why=p.reason||p.note||p.rationale||'';
 return '<div class="card feature"><div class="row"><b>'+esc(title)+'</b><span class="ok">✅ 正式</span></div>'+lines+(extras?'<div class="tiny"><b>'+esc(extras)+'</b></div>':'')+(why?'<div class="tiny">为什么选：'+esc(why)+'</div>':'')+'</div>';
}
function todayPlaySection(){
 const rec=DATA.hj?.recommendations;
 let cards='';
 if(rec?.eligible){
  const s=rec.saved||{};
  cards+=playCard('🟢 A 最稳二串一',normalizePlay(s,['A','a','safe2','best_safe_2']));
  cards+=playCard('🟡 B 性价比二串一',normalizePlay(s,['B','b','value2','best_value_2']));
  cards+=playCard('🔵 C 三串一',normalizePlay(s,['C','c','triple3','best_3']));
 }else{
  const why=rec?.reason||'当前没有合格正式运行';
  for(const t of ['🟢 A 最稳二串一','🟡 B 性价比二串一','🔵 C 三串一'])cards+='<div class="card feature"><div class="row"><b>'+t+'</b><span class="x">⛔ 不可用</span></div><div class="tiny">'+esc(why)+'</div></div>';
 }
 cards+='<div class="card"><b>执行纪律</b><div class="tiny">必须来自豪竞2.2完整赛前运行后的正式冻结结果。网页不做playScore、不按赔率临时补腿、不把恢复记录冒充正式推荐。</div></div>';
 return '<section class="section"><div class="shead"><h2>🔥 当前可执行玩法</h2><span>'+esc(DATA.hj?.run?.pool_label||'暂无竞彩池')+'</span></div><div class="cards">'+cards+'</div></section>';
}
function sourceStatusSection(){
 const s=DATA.hj?.source_snapshot||{},run=DATA.hj?.run||{};
 const items=[
  ['逐场记录覆盖',s.row_coverage+'/'+(s.total_matches||0),'数据库当前run实际有逐场记录'],
  ['核心主链完整',s.core_chain_complete??(s.core_chain_rows_confirmed+'/'+(s.total_matches||0)),'William+澳门+体彩主链综合'],
  ['William Hill',s.william_confirmed??'未记录','同公司初→即→临'],
  ['澳门',s.macau_confirmed??'未记录','同机构亚盘+水位'],
  ['体彩普通SP',s.official_sp_db??'未记录',s.official_sp_realtime_verified===true?'✅ 本轮官方实时核验':'⚠️ 未确认本轮官方实时核验'],
  ['体彩让球SP',s.official_handicap_sp_confirmed??'未记录','官方HHAD数据'],
  ['API-Football',DATA.sources?.api_football_last?fmtTime(DATA.sources.api_football_last):'无近期记录','最近数据库抓取时间'],
  ['本轮运行',fmtTime(run.run_time),'状态：'+(run.status||'—')]
 ];
 return '<section class="section"><div class="shead"><h2>📡 数据完整度</h2><span>真实覆盖率，不用固定绿灯冒充实时</span></div><div class="cards">'+items.map(x=>'<div class="card"><div class="row"><b>'+esc(x[0])+'</b><span class="'+(/未|0\//.test(String(x[1]))?'x':'pending')+'">'+esc(x[1])+'</span></div><div class="tiny">'+esc(x[2])+'</div></div>').join('')+'</div></section>';
}


function ssVal(r,...keys){
 const s=r?.source_status||{};
 for(const k of keys){if(s[k]!=null&&s[k]!=='')return s[k]}
 return null;
}
function canonicalChange(r){
 return ssVal(r,'hour_change','change','变化','本小时变化')||'未确认';
}
function evidenceValue(r,key){
 const s=r?.source_status||{}, e=s.evidence_domains||s.evidence||{};
 const aliases={
  market:['market','市场层','market_direction'],
  strength:['strength','实力层','elo','Elo'],
  professional:['professional','专业预测层','ai_committee','专业模型'],
  fundamentals:['fundamentals','基本面层','雷速','facts'],
  teacher:['teacher','老师二审','teacher_audit']
 };
 for(const k of aliases[key]||[]){if(e?.[k]!=null)return e[k];if(s?.[k]!=null)return s[k]}
 return '未确认';
}
function timelineRows(r){
 const s=r?.source_status||{};
 const tl=s.market_timeline||s.odds_timeline||s.market?.timeline||null;
 if(Array.isArray(tl)&&tl.length)return tl;
 const market=s.market||{};
 const out=[];
 for(const name of ['william','macau','sporttery']){
   const x=market[name]||market[name==='sporttery'?'体彩':name==='william'?'William':'澳门'];
   if(x&&typeof x==='object')out.push({source:name==='william'?'William Hill':name==='macau'?'澳门':'体彩SP',initial:x.initial??x.open??'—',current:x.current??x.live??'—',close:x.close??x.closing??'—'});
 }
 return out;
}
function renderEvidenceDomains(r){
 const items=[['市场层',evidenceValue(r,'market')],['实力层',evidenceValue(r,'strength')],['专业预测层',evidenceValue(r,'professional')],['基本面层',evidenceValue(r,'fundamentals')],['老师二审',evidenceValue(r,'teacher')]];
 return '<div class="evidence">'+items.map(x=>'<div class="evbox"><div class="evname">'+x[0]+'</div><div class="evval">'+esc(x[1])+'</div></div>').join('')+'</div>';
}
function renderTimeline(r){
 const rows=timelineRows(r);
 if(!rows.length)return '<div class="tiny">当前冻结记录没有保存可追溯的初盘→即时→临场数值；不补猜。</div>';
 return '<div class="timeline"><div class="tline"><b>来源</b><b>初</b><b>即时</b><b>临场</b></div>'+rows.map(x=>'<div class="tline"><span>'+esc(x.source||'—')+'</span><span>'+esc(x.initial??'—')+'</span><span>'+esc(x.current??'—')+'</span><span>'+esc(x.close??'—')+'</span></div>').join('')+'</div>';
}
function riskScore(r){
 const w=v=>/红|极高|强/.test(String(v||''))?4:/高/.test(String(v||''))?3:/中高/.test(String(v||''))?2:/中/.test(String(v||''))?1:0;
 return w(r.hur)+w(r.dtr)+w(r.dlr)+w(r.strong_conflict);
}
function riskRank(rows,pred){
 return rows.filter(pred).sort((a,b)=>riskScore(b)-riskScore(a)).slice(0,5);
}

function probabilityPricePanel(r){
 const s=r?.source_status||{}, p=s.probabilities||s.probability_1x2||{}, sp=s.official_sp_1x2||s.sporttery_sp_1x2||{};
 const calibrated=p.calibrated===true||p.status==='calibrated';
 const hp=nval(p.home??p.h),dp=nval(p.draw??p.d),ap=nval(p.away??p.a);
 const hs=nval(sp.home??sp.h),ds=nval(sp.draw??sp.d),as=nval(sp.away??sp.a);
 const probText=calibrated&&hp!=null&&dp!=null&&ap!=null
   ? '主 '+(hp*100).toFixed(1)+'% / 平 '+(dp*100).toFixed(1)+'% / 客 '+(ap*100).toFixed(1)+'%'
   : '未校准';
 const spText=hs!=null&&ds!=null&&as!=null?'主 '+hs.toFixed(2)+' / 平 '+ds.toFixed(2)+' / 客 '+as.toFixed(2):'未确认';
 let topP=null,topSp=null;
 if(r.top1==='主胜'){topP=hp;topSp=hs}else if(r.top1==='平'){topP=dp;topSp=ds}else if(r.top1==='客胜'){topP=ap;topSp=as}
 const be=topSp!=null&&topSp>0?1/topSp:null;
 const ev=calibrated&&topP!=null&&topSp!=null?topP*topSp-1:null;
 return '<section class="section"><div class="shead"><h2>💰 概率 × 价格</h2><span>只使用已校准概率 + 中国体彩官方SP</span></div><div class="grid" style="padding:12px">'+
  metric('模型H/D/A',probText,calibrated?'已标记可校准':'不能用信心等级冒充概率',calibrated?'good':'warn')+
  metric('体彩官方SP',spText,'普通胜平负官方SP')+
  metric('Top1盈亏平衡率',be!=null?(be*100).toFixed(1)+'%':'未确认',topSp!=null?'1 / 官方SP':'缺官方SP')+
  metric('Top1 EV',ev!=null?((ev>=0?'+':'')+(ev*100).toFixed(1)+'%'):'未确认',ev!=null?'模型概率×官方SP−1':'需同时有可校准概率与官方SP',ev!=null?(ev>0?'good':'warn'):'')+
 '</div></section>';
}
