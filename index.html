<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生辰八字 · 五行查询</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#243c34;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 65px}header{text-align:center;padding:30px 0 18px}header small{letter-spacing:5px;color:#a78b56}h1{font-size:32px;margin:12px 0}p{color:#728078;line-height:1.7}.card{background:#fffefa;border:1px solid #e6ddcb;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 8px 30px #1d392c0a}h2{font-size:20px;margin:0 0 20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;color:#65746a;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #d9d9cd;border-radius:10px;background:white;color:#243c34;font-size:16px}button{width:100%;background:#254c3e;color:white;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:600;margin-top:20px}.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pillar{background:#f2f5ef;border-radius:12px;text-align:center;padding:15px 3px}.pillar strong{display:block;font-size:26px;letter-spacing:3px;margin:10px 0}.tag{display:inline-block;background:#e6eee8;padding:6px 12px;border-radius:50px;margin:4px;color:#315544}.bar{height:12px;border-radius:9px;background:#e9e9e4;overflow:hidden;flex:1}.fill{height:100%;border-radius:9px}.meter{display:flex;align-items:center;gap:12px;margin:16px 0}.meter b{width:24px}.meter em{width:18px;font-style:normal}.muted{font-size:13px;color:#849086}.error{color:#b04336}footer{text-align:center;color:#8c958c;font-size:12px;margin-top:35px}</style></head><body><main class="wrap"><header><small>传统文化 · 四柱排盘</small><h1>生辰八字 · 五行查询</h1><p>一纸生辰，读懂传统干支与五行</p></header><section class="card"><h2>填写出生信息</h2><div class="row"><div><label>历法</label><select id="calendar"><option value="solar">公历</option><option value="lunar">农历</option></select></div><div><label>出生年份</label><input id="year" type="number" min="1900" max="2099" value="1997"></div><div><label>出生月份</label><select id="month"></select></div><div><label>出生日期</label><select id="day"></select></div><div><label>出生小时（24小时制）</label><select id="hour"></select></div><div><label>出生分钟</label><select id="minute"></select></div></div><label id="leapLabel" style="display:none"><input id="leap" type="checkbox" style="width:auto"> 农历闰月</label><button id="calc">立即测算</button><p class="muted">默认采用北京时间；不进行出生地真太阳时校正。</p><div id="msg" class="error"></div></section><div id="result" style="display:none"><section class="card"><h2>四柱八字</h2><div id="pillars" class="pillars"></div><p id="dates"></p><div id="summary"></div></section><section class="card"><h2>五行分布</h2><div id="meters"></div><p id="missing"></p><p class="muted">此处统计四柱天干与地支的表层五行，不含藏干加权；“缺少”不等于“需要补”。</p></section><section class="card"><h2>纳音五行</h2><div id="nayin"></div></section><section class="card"><h2>宝宝起名灵感</h2><div id="names"></div><p class="muted">仅供汉字文化参考，不代表专业喜用神判断。</p></section></div><footer>民俗文化展示 · 不具科学命运预测效力</footer></main><script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script><script>const $=id=>document.getElementById(id);const fill=(id,a,b)=>{for(let i=a;i<=b;i++)$(id).add(new Option(String(i).padStart(2,'0'),i))};fill('month',1,12);fill('day',1,31);fill('hour',0,23);fill('minute',0,59);$('month').value=8;$('day').value=18;$('hour').value=10;$('minute').value=30;$('calendar').onchange=()=>{$('leapLabel').style.display=$('calendar').value==='lunar'?'block':'none'};const stems={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'},branches={'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'},colors={'金':'#c5a15c','木':'#57916e','水':'#5488b1','火':'#c9705d','土':'#a78a65'},chars={'金':'锦 · 铭 · 钰 · 锐 · 钧','木':'桐 · 楠 · 梓 · 森 · 栩','水':'涵 · 沐 · 泽 · 汐 · 润','火':'昕 · 煜 · 晗 · 晴 · 熠','土':'安 · 宇 · 岚 · 辰 · 屹'}; $('calc').onclick=()=>{const msg=$('msg');msg.textContent='';try{if(typeof Solar==='undefined'||typeof Lunar==='undefined')throw Error('历法组件未加载，请检查网络后重试。');const y=+$('year').value,m=+$('month').value,d=+$('day').value,h=+$('hour').value,mi=+$('minute').value;if(y<1900||y>2099)throw Error('请输入1900—2099年的日期');let solar,lunar;if($('calendar').value==='lunar'){lunar=Lunar.fromYmdHms(y,$('leap').checked?-m:m,d,h,mi,0);solar=lunar.getSolar()}else{solar=Solar.fromYmdHms(y,m,d,h,mi,0);if(solar.getYear()!==y||solar.getMonth()!==m||solar.getDay()!==d)throw Error('公历日期不存在');lunar=solar.getLunar()}const ec=lunar.getEightChar(),p=[ec.getYear(),ec.getMonth(),ec.getDay(),ec.getTime()],n=[ec.getYearNaYin(),ec.getMonthNaYin(),ec.getDayNaYin(),ec.getTimeNaYin()],count={'金':0,'木':0,'水':0,'火':0,'土':0};p.forEach(s=>{count[stems[s[0]]]++;count[branches[s[1]]]++});const missing=Object.keys(count).filter(x=>count[x]===0);$('pillars').innerHTML=p.map((s,i)=>'<div class="pillar"><small>'+['年柱','月柱','日柱','时柱'][i]+'</small><strong>'+s+'</strong><small>'+n[i]+'</small></div>').join('');$('dates').textContent='公历：'+solar.toYmd()+'　｜　农历：'+lunar.toString();$('summary').innerHTML='<span class="tag">生肖：'+lunar.getYearShengXiao()+'</span><span class="tag">日主五行：'+stems[p[2][0]]+'</span>';$('meters').innerHTML=Object.keys(count).map(e=>'<div class="meter"><b>'+e+'</b><div class="bar"><div class="fill" style="width:'+(count[e]/8*100)+'%;background:'+colors[e]+'"></div></div><em>'+count[e]+'</em></div>').join('');$('missing').textContent=missing.length?'表层五行未出现：'+missing.join('、'):'表层五行齐全';$('nayin').innerHTML=n.map((s,i)=>'<span class="tag">'+['年','月','日','时'][i]+'：'+s+'</span>').join('');$('names').innerHTML=(missing.length?missing:Object.keys(count)).map(e=>'<p><b>'+e+'属性参考：</b>'+chars[e]+'</p>').join('');$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth'});}catch(e){msg.textContent=e.message||'计算失败，请检查输入';$('result').style.display='none'}};</script></body></html>
