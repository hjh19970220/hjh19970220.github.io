<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>国学生活助手 · 测试版</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f2e9;color:#254439;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 70px}header{padding:26px 8px 20px;text-align:center}header small{letter-spacing:5px;color:#9b7e49}h1{font-size:32px;margin:12px 0}p{color:#748078;line-height:1.7}.card{background:#fffefa;border:1px solid #e9dfcf;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 30px #294c3309}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:1px solid #e9e4d7;border-radius:15px;background:#fff;padding:18px 5px;text-align:center;cursor:pointer;color:#244639;min-height:110px}.tile i{font-size:29px;display:block;font-style:normal;margin-bottom:10px}.tile b{font-size:14px}.tile small{display:block;color:#87948b;font-size:11px;margin-top:6px}.tile:active{background:#e9f0e8}h2{font-size:20px;margin:0 0 15px}.panel{display:none}.panel.active{display:block}label{display:block;font-size:13px;color:#68796e;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid #d9dace;border-radius:10px;background:white;font-size:16px;color:#244639}button.primary{width:100%;border:0;background:#275240;color:white;padding:14px;border-radius:12px;margin-top:18px;font-size:16px}.back{border:0;background:#e7eee7;color:#275240;padding:9px 14px;border-radius:9px;margin-bottom:15px}.result{margin-top:16px;padding:16px;border-radius:12px;background:#f1f5ef;line-height:1.9}.notice{font-size:13px;color:#8a866f}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}footer{text-align:center;font-size:12px;color:#999;margin-top:35px}a{color:#275240}</style></head><body><main class="wrap"><header><small>中华传统文化 · 生活工具</small><h1>国学生活助手</h1><p>历法 · 八字 · 起名 · 生肖 · 诗词</p></header><div id="home"><section class="card"><h2>传统文化工具箱</h2><div class="grid"><button class="tile" onclick="location.href='bazi/'"><i>🔮</i><b>八字五行</b><small>已开放</small></button><button class="tile" onclick="show('name')"><i>👶</i><b>宝宝起名</b><small>已开放</small></button><button class="tile" onclick="show('zodiac')"><i>🐉</i><b>生肖查询</b><small>已开放</small></button><button class="tile" onclick="show('star')"><i>✨</i><b>星座查询</b><small>已开放</small></button><button class="tile" onclick="show('calendar')"><i>📅</i><b>节气与农历</b><small>测试功能</small></button><button class="tile" onclick="show('five')"><i>📖</i><b>姓名文化</b><small>已开放</small></button><button class="tile" onclick="show('soon')"><i>❤️</i><b>八字合婚</b><small>规划中</small></button><button class="tile" onclick="show('soon')"><i>☯️</i><b>周易排盘</b><small>规划中</small></button><button class="tile" onclick="show('soon')"><i>🌌</i><b>紫微斗数</b><small>规划中</small></button></div></section><section class="card"><h2>今日推荐</h2><p>输入出生日期，探索传统干支历与五行文化。基础工具免费使用，无需注册。</p><button class="primary" onclick="location.href='bazi/'">开始八字五行查询 →</button></section></div><section class="card panel" id="panel"><button class="back" onclick="back()">← 返回首页</button><h2 id="title"></h2><div id="body"></div><div id="out" class="result" style="display:none"></div></section><footer>传统民俗文化及趣味参考，不用于科学命运预测 · 测试版</footer></main><script>const $=id=>document.getElementById(id);const names=['梓涵','沐辰','清禾','知远','若溪','书瑶','景行','云舒','怀瑾','嘉言','予安','星澜','明轩','诗宁','思齐','望舒','清越','锦书','亦舟','乐知'];const meanings={'梓':'树木，寓意成长','涵':'包容、涵养','沐':'润泽','辰':'星辰与时光','清':'清澈、纯净','禾':'谷物、丰收','知':'知识、明理','远':'志向长远','若':'如、似','溪':'溪流','书':'书香、学识','瑶':'美玉','景':'景致、敬仰','行':'行动、实践','云':'云彩','舒':'舒展、从容','怀':'胸怀','瑾':'美玉','嘉':'美好','言':'言语、诚信','予':'给予','安':'安宁'};function show(k){$('home').style.display='none';$('panel').classList.add('active');$('out').style.display='none';let title='',body='';if(k==='name'){title='宝宝起名灵感';body='<label>姓氏</label><input id="surname" placeholder="例如：陈" maxlength="2"><label>宝宝性别</label><select id="gender"><option value="boy">男宝宝</option><option value="girl">女宝宝</option><option value="neutral">不限 / 中性</option></select><label>风格</label><select id="style"><option value="0">清雅诗意</option><option value="1">明朗大气</option><option value="2">温柔自然</option></select><label>名字字数（不含姓氏）</label><select id="nameLength"><option value="2">双字名</option><option value="1">单字名</option><option value="0">单双字混合</option></select><label>每次推荐数量</label><select id="nameCount"><option value="20">20个</option><option value="50">50个</option><option value="100">100个</option></select><label>避开用字（可选）</label><input id="avoidChars" placeholder="例如：梓轩浩"><button class="primary" onclick="makeNames()">生成一批名字</button><button class="primary" style="background:#987b47;margin-top:8px" onclick="makeNames()">换一批不同名字 ↻</button>'}else if(k==='zodiac'){title='生肖查询';body='<label>出生年份（公历）</label><input id="zy" type="number" value="1997"><button class="primary" onclick="zodiac()">查询生肖</button><p class="notice">生肖年份传统上有立春或春节两种划分口径；此工具按公历年份粗略查询，年初出生请以专业历法核对。</p>'}else if(k==='star'){title='星座查询';body='<div class="row"><div><label>出生月份</label><input id="sm" type="number" min="1" max="12" value="8"></div><div><label>出生日期</label><input id="sd" type="number" min="1" max="31" value="18"></div></div><button class="primary" onclick="star()">查询星座</button>'}else if(k==='calendar'){title='农历与节气';body='<p>公历日期与农历转换请使用八字五行页面中的出生日期功能。二十四节气完整日历正在开发。</p><button class="primary" onclick="location.href=\'bazi/\'">前往历法查询</button>'}else if(k==='five'){title='姓名文化解析';body='<label>输入名字</label><input id="fullName" maxlength="8" placeholder="输入姓名"><button class="primary" onclick="meaning()">查看汉字文化寓意</button><p class="notice">当前仅收录部分常见汉字，暂不提供无依据的姓名分数。</p>'}else{title='功能开发中';body='<p>此功能尚未完成算法与测试，暂不展示虚构的计算结果。</p>'}$('title').textContent=title;$('body').innerHTML=body;window.scrollTo(0,0)}function back(){$('panel').classList.remove('active');$('home').style.display='block'}function result(t){$('out').style.display='block';$('out').innerHTML=t}let nameBatch=0;const nameBanks={boy:{0:['知','修','景','怀','清','书','明','承','思','言','允','彦','卓','谨','弘','维','远','谦','砚','晏','朗','晟','昀','屿','川','舟','衡','澄','逸','哲','渊','尧','昭','宥','珩','翊','泽','熙','昱','庭','霖'],1:['昊','朗','峻','卓','骏','腾','凯','博','钧','锐','宸','曜','弘','毅','承','宇','铭','辰','晟','昂','铮','赫','霆','轩','彦','璟','岳','拓','旭','驰','峰','恒','睿','奕','炜','哲','阳','航','恺','昕'],2:['沐','川','林','森','舟','禾','云','清','溪','岚','柏','青','松','澄','安','宁','泽','润','霖','屿','星','野','远','初','晏','栩','棠','桐','予','牧','庭','淮','朔','越','风','和','旭','晨','望','言']},girl:{0:['若','诗','书','清','知','雅','婉','舒','瑾','念','云','宁','芷','昕','语','悠','嘉','锦','微','予','映','可','初','宜','灵','思','玥','晴','悦','柔','音','月','妍','姝','璇','歆','沅','澜','韵','沁'],1:['昭','明','悦','嘉','欣','璟','星','灿','瑶','玥','珺','熙','昕','奕','晴','安','宁','琪','琳','彤','卓','思','宸','雅','颖','若','诗','锦','语','妍','然','诺','宜','希','璇','澜','悦','乐','依','芮'],2:['溪','禾','沐','桐','汐','岚','雨','云','月','芷','棠','栀','荷','竹','露','霏','澜','清','晴','雪','宁','舒','茉','初','悠','夏','秋','青','晓','芮','沁','柔','微','苒','霖','汀','萱','苓','瑶','溪']},neutral:{0:['知','书','清','言','思','云','安','宁','景','嘉','予','怀','明','舒','初','宜','朗','远','澄','锦','亦','舟','衡','若','诗','昭','辰','星','然','和','悦','允','修','维','璟','青','昀','宥','念','瑾'],1:['明','嘉','卓','星','曜','朗','熙','昭','奕','昕','辰','璟','景','安','宁','钧','锦','悦','承','宇','哲','睿','昊','希','昱','晨','宸','铭','阳','博','然','乐','允','思','晟','嘉','航','珩','维','泽'],2:['清','禾','沐','川','云','舟','林','溪','桐','澄','岚','宁','安','雨','星','野','青','竹','月','初','晨','晓','风','和','棠','屿','泽','润','栩','柏','森','夏','秋','汐','霖','霏','远','松','苒','晴']}};function makeNames(){const surname=($('surname').value.trim()||'林'),gender=$('gender').value,style=+$('style').value,len=+$('nameLength').value,count=+$('nameCount').value,avoid=$('avoidChars').value.trim();if(!/^[\\u3400-\\u9fff]{1,2}$/.test(surname))return result('姓氏请输入1—2个汉字');const bank=[...new Set(nameBanks[gender][style])],pool=[],used=new Set();nameBatch++;const offset=(nameBatch*31+surname.codePointAt(0)+style*19)%bank.length;for(let step=0;step<bank.length*bank.length&&pool.length<count;step++){const i=(step*17+offset+Math.floor(step/bank.length)*7)%bank.length,j=(step*23+offset*3+Math.floor(step/bank.length)*11)%bank.length;const size=len===0?(step%4===0?1:2):len;const given=size===1?bank[i]:bank[i]+bank[j];if(size===2&&(i===j||given[0]===given[1]))continue;if([...given].some(c=>avoid.includes(c))||used.has(given))continue;used.add(given);pool.push(given)}if(pool.length<count){for(const a of bank){for(const b of bank){const given=a+b;if(pool.length>=count)break;if(a===b||used.has(given)||[...given].some(c=>avoid.includes(c)))continue;if(len===1)continue;used.add(given);pool.push(given)}}}const html=pool.map((n,i)=>'<div style="padding:11px;border-bottom:1px solid #dce5d9"><b>'+(i+1)+'. '+surname+n+'</b><small style="display:block;color:#6b7e70">用字：'+[...n].map(c=>c+'（'+(meanings[c]||'传统汉字，可结合字典核对含义')+'）').join(' · ')+'</small></div>').join('');result('<b>第 '+nameBatch+' 批 · '+pool.length+' 个名字</b><p class="notice">按性别偏好、风格、字数及避用字筛选。点击“换一批”可刷新组合；字库有限，部分名字可能重复出现。</p><div style="max-height:520px;overflow:auto">'+html+'</div><p class="notice">这些是规则组合的起名灵感，并非人工逐一审定的名字，也未依据八字喜用神筛选。请自行检查读音、歧义及重名情况。</p>')}function zodiac(){const y=+$('zy').value;if(y<1||y>9999)return result('请输入有效年份');const a='鼠牛虎兔龙蛇马羊猴鸡狗猪';result(y+'年对应生肖（粗略）：<b>'+a[(y-4%12+12000)%12]+'</b>')}function star(){const m=+$('sm').value,d=+$('sd').value;if(m<1||m>12||d<1||d>31||new Date(2024,m-1,d).getMonth()!==m-1)return result('请输入有效日期');const cut=[20,19,21,20,21,22,23,23,23,24,23,22];const a=['摩羯座','水瓶座','双鱼座','白羊座','金牛座','双子座','巨蟹座','狮子座','处女座','天秤座','天蝎座','射手座'];result('西方太阳星座（常用日期划分）：<b>'+a[(m-1+(d>=cut[m-1]?1:0))%12]+'</b>')}function meaning(){const n=$('fullName').value.trim();if(!n)return result('请输入姓名');result([...n].map(c=>'<b>'+c+'</b>：'+(meanings[c]||'暂未收录此字的文化寓意')).join('<br>'))}</script></body></html>
