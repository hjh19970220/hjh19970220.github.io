<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脑力研究所｜每日脑力挑战</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#192d4a;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:680px;margin:auto;padding:20px 16px 80px}.hero{background:linear-gradient(135deg,#172e65,#6353be);color:white;border-radius:24px;padding:30px 23px;margin:12px 0 20px}.hero h1{font-size:31px;margin:10px 0}.hero p{color:#dfe4ff}.muted{color:#73829a;font-size:13px;line-height:1.7}.card{background:white;border:1px solid #e3e9f4;border-radius:19px;padding:20px;margin:15px 0;box-shadow:0 7px 24px #172f5c0b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{border:1px solid #e5eafa;background:white;border-radius:16px;text-align:left;padding:20px 14px;min-height:133px;color:#243e69;cursor:pointer}.tile span{font-size:30px;display:block;margin-bottom:12px}.tile b{display:block;font-size:16px}.tile small{display:block;color:#8794a7;margin-top:8px}.button{border:0;border-radius:12px;padding:14px 17px;background:#4c55bd;color:white;font-size:16px;font-weight:600;cursor:pointer}.wide{width:100%}.secondary{background:#e9edfa;color:#344779}.back{margin-bottom:14px}.choice{display:block;width:100%;background:#f6f8fe;border:1px solid #dfe5f5;padding:15px;border-radius:12px;text-align:left;margin:10px 0;color:#253b5c;font-size:16px}.choice:disabled{opacity:.7}.choice.correct{background:#e1f5e9;border-color:#63bd86}.choice.wrong{background:#ffe9e8;border-color:#df8883}.hidden{display:none!important}.score{font-size:52px;font-weight:800;color:#4c55bd;text-align:center;margin:18px}.bar{height:8px;background:#e8ebf6;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#6259c6}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px auto;max-width:330px}.cell{height:88px;border:0;border-radius:14px;background:#e4e9f7;font-size:26px;color:#38477b}.cell.on{background:#f4c45c}.cell.hit{background:#8bd7b3}.center{text-align:center}.reaction{height:200px;background:#e8a15b;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:23px;color:white;text-align:center;cursor:pointer;padding:15px}.reaction.ready{background:#40a58c}.reaction.early{background:#d66a71}footer{text-align:center;color:#9aa5b4;font-size:12px;margin-top:35px}</style></head><body><main class="wrap"><div id="home"><div class="hero"><small>🧠 BRAIN LAB · 趣味脑力训练</small><h1>脑力研究所</h1><p>逻辑推理 · 记忆挑战 · 反应速度</p><div id="record" style="font-size:14px">每日一点挑战，让思维更有趣</div></div><div class="card"><h2>选择挑战</h2><div class="grid"><button class="tile" onclick="startQuiz('mix')"><span>🧠</span><b>综合脑力测评</b><small>10题 · 趣味得分</small></button><button class="tile" onclick="startQuiz('number')"><span>🔢</span><b>数字逻辑</b><small>数列与规律推理</small></button><button class="tile" onclick="startQuiz('logic')"><span>🧩</span><b>逻辑推理</b><small>推理与判断</small></button><button class="tile" onclick="startMemory()"><span>👀</span><b>记忆挑战</b><small>观察亮起的方格</small></button><button class="tile" onclick="startReaction()"><span>⚡</span><b>反应速度</b><small>测一测点击反应</small></button><button class="tile" onclick="startQuiz('daily')"><span>🏆</span><b>每日挑战</b><small>每天固定5题</small></button></div></div><div class="card"><b>玩法说明</b><p class="muted">全部挑战免费、无需登录。成绩仅保存在本设备浏览器中。测试分数不是标准化IQ分数，也不代表真实智商。</p></div></div><div id="game" class="hidden"><button class="button secondary back" onclick="goHome()">← 返回首页</button><div class="card"><h2 id="gameTitle"></h2><div id="gameBody"></div></div></div><footer>脑力研究所 · 趣味益智测试版 · 无需注册</footer></main><script>const $=id=>document.getElementById(id);const questions=[['2、4、8、16、？','32',['20','24','32','36'],'number','每一项是前一项的2倍。'],['1、1、2、3、5、？','8',['6','7','8','10'],'number','每项是前两项之和。'],['3、6、11、18、？','27',['25','27','29','31'],'number','差依次是3、5、7、9。'],['100、90、81、73、？','66',['65','66','67','68'],'number','依次减10、9、8、7。'],['1、4、9、16、？','25',['20','24','25','36'],'number','依次是1至5的平方。'],['5、10、20、40、？','80',['60','70','80','90'],'number','每次乘2。'],['2、3、5、8、12、？','17',['16','17','18','19'],'number','差依次增加1。'],['64、32、16、8、？','4',['2','3','4','6'],'number','每次除以2。'],['所有猫都是动物；小花是猫。小花一定是动物吗？','是',['是','否','无法判断','不一定'],'logic','由前提可以直接推出。'],['甲比乙高，乙比丙高。谁最高？','甲',['甲','乙','丙','无法判断'],'logic','高度关系具有传递性。'],['若今天是星期三，10天后是星期几？','星期六',['星期五','星期六','星期日','星期一'],'logic','10天相当于一周加3天。'],['一只钟敲6下用5秒，按相同间隔敲12下需要几秒？','11秒',['10秒','11秒','12秒','15秒'],'logic','6下有5个间隔，12下有11个间隔。'],['三个盒子只有一个装球。A说在B，B说不在B，C说不在A。若只有一句真话，球在哪？','A',['A','B','C','无法判断'],'logic','球在A时仅B的话为真。'],['若所有A都是B，但不是所有B都是A，哪项一定正确？','有些B不是A',['所有B都是A','有些B不是A','所有A不是B','没有A是B'],'logic','不是所有B都是A意味着至少有一个B不是A。'],['小王排队，从前数第5，从后数第4，共有几人？','8',['7','8','9','10'],'logic','5+4-1=8。'],['一张纸对折两次，展开后理论上分成几块等面积区域？','4',['2','3','4','8'],'logic','每次对折区域数量翻倍。'],['A、C、E、G、？','I',['H','I','J','K'],'logic','英文字母隔一个取一个。'],['红球2个、蓝球3个，至少取几个才能保证取到两个同色球？','3',['2','3','4','5'],'logic','两种颜色，取3个必有两个同色。'],['9、18、27、36、？','45',['42','44','45','48'],'number','9的倍数序列。'],['1、2、4、7、11、？','16',['15','16','17','18'],'number','差依次为1、2、3、4、5。']];let game=[],idx=0,points=0,mode='',locked=false,memorySeq=[],memoryStep=0,memoryRound=0,memoryActive=false,timer=null,reactionStart=0,reactionState='';function goHome(){clearTimeout(timer);$('game').classList.add('hidden');$('home').classList.remove('hidden');renderRecord()}function showGame(title){$('home').classList.add('hidden');$('game').classList.remove('hidden');$('gameTitle').textContent=title;window.scrollTo(0,0)}function shuffle(a,seed){let b=[...a];for(let i=b.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;let j=seed%(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}function daySeed(){const d=new Date();return Number(d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'))}function startQuiz(m){mode=m;const base=m==='number'?questions.filter(q=>q[3]==='number'):m==='logic'?questions.filter(q=>q[3]==='logic'):questions;game=shuffle(base,m==='daily'?daySeed():Date.now()>>>0).slice(0,m==='daily'?5:10);idx=0;points=0;showGame(({mix:'综合脑力测评',number:'数字逻辑',logic:'逻辑推理',daily:'每日挑战'})[m]);renderQ()}function renderQ(){locked=false;if(idx>=game.length)return finishQuiz();const q=game[idx],opts=shuffle(q[2],(Date.now()+idx*57)>>>0);$('gameBody').innerHTML='<p class="muted">第 '+(idx+1)+' / '+game.length+' 题</p><div class="bar"><div style="width:'+(idx/game.length*100)+'%"></div></div><h2 style="margin-top:24px">'+q[0]+'</h2>'+opts.map((o,i)=>'<button class="choice" data-i="'+i+'">'+o+'</button>').join('')+'<div id="feedback"></div>';[...document.querySelectorAll('.choice')].forEach(b=>b.onclick=()=>answer(b.textContent,b))}function answer(v,el){if(locked)return;locked=true;const q=game[idx],ok=v===q[1];if(ok)points++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q[1])b.classList.add('correct');else if(b===el)b.classList.add('wrong')});$('feedback').innerHTML='<p>'+(ok?'✅ 回答正确':'❌ 正确答案：'+q[1])+'</p><p class="muted">'+q[4]+'</p><button class="button wide" id="next">'+(idx===game.length-1?'查看成绩':'下一题')+'</button>';$('next').onclick=()=>{idx++;renderQ()}}function finishQuiz(){const score=Math.round(points/game.length*100);try{const old=JSON.parse(localStorage.getItem('brain_scores')||'[]');old.unshift({mode,score,date:new Date().toLocaleDateString('zh-CN')});localStorage.setItem('brain_scores',JSON.stringify(old.slice(0,30)))}catch(e){}$('gameBody').innerHTML='<p class="center">挑战完成</p><div class="score">'+score+'分</div><p class="center">答对 '+points+' / '+game.length+' 题</p><p class="muted center">趣味题库得分，不是IQ数值或人群排名。</p><button class="button wide" onclick="startQuiz(mode)">再挑战一次</button><button class="button wide secondary" onclick="goHome()" style="margin-top:10px">返回首页</button>'}function renderRecord(){try{const a=JSON.parse(localStorage.getItem('brain_scores')||'[]');$('record').textContent=a.length?'已完成 '+a.length+' 次测评 · 最近得分 '+a[0].score+' 分':'每日一点挑战，让思维更有趣'}catch(e){}}function startMemory(){clearTimeout(timer);memoryRound=0;memorySeq=[];showGame('👀 记忆挑战');nextMemory()}function nextMemory(){memoryRound++;memoryStep=0;memoryActive=false;memorySeq.push(Math.floor(Math.random()*9));$('gameBody').innerHTML='<p>第 '+memoryRound+' 轮：记住亮起方格的顺序</p><div class="memory-grid">'+Array.from({length:9},(_,i)=>'<button class="cell" data-n="'+i+'"></button>').join('')+'</div><p id="memoryHint" class="center muted">观察中，请稍候……</p>';const cells=[...document.querySelectorAll('.cell')];cells.forEach((c,i)=>c.onclick=()=>memoryTap(i));let t=650;memorySeq.forEach((n,i)=>{setTimeout(()=>cells[n]?.classList.add('on'),t+i*900);setTimeout(()=>cells[n]?.classList.remove('on'),t+i*900+520)});timer=setTimeout(()=>{memoryActive=true;$('memoryHint').textContent='现在按顺序点击方格'},t+memorySeq.length*900)}function memoryTap(n){if(!memoryActive)return;const cells=[...document.querySelectorAll('.cell')];if(n!==memorySeq[memoryStep]){memoryActive=false;$('memoryHint').innerHTML='挑战结束！完成 '+(memoryRound-1)+' 轮<br><button class="button" onclick="startMemory()">重新开始</button>';return}cells[n].classList.add('hit');setTimeout(()=>cells[n]?.classList.remove('hit'),200);memoryStep++;if(memoryStep===memorySeq.length){memoryActive=false;$('memoryHint').textContent='正确！进入下一轮……';timer=setTimeout(nextMemory,900)}}function startReaction(){clearTimeout(timer);showGame('⚡ 反应速度');$('gameBody').innerHTML='<p>等待区域变绿后立即点击。提前点击需重新开始。</p><div id="reaction" class="reaction">点击开始</div><p id="reactResult" class="center muted"></p>';$('reaction').onclick=reactClick;reactionState='idle'}function reactClick(){const box=$('reaction');if(reactionState==='idle'||reactionState==='early'||reactionState==='done'){reactionState='waiting';box.className='reaction';box.textContent='等待变绿……';$('reactResult').textContent='';timer=setTimeout(()=>{reactionState='ready';reactionStart=performance.now();box.className='reaction ready';box.textContent='现在点击！'},1800+Math.random()*2400)}else if(reactionState==='waiting'){clearTimeout(timer);reactionState='early';box.className='reaction early';box.textContent='点早了！点击重试'}else if(reactionState==='ready'){const ms=Math.round(performance.now()-reactionStart);reactionState='done';box.className='reaction ready';box.textContent=ms+' 毫秒 · 点击再试';$('reactResult').textContent='这是单次设备点击反应时间，仅供娱乐。'}}renderRecord();</script></body></html>
