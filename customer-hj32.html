<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>豪竞3.2｜客户专属分析</title>
<style>
:root{--bg:#06111f;--panel:#0c1b2e;--panel2:#102641;--line:#1d3d61;--text:#eef7ff;--muted:#8ba6bf;--blue:#59aaff;--green:#34d399;--yellow:#f5c451;--red:#fb7185;--purple:#c084fc}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 85% -10%,#183d69 0,#06111f 42%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:18px 14px 48px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.brand{font-size:25px;font-weight:900;letter-spacing:.2px}.sub{color:var(--muted);font-size:12px;line-height:1.6;margin-top:5px}.topright{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.pill{font-size:11px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#0a192a;color:#bcd0e4}.pill.good{border-color:#276b52;color:#91ebc1}.logout,.refresh{border:1px solid #28537c;border-radius:9px;background:#102d4c;color:#dbedff;padding:7px 10px;font-size:12px;cursor:pointer}.tabs{display:flex;gap:7px;margin:15px 0 11px;overflow:auto}.tabs button{border:1px solid transparent;background:transparent;color:#8da7c0;padding:8px 12px;border-radius:10px;white-space:nowrap;cursor:pointer}.tabs button.on{background:#153b64;border-color:#28649a;color:#fff}.notice{border:1px solid #2c5c82;background:#0d253e;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.65;margin-bottom:11px}.notice.good{border-color:#24664b;background:#0e291f;color:#a1ecc6}.notice.warn{border-color:#755a29;background:#2a2416;color:#ffe0a0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric,.card,.section{background:linear-gradient(180deg,#0e2239,#0a1829);border:1px solid var(--line);border-radius:15px}.metric{padding:13px;min-height:104px}.ml{font-size:11px;color:var(--muted)}.mv{font-size:24px;font-weight:900;margin:8px 0 4px}.ms{font-size:11px;color:#87a3bc;line-height:1.45}.section{margin-top:12px;overflow:hidden}.shead{display:flex;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);align-items:center}.shead h2{font-size:16px;margin:0}.shead span{font-size:11px;color:var(--muted);text-align:right}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:11px}.match{padding:14px;background:#0b1b2d;border:1px solid #1b3a5a;border-radius:14px}.mh,.mainline,.foot{display:flex;justify-content:space-between;gap:8px;align-items:center}.no{font-weight:900;color:#f1ca72}.league,.time,.tiny{font-size:11px;color:var(--muted)}.teams{font-size:16px;font-weight:850;margin:10px 0 8px}.pick{font-size:20px;font-weight:950}.prob{font-size:13px;color:#9cd3ff}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{border:1px solid #244866;background:#091827;border-radius:999px;padding:5px 8px;font-size:11px;color:#c0d2e2}.chip.single{border-color:#267355;color:#8ce7b8}.chip.double{border-color:#694f86;color:#dab8ff}.chip.candidate{border-color:#84652d;color:#ffd98a}.chip.pass{border-color:#6e4050;color:#ffacba}.result{margin-top:10px;padding-top:9px;border-top:1px solid #19344e;font-size:12px}.hit{color:#7be2ad}.miss{color:#ff9bac}.pending{color:#d9bf7c}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px 11px;border-bottom:1px solid #142f4b;text-align:left;white-space:nowrap}th{color:#9cb4ca;background:#0a1b2d;position:sticky;top:0}.login{min-height:92vh;display:grid;place-items:center;padding:18px}.loginbox{width:min(92vw,410px);background:#0c1c2f;border:1px solid #224566;border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.loginbox h1{margin:0 0 7px;font-size:24px}.loginbox label{display:block;font-size:12px;color:#9bb2c8;margin:13px 0 6px}.loginbox input{width:100%;padding:13px;border-radius:10px;border:1px solid #284969;background:#071522;color:#fff;font-size:16px}.loginbox button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:18px;background:#2d83e5;color:#fff;font-weight:850}.err{display:none;margin-top:11px;padding:9px 10px;border-radius:9px;background:#341923;border:1px solid #743447;color:#ffb0bd;font-size:12px}.loading{min-height:70vh;display:grid;place-items:center;color:var(--muted);text-align:center}.footer{text-align:center;color:#657f98;font-size:11px;line-height:1.7;margin-top:16px}.barrow{display:grid;grid-template-columns:72px 1fr 72px;gap:9px;align-items:center;padding:7px 0}.bar{height:9px;border-radius:999px;background:#142a41;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#327fd0,#63b5ff);border-radius:999px}.hrate{text-align:right;font-weight:800}.legend{padding:0 12px 12px;color:#8ba5be;font-size:11px;line-height:1.6}
@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:13px 10px 42px}.top{display:block}.topright{justify-content:flex-start;margin-top:10px}.brand{font-size:22px}.metrics{grid-template-columns:1fr 1fr}.mv{font-size:21px}.teams{font-size:15px}.shead{align-items:flex-start}.shead span{max-width:48%}.grid{padding:9px}}
</style>
</head>
<body><div id="app"><div class="loading">正在连接豪竞3.2客户专属版…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-member-api-v01';
const BUILD='HJ32-CUSTOMER-20260913-v1';
let DATA=null,TAB='live',TIMER=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return String(v)}};
const pct=v=>v==null?'—':Number(v).toFixed(2)+'%';
function token(){return localStorage.getItem('hj32_customer_token')||localStorage.getItem('hao_member_access_token')||''}
function saveSession(s){if(!s?.access_token)return;localStorage.setItem('hj32_customer_token',s.access_token);if(s.refresh_token)localStorage.setItem('hj32_customer_refresh',s.refresh_token)}
function logout(){localStorage.removeItem('hj32_customer_token');localStorage.removeItem('hj32_customer_refresh');DATA=null;clearInterval(TIMER);login()}
function login(){clearInterval(TIMER);document.getElementById('app').innerHTML='<div class="login"><form class="loginbox" id="lf"><h1>豪竞3.2</h1><div class="sub">客户专属赛事分析 · 赛前冻结 · 自动同步</div><label>会员邮箱</label><input id="email" type="email" autocomplete="username" placeholder="请输入会员邮箱" required><label>密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button>进入专属页面</button><div class="err" id="err"></div><div class="sub" style="margin-top:14px">没有账号请联系管理员开通。历史表现仅作模型复盘参考。</div></form></div>';document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('#lf button'),er=document.getElementById('err');b.disabled=true;b.textContent='登录中…';er.style.display='none';try{const r=await fetch(API+'?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const j=await r.json();if(!r.ok||!j.ok||!j.session)throw new Error(j.error||'登录失败');saveSession(j.session);await load(true)}catch(e2){er.textContent=e2.message||'登录失败';er.style.display='block';b.disabled=false;b.textContent='进入专属页面'}}}
async function refreshSession(){const rt=localStorage.getItem('hj32_customer_refresh');if(!rt)return false;try{const r=await fetch(API+'?action=refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});const j=await r.json();if(r.ok&&j.ok&&j.session){saveSession(j.session);return true}}catch(_){}return false}
async function load(show=false,retry=true){if(!token()){login();return}if(show)document.getElementById('app').innerHTML='<div class="loading">正在读取最新赛前冻结数据…</div>';try{let r=await fetch(API+'?action=hj32&t='+Date.now(),{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(r.status===401&&retry&&await refreshSession())return load(show,false);const j=await r.json();if(r.status===401){logout();return}if(r.status===403)throw new Error('会员权限已到期，请联系管理员续期');if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DATA=j.dashboard;render();clearInterval(TIMER);TIMER=setInterval(()=>{if(document.visibilityState==='visible')load(false)},60000)}catch(e){document.getElementById('app').innerHTML='<div class="loading">'+esc(e.message)+'<br><br><button class="refresh" onclick="load(true)">重新连接</button></div>'}}
function metric(l,v,s){return '<div class="metric"><div class="ml">'+esc(l)+'</div><div class="mv">'+esc(v)+'</div><div class="ms">'+esc(s)+'</div></div>'}
function classChip(x){const c=String(x?.code||'');if(c==='SINGLE')return '<span class="chip single">🟢 单选</span>';if(c==='STRONG_DOUBLE')return '<span class="chip double">🟣 强双</span>';if(c==='CANDIDATE_DOUBLE')return '<span class="chip candidate">🟠 候选双</span>';if(c==='PASS')return '<span class="chip pass">⚪ '+(x?.hard_pass?'硬PASS':'PASS')+'</span>';return '<span class="chip">待确认</span>'}
function matchCard(r){const sd=r.single_double||{},p=r.top1_probability==null?'—':(r.top1_probability*100).toFixed(1)+'%',res=r.result||{},rc=!res.verified?'pending':res.top1_hit?'hit':'miss',rt=!res.verified?'⏳ 待结算':('赛果 '+res.score+' · '+res.outcome+' · '+(res.top1_hit?'✅ 首选命中':'❌ 首选未中'));const picks=(sd.picks||[]).length?(sd.picks||[]).join(' + '):'';return '<div class="match"><div class="mh"><div><span class="no">'+esc(r.match_no)+'</span> <span class="league">'+esc(r.league)+'</span></div><span class="time">'+esc(fmt(r.kickoff_bjt))+'</span></div><div class="teams">'+esc(r.home_team)+' vs '+esc(r.away_team)+'</div><div class="mainline"><div class="pick">'+esc(r.top1||'未确认')+'</div><div class="prob">模型概率 '+esc(p)+'</div></div><div class="chips">'+classChip(sd)+'<span class="chip">第二方向 '+esc(r.second_pick||'—')+'</span><span class="chip">信心 '+esc(r.confidence)+'</span><span class="chip">风险 '+esc(r.risk)+'</span>'+(picks?'<span class="chip">保护 '+esc(picks)+'</span>':'')+(r.handicap_pick?'<span class="chip">让球 '+esc(r.handicap_pick)+'</span>':'')+'</div><div class="result '+rc+'">'+esc(rt)+'</div></div>'}
function liveView(){const d=DATA,l=d.live||{},rows=l.rows||[],run=d.run||{};return '<div class="notice good"><b>实时同步：</b> 当前正式版本 '+esc(d.model?.name||'豪竞3.2')+' · '+esc(d.model?.revision_tag||'')+'。本页与正式数据库同源，每60秒刷新一次；赛前观点冻结后不因赛果修改。</div><div class="metrics">'+metric('当前赛事池',String(rows.length)+' 场','销售日 '+(run.pool_date||'—'))+metric('已结算Top1',String(l.hits||0)+' / '+String(l.settled||0),l.settled?'当前已结算命中率 '+pct(l.rate):'等待赛果')+metric('模型修订','3.2','Native PASS正式运行')+metric('最后同步',fmt(d.generated_at),'运行 '+fmt(run.run_time))+'</div><section class="section"><div class="shead"><h2>今日全池赛前观点</h2><span>首选方向 + 第二方向 + 单双结构</span></div><div class="grid">'+rows.map(matchCard).join('')+'</div></section>'}
function historyView(){const h=DATA.history||{},v=DATA.locked_validation||{},daily=h.daily||[];return '<div class="notice warn"><b>成绩口径说明：</b> 8/31—9/12为当时各正式版本的真实赛前冻结实战记录；3.2锁定验证单独展示，两者不混算。历史成绩不代表未来结果。</div><div class="metrics">'+metric('8/31—9/12实战累计',pct(h.rate),String(h.hits||0)+' / '+String(h.scored||0)+' · 历史版本演进')+metric('3.2锁定Top1',pct(v.single_direction?.rate),String(v.single_direction?.hits||0)+' / '+String(v.single_direction?.scored||0)+' · 历史锁定验证')+metric('3.2单双覆盖',pct(v.single_double_coverage?.rate),String(v.single_double_coverage?.hits||0)+' / '+String(v.single_double_coverage?.scored||0)+' · 历史锁定验证')+metric('记录原则','不删错场','赛前冻结 · 赛后不补答案')+'</div><section class="section"><div class="shead"><h2>8月31日—9月12日逐日记录</h2><span>真实赛前冻结 · 版本随研发迭代</span></div><div style="padding:10px 14px">'+daily.map(x=>'<div class="barrow"><div>'+esc(x.date.slice(5))+' <span class="tiny">v'+esc(x.version)+'</span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,Number(x.rate||0)))+'%"></i></div><div class="hrate">'+pct(x.rate)+'</div></div>').join('')+'</div><div class="legend">累计 '+esc(h.hits)+' / '+esc(h.scored)+' = '+pct(h.rate)+'。该区间包含豪竞历史版本迭代，不应冒充“3.2前瞻实战命中率”。</div></section><section class="section"><div class="tablewrap"><table><thead><tr><th>日期</th><th>版本</th><th>命中</th><th>样本</th><th>命中率</th></tr></thead><tbody>'+daily.map(x=>'<tr><td>'+esc(x.date)+'</td><td>豪竞'+esc(x.version)+'</td><td>'+esc(x.hits)+'</td><td>'+esc(x.scored)+'</td><td><b>'+pct(x.rate)+'</b></td></tr>').join('')+'</tbody></table></div></section>'}
function aboutView(){return '<div class="notice good"><b>豪竞3.2客户专属版</b><br>页面只展示经过脱敏的赛前模型结论，不公开内部算法、数据源链、模型委员会或参数阈值。所有展示记录坚持“赛前冻结、赛后不回写、错场不删除、未确认不猜”。</div><section class="section"><div class="grid"><div class="card" style="padding:15px"><b>客户能看到什么</b><div class="sub">当前全池首选方向、第二方向、模型概率、单双结构、风险级别、让球参考及赛后核验。</div></div><div class="card" style="padding:15px"><b>客户不会看到什么</b><div class="sub">内部计算公式、具体数据源权重、提示词、模型委员会细节、数据库结构与研发阈值。</div></div><div class="card" style="padding:15px"><b>历史成绩</b><div class="sub">实战冻结与历史锁定验证严格分栏，不把开发回放包装成未来保证。</div></div><div class="card" style="padding:15px"><b>使用说明</b><div class="sub">本页属于体育赛事数据与模型分析服务，不提供结果保证。请结合临场信息独立判断。</div></div></div></section>'}
function render(){if(!DATA)return;const body=TAB==='history'?historyView():TAB==='about'?aboutView():liveView();document.getElementById('app').innerHTML='<div class="wrap"><div class="top"><div><div class="brand">豪竞3.2｜客户专属版</div><div class="sub">赛前数据模型 · 实时同步 · 历史可复盘</div></div><div class="topright"><span class="pill good">● 数据已同步</span><span class="pill">'+esc(fmt(DATA.generated_at))+'</span><button class="refresh" onclick="load(true)">刷新</button><button class="logout" onclick="logout()">退出</button></div></div><div class="tabs"><button class="'+(TAB==='live'?'on':'')+'" onclick="TAB=\'live\';render()">今日赛事</button><button class="'+(TAB==='history'?'on':'')+'" onclick="TAB=\'history\';render()">历史命中</button><button class="'+(TAB==='about'?'on':'')+'" onclick="TAB=\'about\';render()">模型说明</button></div>'+body+'<div class="footer">豪竞3.2客户专属版 · '+esc(BUILD)+'<br>'+esc(DATA.disclaimer||'历史表现不代表未来结果。')+'</div></div>'}
load(true);
</script></body></html>
