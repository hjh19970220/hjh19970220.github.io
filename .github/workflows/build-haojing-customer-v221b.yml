name: Build HaoJing Customer APK v2.2.1 Fixed
on:
  push:
    branches: [haojing-android]
    paths: ['.github/workflows/build-haojing-customer-v221b.yml','haojing-customer-v20/patch_v221.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Assemble source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p haojing-customer-v20/app/src/main/java/com/haojing/app
          cat haojing-customer-v20/srcparts/0*.txt > haojing-customer-v20/app/src/main/java/com/haojing/app/MainActivity.java
          python3 - <<'PY'
          from pathlib import Path
          p=Path('haojing-customer-v20/patch_v221.py')
          s=p.read_text()
          old="ns,n=re.subn(pat,body+'\\n ',s,flags=re.S)"
          new="ns,n=re.subn(pat,lambda m: body+'\\n ',s,flags=re.S)"
          if old not in s: raise SystemExit('replacement line not found')
          p.write_text(s.replace(old,new))
          PY
          python3 haojing-customer-v20/patch_v221.py
          sed -i "s/versionCode 220; versionName '2.2.0'/versionCode 221; versionName '2.2.1'/" haojing-customer-v20/app/build.gradle
          grep -q 'homeFilter' haojing-customer-v20/app/src/main/java/com/haojing/app/MainActivity.java
          grep -q 'isFormalFeatured' haojing-customer-v20/app/src/main/java/com/haojing/app/MainActivity.java
          grep -q "versionName '2.2.1'" haojing-customer-v20/app/build.gradle
      - name: Build APK
        run: cd haojing-customer-v20 && gradle assembleDebug --no-daemon
      - name: Package
        run: cp haojing-customer-v20/app/build/outputs/apk/debug/app-debug.apk HaoJing-Customer-v2.2.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HaoJing-Customer-v2.2.1
          path: HaoJing-Customer-v2.2.1.apk
          retention-days: 30
