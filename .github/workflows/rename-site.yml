name: Rename site brand

on:
  push:
    paths:
      - '.github/workflows/rename-site.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename site brand
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('latest.html'), Path('live.html')]
          old_build = '2026-09-04 GPT二审完整字段v5'
          new_build = '2026-09-04 豪足球模型品牌v6'
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = s.replace('豪模型私人控制台', '豪·足球模型')
              s = s.replace('正在连接豪模型控制台…', '正在连接豪·足球模型…')
              s = s.replace(old_build, new_build)
              p.write_text(s, encoding='utf-8')
          Path('version.json').write_text('{"build":"'+new_build+'","updated_at":"2026-09-04"}', encoding='utf-8')
          PY
          git config user.name "hao-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html latest.html live.html version.json
          if ! git diff --cached --quiet; then
            git commit -m "Rename site to 豪·足球模型"
            git push
          fi
