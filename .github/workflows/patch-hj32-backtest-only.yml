name: patch-hj32-backtest-only
on:
  push:
    paths:
      - ".github/workflows/patch-hj32-backtest-only.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Remove all live result performance from customer cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer-hj32.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('function matchCard(r){')
          end=s.index('function liveView(){')
          match_card="""function matchCard(r){const sd=r.single_double||{},p=r.top1_probability==null?'—':(r.top1_probability*100).toFixed(1)+'%';const picks=(sd.picks||[]).length?(sd.picks||[]).join(' + '):'';return '<div class=\"match\"><div class=\"mh\"><div><span class=\"no\">'+esc(r.match_no)+'</span> <span class=\"league\">'+esc(r.league)+'</span></div><span class=\"time\">'+esc(fmt(r.kickoff_bjt))+'</span></div><div class=\"teams\">'+esc(r.home_team)+' vs '+esc(r.away_team)+'</div><div class=\"mainline\"><div class=\"pick\">'+esc(r.top1||'未确认')+'</div><div class=\"prob\">模型概率 '+esc(p)+'</div></div><div class=\"chips\">'+classChip(sd)+'<span class=\"chip\">第二方向 '+esc(r.second_pick||'—')+'</span><span class=\"chip\">信心 '+esc(r.confidence)+'</span><span class=\"chip\">风险 '+esc(r.risk)+'</span>'+(picks?'<span class=\"chip\">保护 '+esc(picks)+'</span>':'')+(r.handicap_pick?'<span class=\"chip\">让球 '+esc(r.handicap_pick)+'</span>':'')+'</div></div>'}\n"""
          s=s[:start]+match_card+s[end:]
          p.write_text(s,encoding='utf-8')
          assert '首选命中' not in s
          assert '首选未中' not in s
          assert '当前已结算命中率' not in s
          assert '8/31—9/12实战累计' not in s
          assert 'Top1回溯命中率' in s
          PY
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('customer-hj32.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/customer.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/customer.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-hj32.html
          git diff --cached --quiet || git commit -m "remove live result record from customer dashboard"
          git push
