name: Build HaoJing APK v1.3.1

on:
  push:
    branches: [haojing-android]
    paths: ['.github/workflows/build-haojing-apk-v131.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Validate feeds first
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' .github/workflows/build-haojing-apk.yml | head -1)
          BASE='https://tqlibowvnwfkaseqqvvp.supabase.co/rest/v1'
          curl --fail-with-body -sS -H "apikey: $KEY" "$BASE/hao_fullpool_unbeaten_feed_v13?select=publish_date,match_no&publish_date=eq.2026-09-11" -o /tmp/f11
          curl --fail-with-body -sS -H "apikey: $KEY" "$BASE/hao_fullpool_unbeaten_feed_v13?select=publish_date,match_no&publish_date=eq.2026-09-12" -o /tmp/f12
          curl --fail-with-body -sS -H "apikey: $KEY" "$BASE/hao_customer_feed_v13?select=publish_date,match_no,record_kind" -o /tmp/p
          test "$(jq length /tmp/f11)" -eq 12
          test "$(jq length /tmp/f12)" -eq 30
          test "$(jq '[.[]|select(.publish_date=="2026-08-31" and .record_kind=="历史回放")]|length' /tmp/p)" -ge 1
          test "$(jq '[.[]|select(.publish_date=="2026-09-11" and .record_kind=="历史回放")]|length' /tmp/p)" -ge 1
          test "$(jq '[.[]|select(.publish_date=="2026-09-12" and .record_kind=="正式前瞻")]|length' /tmp/p)" -ge 1
          echo FEEDS_OK
      - name: Generate project
        shell: bash
        run: |
          set -e
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' .github/workflows/build-haojing-apk.yml | head -1)
          rm -rf app131; mkdir -p app131/app/src/main/java/com/haojing/app app131/app/src/main/res/values
          cat > app131/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='HaoJing131'; include ':app'
          EOF
          cat > app131/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > app131/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.haojing.app'; compileSdk 35; defaultConfig { applicationId 'com.haojing.app'; minSdk 26; targetSdk 35; versionCode 131; versionName '1.3.1' } }
          EOF
          cat > app131/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:statusBarColor">#D86A00</item><item name="android:navigationBarColor">#FFFFFF</item></style></resources>
          EOF
          cat > app131/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="豪竞引擎"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app131/app/src/main/java/com/haojing/app/MainActivity.java <<'EOF'
          package com.haojing.app;
          import android.app.*;import android.os.*;import android.graphics.*;import android.graphics.drawable.*;import android.view.*;import android.widget.*;import org.json.*;import java.io.*;import java.net.*;import java.nio.charset.StandardCharsets;import java.util.*;
          public class MainActivity extends Activity{
            static final String BASE="https://tqlibowvnwfkaseqqvvp.supabase.co/rest/v1/",KEY="__KEY__";
            int orange=0xFFD86A00,dark=0xFF212529,muted=0xFF6E7278,bg=0xFFF7F7F7,red=0xFFE6463C,blue=0xFF286EDC,warn=0xFFE88214;
            LinearLayout body,dates,nav;JSONArray full=new JSONArray(),picks=new JSONArray();String day="2026-09-12",page="home";
            int dp(int x){return(int)(x*getResources().getDisplayMetrics().density+.5f);} TextView tv(String s,int z,int c,boolean b){TextView v=new TextView(this);v.setText(s);v.setTextSize(z);v.setTextColor(c);if(b)v.setTypeface(null,1);v.setPadding(dp(4),dp(4),dp(4),dp(4));return v;} GradientDrawable box(int c,int r){GradientDrawable g=new GradientDrawable();g.setColor(c);g.setCornerRadius(dp(r));return g;} LinearLayout card(){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(14),dp(11),dp(14),dp(11));c.setBackground(box(Color.WHITE,12));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,dp(5),0,dp(5));c.setLayoutParams(p);return c;}
            public void onCreate(Bundle b){super.onCreate(b);build();load();}
            void build(){LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(bg);LinearLayout h=new LinearLayout(this);h.setGravity(Gravity.CENTER_VERTICAL);h.setPadding(dp(14),dp(10),dp(14),dp(10));h.setBackgroundColor(orange);LinearLayout title=new LinearLayout(this);title.setOrientation(LinearLayout.VERTICAL);title.addView(tv("豪竞引擎",23,Color.WHITE,true));title.addView(tv("HAOJING · 数据驱动 · 理性决策",11,0xFFFFE7D1,false));h.addView(title,new LinearLayout.LayoutParams(0,-2,1));TextView ref=tv("刷新",13,Color.WHITE,true);ref.setOnClickListener(v->load());h.addView(ref);root.addView(h);HorizontalScrollView hs=new HorizontalScrollView(this);dates=new LinearLayout(this);dates.setPadding(dp(8),dp(7),dp(8),dp(7));hs.addView(dates);root.addView(hs);ScrollView sv=new ScrollView(this);body=new LinearLayout(this);body.setOrientation(LinearLayout.VERTICAL);body.setPadding(dp(10),0,dp(10),dp(12));sv.addView(body);root.addView(sv,new LinearLayout.LayoutParams(-1,0,1));nav=new LinearLayout(this);root.addView(nav);setContentView(root);drawNav();}
            void drawNav(){nav.removeAllViews();String[][] a={{"首页","home"},{"全池","full"},{"精选","picks"},{"战绩","record"},{"我的","me"}};for(String[] q:a){boolean on=page.equals(q[1]);TextView x=tv(q[0],13,on?orange:muted,on);x.setGravity(Gravity.CENTER);x.setBackground(box(on?0xFFFFF1E5:Color.WHITE,0));x.setOnClickListener(v->{page=q[1];render();});nav.addView(x,new LinearLayout.LayoutParams(0,dp(52),1));}}
            void load(){new Thread(()->{JSONArray a=null,b=null;try{a=get("hao_fullpool_unbeaten_feed_v13?select=publish_date,match_no,league,home_team,away_team,unbeaten_pick,cover_text,eval_status,result_text,risk_badge,risk_reason&order=publish_date.desc,match_no.asc");}catch(Exception ignored){}try{b=get("hao_customer_feed_v13?select=publish_date,match_no,league,home_team,away_team,category,selected_pick,selected_price,recommendation_rank,settle_status,result_text,record_kind,short_reason&order=publish_date.desc,recommendation_rank.asc");}catch(Exception ignored){}JSONArray fa=a,fb=b;runOnUiThread(()->{if(fa!=null)full=fa;if(fb!=null)picks=fb;render();});}).start();}
            JSONArray get(String p)throws Exception{HttpURLConnection c=(HttpURLConnection)new URL(BASE+p).openConnection();c.setConnectTimeout(12000);c.setReadTimeout(12000);c.setRequestProperty("apikey",KEY);int code=c.getResponseCode();InputStream in=code<300?c.getInputStream():c.getErrorStream();String s=new String(in.readAllBytes(),StandardCharsets.UTF_8);if(code>=300)throw new IOException("HTTP "+code);return new JSONArray(s);}
            void render(){drawNav();drawDates();body.removeAllViews();if(page.equals("home"))home();else if(page.equals("full"))fullPage();else if(page.equals("picks"))picksPage();else if(page.equals("record"))record();else me();}
            void drawDates(){dates.removeAllViews();if(!(page.equals("full")||page.equals("picks"))){dates.setVisibility(View.GONE);return;}dates.setVisibility(View.VISIBLE);JSONArray src=page.equals("full")?full:picks;LinkedHashSet<String> set=new LinkedHashSet<>();for(int i=0;i<src.length();i++){String d=src.optJSONObject(i).optString("publish_date");if(!d.isEmpty())set.add(d);}if(!set.contains(day)&&!set.isEmpty())day=set.iterator().next();for(String d:set){TextView x=tv(d.substring(5).replace("-","/"),14,d.equals(day)?Color.WHITE:dark,true);x.setGravity(Gravity.CENTER);x.setBackground(box(d.equals(day)?orange:Color.WHITE,10));LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(dp(66),dp(38));lp.setMargins(dp(3),0,dp(3),0);x.setLayoutParams(lp);x.setOnClickListener(v->{day=d;render();});dates.addView(x);}}
            void home(){LinearLayout c=card();int n=0,cold=0;for(int i=0;i<full.length();i++){JSONObject o=full.optJSONObject(i);if(day.equals(o.optString("publish_date"))){n++;if(o.optString("risk_badge").equals("冷门预警"))cold++;}}c.addView(tv("今日全池 "+n+" 场",23,orange,true));c.addView(tv("冷门预警 "+cold+" 场",15,warn,true));body.addView(c);LinearLayout p=card();int pn=0;for(int i=0;i<picks.length();i++)if(day.equals(picks.optJSONObject(i).optString("publish_date")))pn++;p.addView(tv("今日精选 "+pn+" 场",21,dark,true));p.addView(tv("底部菜单均可点击；精选和全池都支持历史日期切换。",13,muted,false));body.addView(p);}
            void fullPage(){int hit=0,loss=0,pend=0;for(int i=0;i<full.length();i++){JSONObject o=full.optJSONObject(i);if(!day.equals(o.optString("publish_date")))continue;String s=o.optString("eval_status");if(s.equals("评测成功"))hit++;else if(s.equals("评测失败"))loss++;else pend++;}LinearLayout s=card();int done=hit+loss;s.addView(tv(done>0?hit+"中"+done+"场 · "+String.format(Locale.CHINA,"%.1f%%",100.0*hit/done):"待赛 "+pend+" 场",23,orange,true));body.addView(s);for(int i=0;i<full.length();i++){JSONObject o=full.optJSONObject(i);if(!day.equals(o.optString("publish_date")))continue;LinearLayout c=card();String no=o.optString("match_no");if(no.matches("\\d+"))no=String.format(Locale.CHINA,"%03d",Integer.parseInt(no));LinearLayout r=new LinearLayout(this);r.addView(tv(no+"  "+o.optString("league"),13,muted,true),new LinearLayout.LayoutParams(0,-2,1));String rb=o.optString("risk_badge");if(!rb.isEmpty())r.addView(tv(rb,13,rb.equals("冷门预警")?warn:muted,true));c.addView(r);c.addView(tv(o.optString("home_team")+"  vs  "+o.optString("away_team"),17,dark,true));c.addView(tv(o.optString("unbeaten_pick"),20,orange,true));String rs=o.optString("result_text");if(!rs.isEmpty())c.addView(tv("赛果 "+rs+" · "+o.optString("eval_status"),12,muted,false));if(!rb.isEmpty())c.addView(tv(o.optString("risk_reason"),12,rb.equals("冷门预警")?warn:muted,false));body.addView(c);}}
            void picksPage(){int n=0;for(int i=0;i<picks.length();i++){JSONObject o=picks.optJSONObject(i);if(!day.equals(o.optString("publish_date")))continue;n++;LinearLayout c=card();LinearLayout r=new LinearLayout(this);r.addView(tv(o.optString("match_no")+"  "+o.optString("league"),13,muted,true),new LinearLayout.LayoutParams(0,-2,1));String kind=o.optString("record_kind");r.addView(tv(kind,12,kind.equals("正式前瞻")?orange:blue,true));c.addView(r);c.addView(tv(o.optString("home_team")+"  vs  "+o.optString("away_team"),17,dark,true));c.addView(tv(o.optString("selected_pick"),21,orange,true));String sp=o.optString("selected_price"),st=o.optString("settle_status");c.addView(tv((sp.isEmpty()?"":"参考SP "+sp+" · ")+st,13,st.equals("命中")?red:muted,true));String rs=o.optString("result_text");if(!rs.isEmpty())c.addView(tv("赛果 "+rs,12,muted,false));c.addView(tv(o.optString("short_reason"),12,muted,false));body.addView(c);}if(n==0)body.addView(tv("该日期暂无精选",15,muted,false));}
            void record(){int h=0,l=0;for(int i=0;i<full.length();i++){String s=full.optJSONObject(i).optString("eval_status");if(s.equals("评测成功"))h++;else if(s.equals("评测失败"))l++;}LinearLayout a=card();a.addView(tv("全池累计",15,muted,true));a.addView(tv((h+l)>0?h+"中"+(h+l)+"场 · "+String.format(Locale.CHINA,"%.2f%%",100.0*h/(h+l)):"暂无",23,orange,true));body.addView(a);int ph=0,pl=0;for(int i=0;i<picks.length();i++){String s=picks.optJSONObject(i).optString("settle_status");if(s.equals("命中"))ph++;else if(s.equals("未中"))pl++;}LinearLayout b=card();b.addView(tv("精选累计",15,muted,true));b.addView(tv((ph+pl)>0?ph+"中"+(ph+pl)+"场 · "+String.format(Locale.CHINA,"%.2f%%",100.0*ph/(ph+pl)):"暂无",22,dark,true));b.addView(tv("历史回放与正式前瞻在精选卡片中分别标识。",12,muted,false));body.addView(b);}
            void me(){LinearLayout c=card();c.addView(tv("豪竞引擎 v1.3.1",22,orange,true));c.addView(tv("首页 / 全池 / 精选 / 战绩 / 我的：全部可点击。\n\n全池：PASS与冷门预警分开显示。\n精选：8/31—9/11历史回放，9/12起正式前瞻；每场显示竞彩赛号。",15,dark,false));body.addView(c);}
          }
          EOF
          sed -i "s|__KEY__|$KEY|g" app131/app/src/main/java/com/haojing/app/MainActivity.java
      - name: Build APK
        run: cd app131 && gradle assembleDebug --no-daemon
      - name: Rename
        run: cp app131/app/build/outputs/apk/debug/app-debug.apk HaoJing-Engine-v1.3.1.apk
      - uses: actions/upload-artifact@v4
        with: {name: HaoJing-Engine-v1.3.1, path: HaoJing-Engine-v1.3.1.apk}
