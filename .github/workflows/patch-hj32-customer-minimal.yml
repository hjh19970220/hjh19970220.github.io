name: patch-hj32-customer-minimal
on:
  push:
    paths:
      - ".github/workflows/patch-hj32-customer-minimal.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Simplify customer dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer-hj32.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const BUILD='HJ32-CUSTOMER-20260914-v2';","const BUILD='HJ32-CUSTOMER';")
          s=s.replace("赛前数据模型 · 实时同步 · 历史可复盘","赛前赛事分析 · 实时同步 · 历史回溯")
          s=s.replace("当前正式版本 '+esc(d.model?.name||'豪竞3.2')+' · '+esc(d.model?.revision_tag||'')+'。本页与正式数据库同源，每60秒刷新一次；赛前观点冻结后不因赛果修改。","豪竞3.2赛前观点已同步，每60秒自动刷新。")
          s=s.replace("metric('模型修订','3.2','Native PASS正式运行')","metric('当前版本','豪竞3.2','赛前分析持续同步')")
          s=s.replace("function matchCard(r){const sd=r.single_double||{},p=r.top1_probability==null?'—':(r.top1_probability*100).toFixed(1)+'%',res=r.result||{},rc=!res.verified?'pending':res.top1_hit?'hit':'miss',rt=!res.verified?'⏳ 待结算':('赛果 '+res.score+' · '+res.outcome+' · '+(res.top1_hit?'✅ 首选命中':'❌ 首选未中'));const picks=(sd.picks||[]).length?(sd.picks||[]).join(' + '):'';return '<div class=\"match\"><div class=\"mh\"><div><span class=\"no\">'+esc(r.match_no)+'</span> <span class=\"league\">'+esc(r.league)+'</span></div><span class=\"time\">'+esc(fmt(r.kickoff_bjt))+'</span></div><div class=\"teams\">'+esc(r.home_team)+' vs '+esc(r.away_team)+'</div><div class=\"mainline\"><div class=\"pick\">'+esc(r.top1||'未确认')+'</div><div class=\"prob\">模型概率 '+esc(p)+'</div></div><div class=\"chips\">'+classChip(sd)+'<span class=\"chip\">第二方向 '+esc(r.second_pick||'—')+'</span><span class=\"chip\">信心 '+esc(r.confidence)+'</span><span class=\"chip\">风险 '+esc(r.risk)+'</span>'+(picks?'<span class=\"chip\">保护 '+esc(picks)+'</span>':'')+(r.handicap_pick?'<span class=\"chip\">让球 '+esc(r.handicap_pick)+'</span>':'')+'</div><div class=\"result '+rc+'\">'+esc(rt)+'</div></div>'}","function matchCard(r){const sd=r.single_double||{},p=r.top1_probability==null?'—':(r.top1_probability*100).toFixed(1)+'%',picks=(sd.picks||[]).length?(sd.picks||[]).join(' + '):'';return '<div class=\"match\"><div class=\"mh\"><div><span class=\"no\">'+esc(r.match_no)+'</span> <span class=\"league\">'+esc(r.league)+'</span></div><span class=\"time\">'+esc(fmt(r.kickoff_bjt))+'</span></div><div class=\"teams\">'+esc(r.home_team)+' vs '+esc(r.away_team)+'</div><div class=\"mainline\"><div class=\"pick\">'+esc(r.top1||'未确认')+'</div><div class=\"prob\">参考概率 '+esc(p)+'</div></div><div class=\"chips\">'+classChip(sd)+'<span class=\"chip\">第二方向 '+esc(r.second_pick||'—')+'</span><span class=\"chip\">信心 '+esc(r.confidence)+'</span><span class=\"chip\">风险 '+esc(r.risk)+'</span>'+(picks?'<span class=\"chip\">双选 '+esc(picks)+'</span>':'')+(r.handicap_pick?'<span class=\"chip\">让球 '+esc(r.handicap_pick)+'</span>':'')+'</div></div>'}")
          # Remove model explanation tab and technical about page.
          import re
          s=re.sub(r"function aboutView\(\)\{.*?\}\nfunction render\(\)","function render()",s,flags=re.S)
          s=s.replace("const body=TAB==='history'?historyView():TAB==='about'?aboutView():liveView();","const body=TAB==='history'?historyView():liveView();")
          s=s.replace("<button class=\"'+(TAB==='about'?'on':'')+'\" onclick=\"TAB=\\'about\\';render()\">模型说明</button>","")
          s=s.replace("豪竞3.2客户专属版 · '+esc(BUILD)+'<br>'+esc(DATA.disclaimer||'历史表现不代表未来结果。')","豪竞3.2客户专属版<br>仅作体育赛事分析参考，历史回溯不代表未来结果。")
          s=s.replace("赛前数据模型 · 实时同步 · 历史可复盘","赛前赛事分析 · 实时同步 · 历史回溯")
          p.write_text(s,encoding='utf-8')
          assert '模型说明</button>' not in s
          assert 'Native PASS' not in s
          assert 'revision_tag' not in s.split('function liveView()',1)[1].split('function historyView()',1)[0]
          assert '客户不会看到什么' not in s
          PY
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('customer-hj32.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/customer.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/customer.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-hj32.html
          git diff --cached --quiet || git commit -m "simplify hj32 customer dashboard"
          git push
