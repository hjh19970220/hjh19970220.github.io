name: frontend-display-v31

on:
  push:
    paths:
      - ".github/workflows/frontend-display-v31.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Patch frontend labels and build
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ("2026-09-10 豪竞2.5单双选前端v30", "2026-09-11 豪竞2.7前端v31"),
              ("🔀 豪竞2.5 单双选", "🔀 豪竞2.7 单双选"),
              ("竞彩胜平负竞彩赔率", "竞彩HAD胜平负SP"),
              ("竞彩H胜平负竞彩赔率", "竞彩HHAD让球胜平负SP"),
          ]

          for name in ["index.html", "latest.html", "live.html"]:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")

          Path("version.json").write_text(
              '{"build":"2026-09-11 豪竞2.7前端v31","updated_at":"2026-09-11"}\n',
              encoding="utf-8",
          )
          PY
      - name: Commit frontend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html latest.html live.html version.json
          if ! git diff --cached --quiet; then
            git commit -m "fix frontend display audit labels and v2.7 build"
            git push
          fi
