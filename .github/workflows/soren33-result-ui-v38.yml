name: soren33-result-ui-v38

on:
  push:
    paths:
      - ".github/workflows/soren33-result-ui-v38.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Patch frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/soren33_frontend_patch.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace('out, n = re.subn(pattern, repl, text, count=1, flags=flags)','out, n = re.subn(pattern, lambda m: repl, text, count=1, flags=flags)')
          p.write_text(t,encoding='utf-8')
          PY
          python tools/soren33_frontend_patch.py
      - name: Syntax-check embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for f in ['index.html', 'hj33.html']:
              t = Path(f).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:[^>]*)>(.*?)</script>', t, re.S)
              if not scripts:
                  raise SystemExit(f'no script in {f}')
              Path('/tmp/' + f + '.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/hj33.html.js
      - name: Commit frontend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html hj33.html version.json
          if ! git diff --cached --quiet; then
            git commit -m "fix frontend: score doubles and exact scores as hits"
            git push
          fi
