name: 豪竞2.5 Dual-Light UI v27

on:
  push:
    paths:
      - '.github/workflows/hj25-dual-light-ui-v27.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dual-light UI
        run: python scripts/patch_hj_dual_light_v27.py
      - name: Check inline JavaScript
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf-8'); a=s.index('<script>')+8; b=s.rindex('</script>'); Path('/tmp/app.js').write_text(s[a:b],encoding='utf-8')"
          node --check /tmp/app.js
      - name: Verify dual-light UI
        run: |
          grep -q "豪竞2.5双灯重构v27" index.html
          grep -q "hjDualDirectionBadge" index.html
          grep -q "B档价值" index.html
          grep -q "DTR / DLR / GPT / 情报 / 让球 = 提示层" index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "Refactor 豪竞2.5 UI to dual-light v27"
          git push
