name: Patch HJ Chinese v15
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 patch_hj_cn_v15.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "fix: 豪竞爆冷诊断全中文展示 v15 [skip ci]"
          git push
      - name: Cleanup one-shot files
        run: |
          git pull --rebase
          git rm .github/workflows/patch-hj-upset-cn-v15.yml patch_hj_cn_v15.py
          git commit -m "chore: remove v15 one-shot patch files [skip ci]"
          git push
