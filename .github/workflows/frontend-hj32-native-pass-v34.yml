name: frontend-hj32-native-pass-v34

on:
  push:
    paths:
      - ".github/workflows/frontend-hj32-native-pass-v34.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Patch HJ3.2 Native PASS frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          NEW_BUILD = "2026-09-13 豪竞3.2前端v34-native-pass"
          files = ["index.html", "latest.html", "live.html"]

          def sub_once(text, pattern, replacement, label, required=False, flags=re.S):
              out, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if required and n != 1:
                  raise AssertionError(f"{label}: expected 1 replacement, got {n}")
              return out, n

          changed = []
          for name in files:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding="utf-8")
              before = text

              # Build/version: current active frontend is data-driven; only cache build is hardcoded.
              text = re.sub(r"const APP_BUILD='[^']+';", f"const APP_BUILD='{NEW_BUILD}';", text, count=1)

              # Current model label in the single/double detail panel.
              text = text.replace("🔀 豪竞2.7 单双选", "🔀 豪竞3.2 单双 / Native PASS")
              text = text.replace("有把握单选 · 有可信第二方向双选 · 不可靠则PASS", "3.2先判断方向 · 红灯禁裸单不自动PASS · DQ-C降级不自动PASS · 仅硬条件才PASS")

              # Native PASS-aware final execution badge. Legacy dual-light PASS is no longer the last word for HJ3.2.
              action_pat = r"function hjDualActionBadge\(r\)\{.*?\n\}\nfunction hjSingleDoubleData"
              action_new = """function hjDualActionBadge(r){
 const sd=hjSingleDoubleData(r),c=String(sd.class_code||'').toUpperCase(),native=String(sd.status||'').includes('HJ32_NATIVE_PASS');
 if(native&&c==='STRONG_DOUBLE')return '🟣 强双保护';
 if(native&&c==='CANDIDATE_DOUBLE')return '🟠 候选双·禁裸单';
 if(native&&c==='PASS')return '⚪ 硬PASS';
 const a=String(hjDualData(r).action_tier||'').toUpperCase();
 const m={PRIORITY:'⭐ 优先出手',DIRECTION:'🟢 方向可打',DIRECTION_NO_HAD:'🟢 方向强·普通胜平负暂不可执行',VALUE_B:'💰 B档价值',WATCH:'🟡 观察',PASS:'🔴 旧执行PASS',PASS_UNAVAILABLE:'⚪ 不可用'};
 return m[a]||'⚪ 出手未确认';
}
function hjSingleDoubleData"""
              text, _ = sub_once(text, action_pat, action_new, f"{name} action badge", required=(name=="index.html"))

              # Add native/legacy helpers once.
              marker = "function hjSingleDoubleData(r){return r?.source_status?.single_double_v01||{}}"
              if marker in text and "function hj32NativePassData" not in text:
                  helpers = marker + "\n" + """function hj32NativePassData(r){return r?.source_status?.hj32_native_pass_v01||{}}
function hj32LegacyPassData(r){return r?.source_status?.hj32_legacy_pass_shadow_v01||{}}
function hj32NativePassActive(r){const x=hj32NativePassData(r),sd=hjSingleDoubleData(r);return String(x.status||'')==='ACTIVE_FORMAL_RUNTIME'||String(sd.status||'').includes('HJ32_NATIVE_PASS')||sd.native_pass_v01===true}
function hj32LegacyPassText(r){const x=hj32LegacyPassData(r);if(x.legacy_would_pass===true)return '旧机制会PASS · 仅影子，不再一票否决';if(String(x.status||'').includes('SHADOW'))return '旧机制未触发硬PASS · 仅影子';return '旧冻结未记录Native PASS影子'}"""
                  text = text.replace(marker, helpers, 1)

              # Single/double labels: distinguish current hard PASS from historical PASS.
              badge_pat = r"function hjSingleDoubleBadge\(r\)\{.*?\n\}"
              badge_new = """function hjSingleDoubleBadge(r){
 const x=hjSingleDoubleData(r),c=String(x.class_code||'').toUpperCase(),native=hj32NativePassActive(r);
 if(c==='SINGLE')return '🟢 单选';
 if(c==='STRONG_DOUBLE')return '🟣 强双';
 if(c==='CANDIDATE_DOUBLE')return native?'🟠 候选双·禁裸单':'🟠 候选双';
 if(c==='PASS')return native?'⚪ 硬PASS':'⚪ PASS（旧冻结）';
 return '⚪ 待新运行';
}"""
              text, _ = sub_once(text, badge_pat, badge_new, f"{name} SD badge", required=(name=="index.html"))

              picks_pat = r"function hjSingleDoublePicks\(r\)\{.*?\n\}"
              picks_new = """function hjSingleDoublePicks(r){
 const x=hjSingleDoubleData(r),ps=Array.isArray(x.picks)?x.picks.filter(Boolean):[];
 if(ps.length)return ps.join(' + ');
 return String(x.class_code||'').toUpperCase()==='PASS'?(hj32NativePassActive(r)?'硬PASS':'PASS'):'未确认';
}"""
              text, _ = sub_once(text, picks_pat, picks_new, f"{name} SD picks", required=(name=="index.html"))

              # Full detail panel: show Native PASS policy and legacy shadow separately.
              detail_pat = r"function hjSingleDoubleDetailSection\(r\)\{.*?\n\}\nfunction hjFinalLeg"
              detail_new = """function hjSingleDoubleDetailSection(r){
 const x=hjSingleDoubleData(r),c=String(x.class_code||'').toUpperCase();
 if(!c)return '';
 const np=hj32NativePassData(r),native=hj32NativePassActive(r),top1Changed=(x.top1_core_unchanged===true||x.top1_unchanged===true)?'否':'未确认',probChanged=x.probability_unchanged===true?'否':'未确认';
 const nativeState=native?'✅ Native PASS已生效':'🧊 旧冻结口径';
 const redPolicy=native?'红灯=禁止裸单；优先保留Top1+可信第二方向，不自动PASS':'按该场冻结时的旧规则解释';
 const dqPolicy=native?'DQ-C=降执行等级/禁裸单，不自动PASS；DQ-D才是数据硬PASS':'按该场冻结时的旧规则解释';
 return '<section class="section"><div class="shead"><h2>🔀 豪竞3.2 单双 / Native PASS</h2><span>3.2先完成判断 · PASS只做最后刹车</span></div><div class="cards"><div class="card feature"><div class="kv"><div>单双类型</div><div><b>'+esc(hjSingleDoubleBadge(r))+'</b></div><div>执行方向</div><div><b>'+esc(hjSingleDoublePicks(r))+'</b></div><div>动作</div><div>'+esc(x.action||'—')+'</div><div>Native状态</div><div>'+esc(nativeState)+'</div><div>判定理由</div><div>'+esc(x.reason||np.reason||'—')+'</div></div></div><div class="card"><div class="kv"><div>正式Top1</div><div>'+esc(r.top1||'未确认')+'</div><div>第二方向</div><div>'+esc(r.second_pick||'—')+'</div><div>红灯现在代表</div><div>'+esc(redPolicy)+'</div><div>DQ-C现在代表</div><div>'+esc(dqPolicy)+'</div><div>Legacy PASS</div><div>'+esc(hj32LegacyPassText(r))+'</div><div>是否改Top1</div><div>'+esc(top1Changed)+'</div><div>是否改概率</div><div>'+esc(probChanged)+'</div></div></div></div></section>';
}
function hjFinalLeg"""
              text, _ = sub_once(text, detail_pat, detail_new, f"{name} SD detail", required=(name=="index.html"))

              # Quick decision text: old red-light/PASS may remain visible as risk evidence but must not override Native PASS.
              old_decision = " if(a==='PASS'||dir==='RED')return '方向本身偏弱：PASS；即使赔率有价值也不复活。';"
              new_decision = """ const sdClass=String(hjSingleDoubleData(r).class_code||'').toUpperCase(),sdNative=hj32NativePassActive(r);
 if(sdNative&&sdClass==='STRONG_DOUBLE')return '豪竞3.2强双保护：风险存在，但不PASS；按双向保护处理。';
 if(sdNative&&sdClass==='CANDIDATE_DOUBLE')return '豪竞3.2 Native PASS：禁止裸单，保留Top1 + 第二方向观察；旧红灯不再一票否决。';
 if(sdNative&&sdClass==='PASS')return '豪竞3.2硬PASS：当前无法形成可靠可执行结构。';
 if(a==='PASS'||dir==='RED')return '旧方向红灯/旧PASS仅作风险提示；是否硬PASS以3.2 Native PASS为准。';"""
              if old_decision in text:
                  text = text.replace(old_decision, new_decision, 1)

              # Top-of-page policy notice, with explicit distinction between active revision and current frozen run.
              render_old = "function renderHaojing(){return modelHeader()+plays()+rowsTable('hj')+sourceStatusSection()}"
              if render_old in text:
                  notice = """function hj32NativePassNotice(){const a=activeByRole('hj'),run=DATA?.hj?.run,tag=String(a?.revision_tag||''),on=tag.includes('native-pass'),cur=!!(on&&run&&Number(run.model_revision_id)===Number(a.id));if(!on)return '';const state=cur?'当前冻结盘已按Native PASS运行':'当前active已升级，等待下一次新赛前冻结正式落地';return '<div class="notice good"><b>🛡️ 豪竞3.2 Native PASS：</b> '+esc(state)+'。红灯不再自动PASS，先禁裸单并寻找第二方向；DQ-C降级但不自动删除模型观点；DQ-D / Top1缺失 / 非法赛前冻结 / 正式硬冲突才允许硬PASS。<br><span class="tiny">注意：A/B/C、Anchor和具体玩法仍有独立执行闸门，它们可以PASS，但不会反向抹掉全池Top1判断。</span></div>'}
function renderHaojing(){return modelHeader()+hj32NativePassNotice()+plays()+rowsTable('hj')+sourceStatusSection()}"""
                  text = text.replace(render_old, notice, 1)

              # Historical metrics must be labelled historical so they are not confused with the new policy.
              text = text.replace("metric('PASS隔离'", "metric('历史PASS隔离'")
              text = text.replace("metric('PASS误杀'", "metric('历史PASS误杀'")

              if text != before:
                  p.write_text(text, encoding="utf-8")
                  changed.append(name)

          idx = Path("index.html").read_text(encoding="utf-8")
          assert NEW_BUILD in idx, "index build not updated"
          assert "豪竞3.2 单双 / Native PASS" in idx, "HJ3.2 detail title missing"
          assert "function hj32NativePassData" in idx, "Native PASS helper missing"
          assert "候选双·禁裸单" in idx, "Native candidate-double badge missing"
          assert "旧方向红灯/旧PASS仅作风险提示" in idx, "legacy PASS quick-text override missing"
          assert "function hj32NativePassNotice" in idx, "Native PASS notice missing"

          Path("version.json").write_text(
              json.dumps({"build":NEW_BUILD,"updated_at":"2026-09-13"}, ensure_ascii=False, separators=(",",":")) + "\n",
              encoding="utf-8",
          )
          print("patched:", changed)
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','latest.html','live.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if '<script>' not in s or '</script>' not in s: continue
              js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
              Path('/tmp/'+name+'.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index.html.js
      - name: Verify HJ3.2 frontend contract
        run: |
          grep -q "豪竞3.2 单双 / Native PASS" index.html
          grep -q "候选双·禁裸单" index.html
          grep -q "DQ-C=降执行等级" index.html
          grep -q "旧方向红灯/旧PASS仅作风险提示" index.html
          grep -q "2026-09-13 豪竞3.2前端v34-native-pass" index.html
      - name: Commit deployed UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html latest.html live.html version.json
          git diff --cached --quiet || git commit -m "sync frontend with HJ3.2 Native PASS"
          git push
