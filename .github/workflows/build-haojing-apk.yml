name: Build HaoJing APK

on:
  push:
    branches: [haojing-android]
    paths:
      - '.github/workflows/build-haojing-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          rm -rf haojing-apk
          mkdir -p haojing-apk/app/src/main/java/com/haojing/picks
          mkdir -p haojing-apk/app/src/main/res/values

          cat > haojing-apk/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='HaoJingPicks'
          include ':app'
          EOF

          cat > haojing-apk/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF

          cat > haojing-apk/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.haojing.picks'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.haojing.picks'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '1.1.0'
              }
          }
          EOF

          cat > haojing-apk/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@style/AppTheme" android:label="豪竞精选" android:usesCleartextTraffic="false" android:allowBackup="true">
                  <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > haojing-apk/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#111827</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
                  <item name="android:colorAccent">#D79B00</item>
              </style>
          </resources>
          EOF

          cat > haojing-apk/app/src/main/java/com/haojing/picks/MainActivity.java <<'EOF'
          package com.haojing.picks;

          import android.app.*;
          import android.os.*;
          import android.graphics.*;
          import android.graphics.Typeface;
          import android.view.*;
          import android.widget.*;
          import android.graphics.drawable.GradientDrawable;
          import org.json.*;
          import java.io.*;
          import java.net.*;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              static final String BASE="https://tqlibowvnwfkaseqqvvp.supabase.co/rest/v1/";
              static final String KEY="sb_publishable_FVHoVk1pL1gNtu65-cZ0JQ_lOllpCSs";
              int dark=Color.rgb(17,24,39), muted=Color.rgb(107,114,128), bg=Color.rgb(246,247,249), gold=Color.rgb(215,155,0);
              int success=Color.rgb(220,38,38), fail=Color.rgb(107,114,128), pending=Color.rgb(37,99,235);
              LinearLayout content, dateBar;
              JSONArray fullData=new JSONArray(), pickData=new JSONArray();
              String selectedDate=null, tab="full";
              Handler handler=new Handler(Looper.getMainLooper());
              Runnable autoRefresh=()->{ if(tab.equals("full")||tab.equals("picks")) loadRemote(false); };

              @Override public void onCreate(Bundle b){ super.onCreate(b); showFull(); loadRemote(true); }
              @Override protected void onResume(){ super.onResume(); handler.postDelayed(autoRefresh,300000); }
              @Override protected void onPause(){ super.onPause(); handler.removeCallbacks(autoRefresh); }

              int dp(int x){return (int)(x*getResources().getDisplayMetrics().density+0.5f);}
              TextView tv(String s,int sp,int color,boolean bold){ TextView v=new TextView(this); v.setText(s);v.setTextSize(sp);v.setTextColor(color);if(bold)v.setTypeface(Typeface.DEFAULT,Typeface.BOLD);v.setPadding(dp(4),dp(4),dp(4),dp(4));return v; }
              GradientDrawable box(int color,int radius){GradientDrawable g=new GradientDrawable();g.setColor(color);g.setCornerRadius(dp(radius));return g;}

              void base(String title,String subtitle){
                  LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(bg);
                  LinearLayout head=new LinearLayout(this);head.setOrientation(LinearLayout.VERTICAL);head.setPadding(dp(16),dp(14),dp(16),dp(10));head.setBackgroundColor(dark);
                  LinearLayout row=new LinearLayout(this);row.setGravity(Gravity.CENTER_VERTICAL);
                  TextView t=tv(title,25,Color.WHITE,true);row.addView(t,new LinearLayout.LayoutParams(0,-2,1));
                  TextView refresh=tv("刷新",14,Color.WHITE,true);refresh.setGravity(Gravity.CENTER);refresh.setBackground(box(Color.rgb(55,65,81),12));refresh.setPadding(dp(12),dp(7),dp(12),dp(7));refresh.setOnClickListener(v->loadRemote(true));row.addView(refresh);
                  head.addView(row);head.addView(tv(subtitle,13,Color.rgb(209,213,219),false));root.addView(head);
                  HorizontalScrollView hsv=new HorizontalScrollView(this);hsv.setHorizontalScrollBarEnabled(false);dateBar=new LinearLayout(this);dateBar.setPadding(dp(8),dp(7),dp(8),dp(5));hsv.addView(dateBar);root.addView(hsv);
                  ScrollView sv=new ScrollView(this);content=new LinearLayout(this);content.setOrientation(LinearLayout.VERTICAL);content.setPadding(0,dp(4),0,dp(18));sv.addView(content);root.addView(sv,new LinearLayout.LayoutParams(-1,0,1));root.addView(nav());setContentView(root);
              }

              LinearLayout nav(){
                  LinearLayout n=new LinearLayout(this);n.setGravity(Gravity.CENTER);n.setPadding(dp(4),dp(6),dp(4),dp(8));n.setBackgroundColor(Color.WHITE);
                  String[][] items={{"全池","full"},{"精选","picks"},{"战绩","record"},{"说明","about"}};
                  for(String[] it:items){TextView b=tv(it[0],14,it[1].equals(tab)?gold:dark,true);b.setGravity(Gravity.CENTER);b.setBackground(box(Color.rgb(248,250,252),11));LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,dp(44),1);lp.setMargins(dp(3),0,dp(3),0);b.setLayoutParams(lp);b.setOnClickListener(v->{tab=it[1];if(tab.equals("full"))showFull();else if(tab.equals("picks"))showPicks();else if(tab.equals("record"))showRecord();else showAbout();});n.addView(b);}return n;
              }

              void showFull(){tab="full";base("豪竞全池评测","主队不败 / 客队不败 · 自动同步 · 赛后自动结算");renderDates();renderFull();}
              void showPicks(){tab="picks";base("豪竞精选","主胜 / 平 / 客胜 / 让胜 / 让平 / 让负");renderDates();renderPicks();if(pickData.length()==0)loadRemote(true);}

              void renderDates(){
                  if(dateBar==null)return;dateBar.removeAllViews();LinkedHashSet<String> ds=new LinkedHashSet<>();JSONArray a=tab.equals("picks")?pickData:fullData;
                  for(int i=0;i<a.length();i++){String d=a.optJSONObject(i).optString("publish_date","");if(!d.isEmpty())ds.add(d);}if(selectedDate==null&&!ds.isEmpty())selectedDate=ds.iterator().next();
                  for(String d:ds){TextView b=tv(d.substring(5).replace("-","/"),14,d.equals(selectedDate)?Color.WHITE:dark,true);b.setGravity(Gravity.CENTER);b.setBackground(box(d.equals(selectedDate)?gold:Color.WHITE,12));LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(dp(68),dp(38));lp.setMargins(dp(4),0,dp(4),0);b.setLayoutParams(lp);b.setOnClickListener(v->{selectedDate=d;renderDates();if(tab.equals("full"))renderFull();else renderPicks();});dateBar.addView(b);}
              }

              void renderFull(){
                  if(content==null)return;content.removeAllViews();if(fullData.length()==0){loading("正在同步全池评测…");return;}
                  int total=0,hits=0,miss=0,pend=0;for(int i=0;i<fullData.length();i++){JSONObject o=fullData.optJSONObject(i);if(selectedDate!=null&&!selectedDate.equals(o.optString("publish_date")))continue;total++;String s=o.optString("eval_status");if(s.equals("评测成功"))hits++;else if(s.equals("评测失败"))miss++;else pend++;}
                  int settled=hits+miss;double rate=settled==0?0:100.0*hits/settled;
                  LinearLayout sum=panel();sum.addView(tv("全池评测  "+hits+"中 / "+settled+"场",19,dark,true));sum.addView(tv(settled>0?String.format(Locale.CHINA,"命中率 %.2f%% · 待赛 %d",rate,pend):"当前场次尚未结算",14,muted,false));content.addView(sum);
                  for(int i=0;i<fullData.length();i++){JSONObject o=fullData.optJSONObject(i);if(selectedDate!=null&&!selectedDate.equals(o.optString("publish_date")))continue;content.addView(fullCard(o));}
              }

              LinearLayout panel(){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(16),dp(12),dp(16),dp(12));c.setBackground(box(Color.WHITE,15));LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,-2);lp.setMargins(dp(12),dp(7),dp(12),dp(7));c.setLayoutParams(lp);return c;}

              LinearLayout fullCard(JSONObject o){
                  LinearLayout c=panel();LinearLayout top=new LinearLayout(this);top.setGravity(Gravity.CENTER_VERTICAL);
                  String no=o.optString("match_no","");String lg=o.optString("league","");top.addView(tv(lg+"  "+no,13,muted,true),new LinearLayout.LayoutParams(0,-2,1));
                  String st=o.optString("eval_status","待赛");int col=st.equals("评测成功")?success:st.equals("评测失败")?fail:pending;top.addView(tv(st.equals("评测成功")?"● 评测成功":st.equals("评测失败")?"● 评测失败":"● 待赛",14,col,true));c.addView(top);
                  c.addView(tv(o.optString("home_team")+"  vs  "+o.optString("away_team"),18,dark,true));
                  c.addView(tv(o.optString("unbeaten_pick"),20,gold,true));
                  String r=o.optString("result_text","");if(!r.isEmpty())c.addView(tv("赛果："+r,13,muted,false));
                  c.setOnClickListener(v->detail(o));return c;
              }

              void detail(JSONObject o){
                  String msg="评测方向："+o.optString("unbeaten_pick")+"\n覆盖结果："+o.optString("cover_text")+"\n\n"+o.optString("home_team")+" vs "+o.optString("away_team")+"\n"+(o.optString("result_text","").isEmpty()?"赛果：待赛":"赛果："+o.optString("result_text"))+"\n\n结算："+o.optString("eval_status")+"\n来源："+o.optString("source_kind");
                  new AlertDialog.Builder(this).setTitle("豪竞全池评测").setMessage(msg).setPositiveButton("确定",null).show();
              }

              void renderPicks(){
                  if(content==null)return;content.removeAllViews();if(pickData.length()==0){loading("正在同步精选推荐…");return;}
                  int shown=0;for(int i=0;i<pickData.length();i++){JSONObject o=pickData.optJSONObject(i);if(selectedDate!=null&&!selectedDate.equals(o.optString("publish_date")))continue;shown++;LinearLayout c=panel();c.addView(tv(o.optString("category","精选单场"),13,gold,true));c.addView(tv(o.optString("home_team")+"  vs  "+o.optString("away_team"),18,dark,true));c.addView(tv(o.optString("selected_pick"),21,gold,true));String sp=o.optString("selected_price","");String status=o.optString("settle_status","待赛");c.addView(tv((sp.isEmpty()?"":"参考SP "+sp+" · ")+status,13,muted,false));content.addView(c);}if(shown==0)loading("该日期暂无正式精选");
              }

              void showRecord(){
                  tab="record";base("历史战绩","全池不败评测与付费精选分开统计");dateBar.removeAllViews();int hits=0,miss=0;for(int i=0;i<fullData.length();i++){String s=fullData.optJSONObject(i).optString("eval_status");if(s.equals("评测成功"))hits++;else if(s.equals("评测失败"))miss++;}int settled=hits+miss;LinearLayout c=panel();c.addView(tv("全池不败评测",18,dark,true));c.addView(tv(hits+"中 / "+settled+"场",25,gold,true));c.addView(tv(settled==0?"暂无已结算场次":String.format(Locale.CHINA,"累计命中率 %.2f%%",100.0*hits/settled),14,muted,false));content.addView(c);TextView note=tv("口径固定：主队不败 = 主胜 + 平；客队不败 = 平 + 客胜。命中任一覆盖结果即评测成功。历史错单保留，不删除。",14,muted,false);note.setPadding(dp(18),dp(10),dp(18),dp(10));content.addView(note);
              }

              void showAbout(){tab="about";base("说明","豪竞精选 Android 客户端 v1.1");dateBar.removeAllViews();TextView a=tv("全池评测：每场统一输出主队不败或客队不败。\n\n主队不败 = 主胜 + 平；客队不败 = 平 + 客胜。赛后自动结算评测成功/失败。\n\n精选推荐：单独输出主胜、平、客胜、让胜、让平、让负。\n\n应用打开时自动同步，运行期间每5分钟检查一次最新数据。无需因为每日数据变化重新安装APK。\n\n不推比分，不承诺比赛结果或收益。",15,dark,false);a.setPadding(dp(18),dp(18),dp(18),dp(18));content.addView(a);}

              void loading(String s){TextView x=tv(s,15,muted,false);x.setPadding(dp(18),dp(20),dp(18),dp(20));content.addView(x);}

              void loadRemote(boolean toast){
                  new Thread(()->{
                      try{
                          JSONArray f=get("hao_fullpool_unbeaten_feed_v01?select=publish_date,match_no,league,home_team,away_team,kickoff_bjt,unbeaten_pick,cover_text,eval_status,result_text,source_kind&order=publish_date.desc,match_no.asc&limit=500");
                          JSONArray p=get("hao_customer_feed_v01?select=publish_date,match_no,league,home_team,away_team,category,selected_pick,selected_price,settle_status,result_text&order=publish_date.desc,recommendation_rank.asc&limit=200");
                          runOnUiThread(()->{fullData=f;pickData=p;if(selectedDate==null&&f.length()>0)selectedDate=f.optJSONObject(0).optString("publish_date");renderDates();if(tab.equals("full"))renderFull();else if(tab.equals("picks"))renderPicks();else if(tab.equals("record"))showRecord();if(toast)Toast.makeText(this,"同步完成",Toast.LENGTH_SHORT).show();});
                      }catch(Exception e){runOnUiThread(()->{if(toast)Toast.makeText(this,"同步失败："+e.getMessage(),Toast.LENGTH_LONG).show();});}
                  }).start();
                  handler.removeCallbacks(autoRefresh);handler.postDelayed(autoRefresh,300000);
              }

              JSONArray get(String path) throws Exception{
                  HttpURLConnection c=(HttpURLConnection)new URL(BASE+path).openConnection();c.setRequestMethod("GET");c.setConnectTimeout(12000);c.setReadTimeout(12000);c.setRequestProperty("apikey",KEY);c.setRequestProperty("Authorization","Bearer "+KEY);c.setRequestProperty("Accept","application/json");int code=c.getResponseCode();InputStream in=code>=200&&code<300?c.getInputStream():c.getErrorStream();ByteArrayOutputStream out=new ByteArrayOutputStream();byte[] buf=new byte[4096];int n;while((n=in.read(buf))>0)out.write(buf,0,n);String s=out.toString(StandardCharsets.UTF_8.name());if(code<200||code>=300)throw new IOException("HTTP "+code);return new JSONArray(s);
              }
          }
          EOF

      - name: Build debug APK
        working-directory: haojing-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp haojing-apk/app/build/outputs/apk/debug/app-debug.apk HaoJing-JingXuan-v1.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HaoJing-JingXuan-v1.1-APK
          path: HaoJing-JingXuan-v1.1.apk
          retention-days: 30
