name: Patch R9 Ticket Hard64 v13

on:
  push:
    paths:
      - '.github/workflows/patch-r9-ticket-hard64-v13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch R9 formal ticket display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_build = "const APP_BUILD='2026-09-05 豪篮累计命中率v12';"
          new_build = "const APP_BUILD='2026-09-05 任9票面硬闸门v13';"
          if old_build not in s:
              raise SystemExit('APP_BUILD anchor not found')
          s = s.replace(old_build, new_build, 1)

          old_calc = " const formalCost=Number(s.cost_rmb||0),formalCombos=Number(s.combination_count||0); const ready=run.formal_allowed===true&&s.ticket_status==='READY'&&ticketNos.length===9&&formalCost>0&&formalCost<=64&&formalCombos>0&&formalCombos<=32;"
          new_calc = " const formalCost=Number(s.cost_rmb||0),candidateCombos=Number(s.combination_count||0); const ready=run.formal_allowed===true&&s.ticket_status==='READY'&&ticketNos.length===9&&formalCost>0&&formalCost<=64&&candidateCombos>0&&candidateCombos<=32; const candidateOverBudget=!ready&&candidateCombos>32; const candidateAuditCost=candidateOverBudget?candidateCombos*2:null;"
          if old_calc not in s:
              raise SystemExit('hcSummary calc anchor not found')
          s = s.replace(old_calc, new_calc, 1)

          old_metrics = " '<div class=\"grid4\" style=\"padding:12px\">'+metric('票面状态',hcTicketStatusZh(ready?'READY':'PASS'),ready?'最强信心方案已形成':'当前未通过信心/方向闸门',ready?'good':'warn')+metric('留9 / 舍5',retained.length+' / '+discarded.length,'舍：'+esc(discarded.join('、')))+metric('结构',Object.keys(singles).length+'单 + '+Object.keys(doubles).length+'双 + '+Object.keys(triples).length+'三',(s.combination_count||'—')+'注')+metric('参考注数/金额',(s.combination_count||'—')+'注 / '+(s.cost_rmb!=null?s.cost_rmb:'—')+'元','仅展示，不参与选场或单双三','good')+'</div>'+"
          new_metrics = " '<div class=\"grid4\" style=\"padding:12px\">'+metric('票面状态',hcTicketStatusZh(ready?'READY':'PASS'),ready?'最强信心方案已形成':'当前未通过正式出票闸门',ready?'good':'warn')+metric('留9 / 舍5',retained.length+' / '+discarded.length,'舍：'+esc(discarded.join('、')))+metric('正式票面',ready?(candidateCombos+'注 / '+formalCost+'元'):'PASS / 未出票',ready?'≤32注 / 64元，允许出票':'硬上限32注 / 64元；正式金额0元',ready?'good':'warn')+metric(ready?'正式结构':'候选全覆盖（审计）',Object.keys(singles).length+'单 + '+Object.keys(doubles).length+'双 + '+Object.keys(triples).length+'三',ready?(candidateCombos+'注 / '+formalCost+'元'):(candidateCombos?(candidateCombos+'注 / '+(candidateAuditCost!=null?candidateAuditCost:'—')+'元'):'—'),ready?'good':candidateOverBudget?'bad':'warn')+'</div>'+"
          if old_metrics not in s:
              raise SystemExit('hcSummary metrics anchor not found')
          s = s.replace(old_metrics, new_metrics, 1)

          old_pass = " (ready?'<div class=\"notice good\" style=\"margin:12px\"><b>✅ 最终下注方案：</b> '+ticketNos.map(no=>String(no).padStart(2,'0')+'='+ticket[no]).join('　')+'</div>':'<div class=\"notice warn\" style=\"margin:12px\">⚠️ 当前没有通过完整出票闸门，不生成正式下注方案。正式金额：未出票（硬上限64元 / 32注）。</div>')+"
          new_pass = " (ready?'<div class=\"notice good\" style=\"margin:12px\"><b>✅ 最终下注方案：</b> '+ticketNos.map(no=>String(no).padStart(2,'0')+'='+ticket[no]).join('　')+'</div>':'<div class=\"notice warn\" style=\"margin:12px\"><b>⚠️ 正式票：PASS / 未出票。</b> 硬上限64元 / 32注。'+(candidateOverBudget?' 当前'+candidateCombos+'注 / '+candidateAuditCost+'元仅为候选全覆盖审计值，禁止按此出票。':' 当前没有通过完整出票闸门，不生成正式下注方案。')+'</div>')+"
          if old_pass not in s:
              raise SystemExit('hcSummary pass anchor not found')
          s = s.replace(old_pass, new_pass, 1)

          p.write_text(s, encoding='utf-8')
          Path('version.json').write_text(json.dumps({
              'build': '2026-09-05 任9票面硬闸门v13',
              'updated_at': '2026-09-05'
          }, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git rm .github/workflows/patch-r9-ticket-hard64-v13.yml
          git commit -m 'fix: separate R9 formal ticket from candidate audit [skip ci]'
          git push
