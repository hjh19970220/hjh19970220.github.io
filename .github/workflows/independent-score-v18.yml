name: Independent score frontend v18
on:
  push:
    paths:
      - '.github/workflows/independent-score-v18.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: python3 .github/scripts/patch_independent_score_v18.py
      - name: JavaScript syntax check
        run: |
          python3 -c "from pathlib import Path; s=Path('index.html').read_text(); a=s.index('<script>')+len('<script>'); b=s.rindex('</script>'); Path('/tmp/app.js').write_text(s[a:b])"
          node --check /tmp/app.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'feat: show independent score shadow in Chinese v18'
          git push
      - name: Remove one-shot patch files
        run: |
          git rm .github/workflows/independent-score-v18.yml .github/scripts/patch_independent_score_v18.py
          git commit -m 'chore: remove independent score v18 patch files [skip ci]'
          git push
