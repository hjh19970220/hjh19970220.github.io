name: Site smoke check

on:
  push:
    paths:
      - 'index.html'
      - 'version.json'
      - '.github/workflows/site-smoke-check.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          if '<script>' not in s or '</script>' not in s:
              raise SystemExit('script block missing')
          js = s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/site.js').write_text(js, encoding='utf-8')
          PY
          node --check /tmp/site.js
      - name: Check version metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert j.get('build'), 'missing build'
          print(j['build'])
          PY
