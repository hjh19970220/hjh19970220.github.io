name: Site smoke check

on:
  push:
    paths:
      - 'index.html'
      - 'assets/app-20261003.js'
      - 'version.json'
      - '.github/workflows/site-smoke-check.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site JavaScript syntax
        run: |
          test -f assets/app-20261003.js
          node --check assets/app-20261003.js
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert 'assets/app-20261003.js' in s, 'site script reference missing'
          print('External website JavaScript syntax verified')
          PY
      - name: Check version metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('version.json').read_text(encoding='utf-8'))
          assert j.get('build'), 'missing build'
          print(j['build'])
          PY
