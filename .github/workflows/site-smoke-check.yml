name: Site smoke check
on:
  push:
    paths:
      - 'index.html'
      - 'client-v1.html'
      - 'assets/soren/**'
      - 'tests/soren-*'
      - 'package*.json'
      - 'version.json'
      - '.github/workflows/site-smoke-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Check version and client assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('version.json').read_text())
          assert j.get('build'), 'missing build'
          page=Path('client-v1.html').read_text()
          for path in ['assets/soren/style.css','assets/soren/data.js','assets/soren/auth.js','assets/soren/app.js']:
              assert path in page and Path(path).is_file()
          print('Customer assets verified')
          PY
