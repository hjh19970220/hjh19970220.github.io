name: fix-customer-hj32-daily-rate
on:
  push:
    paths:
      - ".github/workflows/fix-customer-hj32-daily-rate.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fix daily rate display
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('customer-hj32.html')
          s=p.read_text(encoding='utf-8')
          old="const pct=v=>v==null?'—':Number(v).toFixed(2)+'%';"
          new=old+"\nconst dayRate=x=>x&&Number(x.scored)?Number(x.hits)*100/Number(x.scored):null;"
          assert old in s
          s=s.replace(old,new,1)
          s=s.replace("Number(x.rate||0)","Number(dayRate(x)||0)")
          s=s.replace("pct(x.rate)","pct(dayRate(x))")
          p.write_text(s,encoding='utf-8')
          assert "dayRate(x)" in s
          PY
      - name: Check JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('customer-hj32.html').read_text(encoding='utf-8')
          js=s.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/customer.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/customer.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add customer-hj32.html
          git diff --cached --quiet || git commit -m "fix customer daily hit-rate display"
          git push
