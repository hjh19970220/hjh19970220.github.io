name: Fix GPT review display gate

on:
  push:
    paths:
      - '.github/workflows/fix-gpt-review-display.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch GPT review display logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old1="const s=r?.source_status||{},g=s.teacher_g_had||null,st=String(s.teacher_g_source_status||''),a=String(s.teacher_post_gate_action||'NO_ACTION');"
          new1="const s=r?.source_status||{},g=s.teacher_g_had||null,st=String(s.teacher_g_source_status||''),rs=String(s.teacher_g_review_status||s.gpt_review_status||'').toUpperCase(),a=String(s.teacher_post_gate_action||'NO_ACTION');"
          old2="const reviewedStatus=['confirmed_prematch_independent_review','confirmed_prematch_review','confirmed'].includes(st);"
          new2="const reviewedStatus=(s.gpt_review_executed===true)||(s.teacher_g_prematch_verified===true&&rs==='COMPLETED_PREMATCH')||['confirmed_prematch_independent_review','confirmed_prematch_review','confirmed'].includes(st);"
          if old1 not in s or old2 not in s:
              raise SystemExit('GPT detail gate anchors not found')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          old3="const sz=st==='not_injected_server_runtime'?'⚪ 本轮未注入 · ABSTAIN':st==='confirmed_prematch_independent_review'?'✅ 已完成赛前独立二审':st==='confirmed_prematch_review'?'✅ 已完成赛前二审':st==='confirmed'?'✅ 已确认':st==='fetch_failed'?'⚠️ 获取失败 · ABSTAIN':st==='not_covered'?'⚪ 未覆盖 · ABSTAIN':(st||'⚪ 未确认');"
          new3="const sz=rs==='COMPLETED_PREMATCH'?'✅ 已完成赛前GPT-5.6 Sol二审':st==='not_injected_server_runtime'?'⚪ 本轮未注入 · ABSTAIN':st==='confirmed_prematch_independent_review'?'✅ 已完成赛前独立二审':st==='confirmed_prematch_review'?'✅ 已完成赛前二审':st==='confirmed'?'✅ 已确认':st==='fetch_failed'?'⚠️ 获取失败 · ABSTAIN':st==='not_covered'?'⚪ 未覆盖 · ABSTAIN':(st||'⚪ 未确认');"
          if old3 in s:
              s=s.replace(old3,new3,1)
          s=s.replace("const APP_BUILD='2026-09-09 豪竞2.5情报Residual展示v22';","const APP_BUILD='2026-09-09 豪竞2.5二审状态修复v23';",1)
          p.write_text(s,encoding='utf-8')
          Path('version.json').write_text(json.dumps({'build':'2026-09-09 豪竞2.5二审状态修复v23','updated_at':'2026-09-09'},ensure_ascii=False)+'\n',encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix GPT-5.6 Sol review status display'
          git push
