name: Sync active model frontend labels

on:
  push:
    paths:
      - '.github/workflows/hj24-label-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend for intelligence residual
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          risk_line = "function hjRiskBadge(r){const xs=[r?.hur,r?.dtr,r?.dlr].filter(Boolean);if(xs.includes('红'))return '🔴 高';if(xs.includes('黄'))return '🟡 中';if(xs.length&&xs.every(x=>x==='绿'||x==='NA'))return '🟢 低';return '⚪ 未确认'}"
          intel_helpers = (
              "function hjIntel(r){return r?.source_status?.intelligence_residual||null}\n"
              "function hjIntelBadge(r){const x=hjIntel(r);if(!x)return '';const t=String(x.risk_tier||'NONE').toUpperCase();if(t==='STRONG_WATCH')return '🔴 情报强预警';if(t==='WATCH')return '🟠 情报重点观察';if(t==='INFO')return '🟡 情报提示';return '⚪ 情报无强冲突'}\n"
              "function hjIntelNum(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'—'}\n"
              "function hjIntelDetailSection(r){const x=hjIntel(r);if(!x)return '';const t=String(x.risk_tier||'NONE').toUpperCase(),tone=t==='STRONG_WATCH'?'bad':t==='WATCH'||t==='INFO'?'warn':'good';const tier=t==='STRONG_WATCH'?'🔴 STRONG_WATCH':t==='WATCH'?'🟠 WATCH':t==='INFO'?'🟡 INFO':'⚪ NONE';const fav=x.favorite_side==='home'?'主队':x.favorite_side==='away'?'客队':'未确认';const gk=(x.fav_gk_excess===true||String(x.fav_gk_excess)==='true')?'是':'否';return '<section class=\"section\"><div class=\"shead\"><h2>🛰️ 2.5 情报Residual</h2><span>赛前情报 + 首发/伤停 · 影子验证，不改正式Top1</span></div><div class=\"cards\"><div class=\"card feature\"><div class=\"kv\"><div>情报风险</div><div><b>'+esc(tier)+'</b></div><div>反向证据域</div><div>'+esc(String(x.adverse_domains??0))+'</div><div>当前热门侧</div><div>'+esc(fav)+'</div><div>影子挑战方向</div><div>'+esc(x.challenger_pick||'—')+'</div><div>正式Top1影响</div><div>否（影子层）</div></div></div><div class=\"card\"><div class=\"kv\"><div>热门主力缺阵差</div><div>'+esc(hjIntelNum(x.fav_loss_excess))+'</div><div>热门负面类别差</div><div>'+esc(hjIntelNum(x.fav_neg_excess,0))+'</div><div>热门门将额外缺阵</div><div>'+esc(gk)+'</div><div>对手正面情报差</div><div>'+esc(hjIntelNum(x.opp_pos_excess,0))+'</div><div>主队缺阵主力当量</div><div>'+esc(hjIntelNum(x.home_unavail_startshare))+'</div><div>客队缺阵主力当量</div><div>'+esc(hjIntelNum(x.away_unavail_startshare))+'</div><div>主/客负面类别</div><div>'+esc(String(x.home_neg_cat??0)+' / '+String(x.away_neg_cat??0))+'</div><div>主/客正面类别</div><div>'+esc(String(x.home_pos_cat??0)+' / '+String(x.away_pos_cat??0))+'</div></div></div></div><div class=\"notice '+tone+'\" style=\"margin:0 12px 12px\">情报Residual当前仅用于发现Top1尾部风险；未通过未来OOT升级前，不自动改变正式方向。</div></section>'}\n"
          )
          if 'function hjIntel(r)' not in s:
              if risk_line not in s:
                  raise SystemExit('hjRiskBadge anchor not found')
              s = s.replace(risk_line, risk_line+'\n'+intel_helpers.rstrip(), 1)

          quick_old = "(goal?'<span class=\"hjqchip\">⚽ '+esc(goal)+'</span>':'')+'</div>'+"
          quick_new = "(goal?'<span class=\"hjqchip\">⚽ '+esc(goal)+'</span>':'')+(hjIntelBadge(r)?'<span class=\"hjqchip\">'+esc(hjIntelBadge(r))+'</span>':'')+'</div>'+"
          q0=s.find('function hjQuickCard'); q1=s.find('function hjScoreMatrixSection')
          if quick_old in s:
              s = s.replace(quick_old, quick_new, 1)
          elif q0 < 0 or q1 < 0 or 'hjIntelBadge(r)' not in s[q0:q1]:
              raise SystemExit('hjQuickCard intelligence insertion anchor not found')

          detail_old = "+scoreSec+hjIndependentDetailSection(r)+'<section class=\"section\"><div class=\"shead\"><h2>🧠 风险与证据</h2>"
          detail_new = "+scoreSec+hjIntelDetailSection(r)+hjIndependentDetailSection(r)+'<section class=\"section\"><div class=\"shead\"><h2>🧠 风险与证据</h2>"
          if detail_old in s:
              s = s.replace(detail_old, detail_new, 1)
          elif '+scoreSec+hjIntelDetailSection(r)+hjIndependentDetailSection(r)' not in s:
              raise SystemExit('matchDetail intelligence section anchor not found')

          for old_build in [
              "const APP_BUILD='2026-09-09 豪竞2.5动态版本显示v21';",
              "const APP_BUILD='2026-09-05 豪传64主推+全覆盖v20';"
          ]:
              if old_build in s:
                  s = s.replace(old_build, "const APP_BUILD='2026-09-09 豪竞2.5情报Residual展示v22';", 1)
                  break

          p.write_text(s, encoding='utf-8')
          Path('version.json').write_text(json.dumps({'build':'2026-09-09 豪竞2.5情报Residual展示v22','updated_at':'2026-09-09'}, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Commit frontend sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m 'Show 豪竞2.5 intelligence residual features'
          git push
