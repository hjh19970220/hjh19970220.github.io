name: one-shot Haolan API-Sports UI patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/haolan-api-sports-ui-v11.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Haolan API-Sports health cards
        run: |
          python - <<'PY'
          from pathlib import Path
          files=[Path(x) for x in ['index.html','live.html','latest.html','member.html'] if Path(x).exists()]
          old_decl="const hs=DATA?.sources?.health||[],hb500=hs.find(x=>x.source_code==='hb_500_jclq_live')||{},hbform=hs.find(x=>x.source_code==='hb_recent_form')||{},hbid=hs.find(x=>x.source_code==='hb_thesportsdb_identity')||{},hbroster=hs.find(x=>x.source_code==='hb_thesportsdb_roster')||{};"
          new_decl="const hs=DATA?.sources?.health||[],hb500=hs.find(x=>x.source_code==='hb_500_jclq_live')||{},hbform=hs.find(x=>x.source_code==='hb_recent_form')||{},hbid=hs.find(x=>x.source_code==='hb_thesportsdb_identity')||{},hbroster=hs.find(x=>x.source_code==='hb_thesportsdb_roster')||{},hbapiGames=hs.find(x=>x.source_code==='hb_api_basketball_games')||{},hbapiStats=hs.find(x=>x.source_code==='hb_api_basketball_stats')||{},hbapiPoss=hs.find(x=>x.source_code==='hb_api_basketball_possession')||{};"
          old_cards="sourceCard('TheSportsDB Roster',hbroster.status||'missing',Number(hbroster.verified_matches||0),Number(hbroster.expected_matches||0),hbroster.last_success_at||hbroster.last_attempt_at,'球员身份底座；不冒充伤停/首发/确认出战')+sourceCard('高级回合效率','missing',0,1,null,'Pace/ORtg/DRtg仍未接入；未确认不伪造')+sourceCard('实时伤停/首发','missing',0,1,null,'Roster已单独接入；实时伤停/首发仍未确认，不冒充')"
          new_cards="sourceCard('TheSportsDB Roster',hbroster.status||'missing',Number(hbroster.verified_matches||0),Number(hbroster.expected_matches||0),hbroster.last_success_at||hbroster.last_attempt_at,'球员身份底座；不冒充伤停/首发/确认出战')+sourceCard('API-Basketball比赛ID',hbapiGames.status||'missing',Number(hbapiGames.verified_matches||0),Number(hbapiGames.expected_matches||0),hbapiGames.last_success_at||hbapiGames.last_attempt_at,'API-Sports球队/比赛ID稳定映射；服务端私钥；按比赛ID缓存')+sourceCard('API-Basketball Box Score',hbapiStats.status||'missing',Number(hbapiStats.verified_matches||0),Number(hbapiStats.expected_matches||0),hbapiStats.last_success_at||hbapiStats.last_attempt_at,'完赛后单场只抓一次并永久缓存；投篮/罚球/篮板/助攻/抢断/盖帽/失误')+sourceCard('精确Pace / ORtg',hbapiPoss.status||'missing',Number(hbapiPoss.verified_matches||0),Number(hbapiPoss.expected_matches||0),hbapiPoss.last_success_at||hbapiPoss.last_attempt_at,'只有OREB拆分真实存在才计算；当前赛事字段不足≠采集器故障，绝不把null当0')+sourceCard('实时伤停/首发','missing',0,1,null,'Roster与历史首发不能冒充赛前伤停；实时确认源仍未接入')"
          changed=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              orig=s
              s=s.replace("const APP_BUILD='2026-09-05 豪篮TheSportsDB数据链v10';","const APP_BUILD='2026-09-05 豪篮API-Sports数据链v11';")
              s=s.replace("function srcTone(status,count,total){if(status==='ok'&&(total===0||count>0))return total===0||count>=total?'good':'warn';return count>0?'warn':'bad'}","function srcTone(status,count,total){if(status==='unavailable_fields'||status==='waiting_results')return 'warn';if(status==='ok'&&(total===0||count>0))return total===0||count>=total?'good':'warn';return count>0?'warn':'bad'}")
              s=s.replace(old_decl,new_decl)
              s=s.replace(old_cards,new_cards)
              s=s.replace('近14日真实赛果形态，再运行2万次重复抽样模拟','TheSportsDB历史形态与API-Basketball统计影子层，再运行2万次重复抽样模拟')
              if s!=orig:
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          Path('version.json').write_text('{"build":"2026-09-05 豪篮API-Sports数据链v11","updated_at":"2026-09-05"}\n',encoding='utf-8')
          print('changed',changed)
          if 'index.html' not in changed:
              raise SystemExit('index.html expected patch markers not found')
          PY
      - name: Commit patch and self-delete workflow
        run: |
          git config user.name 'hao-model-bot'
          git config user.email 'hao-model-bot@users.noreply.github.com'
          git rm -f .github/workflows/haolan-api-sports-ui-v11.yml
          git add index.html live.html latest.html member.html version.json 2>/dev/null || true
          git commit -m 'feat: show Haolan API-Sports data chain [skip ci]'
          git push
