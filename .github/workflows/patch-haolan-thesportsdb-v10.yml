name: one-shot Haolan TheSportsDB UI patch
on:
  push:
    paths:
      - '.github/workflows/patch-haolan-thesportsdb-v10.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("const APP_BUILD='2026-09-05 豪篮双灯v9';","const APP_BUILD='2026-09-05 豪篮TheSportsDB数据链v10';")
          s=s.replace("const hs=DATA?.sources?.health||[],hb500=hs.find(x=>x.source_code==='hb_500_jclq_live')||{},hbform=hs.find(x=>x.source_code==='hb_recent_form')||{};",
                      "const hs=DATA?.sources?.health||[],hb500=hs.find(x=>x.source_code==='hb_500_jclq_live')||{},hbform=hs.find(x=>x.source_code==='hb_recent_form')||{},hbid=hs.find(x=>x.source_code==='hb_thesportsdb_identity')||{},hbroster=hs.find(x=>x.source_code==='hb_thesportsdb_roster')||{};")
          s=s.replace("sourceCard('近14日真实赛果形态',hbform.status||'missing',Number(hbform.verified_matches||0),Number(hbform.expected_matches||0),hbform.last_success_at||hbform.last_attempt_at,'近期得失分/波动/休息天数 · 不冒充进攻效率/回合节奏')",
                      "sourceCard('TheSportsDB近期真实赛果',hbform.status||'missing',Number(hbform.verified_matches||0),Number(hbform.expected_matches||0),hbform.last_success_at||hbform.last_attempt_at,'整季历史赛果/得失分/分差/波动/休息 · team ID长期匹配')")
          needle="+sourceCard('高级回合效率','missing',0,1,null,'回合节奏/进攻效率/防守效率/实力评分 未确认时DQ最高C')"
          repl="+sourceCard('TheSportsDB球队ID',hbid.status||'missing',Number(hbid.verified_matches||0),Number(hbid.expected_matches||0),hbid.last_success_at||hbid.last_attempt_at,'竞彩中文队名→稳定team ID，永久复用')+sourceCard('TheSportsDB Roster',hbroster.status||'missing',Number(hbroster.verified_matches||0),Number(hbroster.expected_matches||0),hbroster.last_success_at||hbroster.last_attempt_at,'球员身份底座；不冒充伤停/首发/确认出战')+sourceCard('高级回合效率','missing',0,1,null,'Pace/ORtg/DRtg仍未接入；未确认不伪造')"
          if needle not in s:
              raise SystemExit('advanced-card needle not found')
          s=s.replace(needle,repl)
          s=s.replace("sourceCard('阵容与伤停','missing',0,1,null,'可靠球员状态未确认时降低核心腿资格；不再自动否定高概率胜负方向')",
                      "sourceCard('实时伤停/首发','missing',0,1,null,'Roster已单独接入；实时伤停/首发仍未确认，不冒充')")
          p.write_text(s)
          Path('version.json').write_text('{"build":"2026-09-05 豪篮TheSportsDB数据链v10","updated_at":"2026-09-05"}')
          PY
      - name: Commit patch and remove one-shot workflow
        run: |
          rm -f .github/workflows/patch-haolan-thesportsdb-v10.yml
          git config user.name 'hao-model-bot'
          git config user.email 'hao-model-bot@users.noreply.github.com'
          git add index.html version.json .github/workflows/patch-haolan-thesportsdb-v10.yml
          git commit -m 'feat: show Haolan TheSportsDB data chain [skip ci]'
          git push
