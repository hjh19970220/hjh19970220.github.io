name: build-ios-haojing27-adhoc

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DEVICE_UDID: ${{ secrets.IOS_DEVICE_UDID }}
        run: |
          set -euo pipefail
          test -n "$IOS_P12_BASE64"
          test -n "$IOS_P12_PASSWORD"
          test -n "$IOS_MOBILEPROVISION_BASE64"
          test -n "$IOS_TEAM_ID"
          test -n "$IOS_DEVICE_UDID"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing certificate and profile
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/haojing_dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/haojing.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/haojing-signing.keychain-db"
          echo "$IOS_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          echo "Provisioning profile: $PROFILE_NAME"
          echo "Application identifier: $PROFILE_APP_ID"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Verify Ad Hoc profile contract
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DEVICE_UDID: ${{ secrets.IOS_DEVICE_UDID }}
        run: |
          set -euo pipefail
          PLIST="$RUNNER_TEMP/profile.plist"
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")
          test "$TEAM" = "$IOS_TEAM_ID"
          echo "$APPID" | grep -q '\.com\.hao\.haojing27$'
          /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PLIST" > "$RUNNER_TEMP/provisioned-devices.txt"
          test -s "$RUNNER_TEMP/provisioned-devices.txt"
          grep -Fq "$IOS_DEVICE_UDID" "$RUNNER_TEMP/provisioned-devices.txt"
          echo "Ad Hoc profile validation passed for requested device."

      - name: Generate project
        run: |
          cd ios/Haojing27
          xcodegen generate

      - name: Archive for device
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cd ios/Haojing27
          xcodebuild \
            -project Haojing27.xcodeproj \
            -scheme Haojing27 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Haojing27.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export Ad Hoc IPA
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hao.haojing27</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          mkdir -p out
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Haojing27.xcarchive" \
            -exportPath out \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -f out/Haojing27.ipa
          shasum -a 256 out/Haojing27.ipa > out/Haojing27.ipa.sha256

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Haojing27-iOS-v0.2-AdHoc
          path: |
            out/Haojing27.ipa
            out/Haojing27.ipa.sha256
          if-no-files-found: error
          retention-days: 30
