name: Patch HJ Chinese v15 Fix
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_hj_cn_v15_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore internal frontend keys after Chinese labels [skip ci]"
          git push
      - run: |
          git pull --rebase
          git rm .github/workflows/patch-hj-cn-v15-fix.yml patch_hj_cn_v15_fix.py
          git commit -m "chore: remove v15 fix files [skip ci]"
          git push
