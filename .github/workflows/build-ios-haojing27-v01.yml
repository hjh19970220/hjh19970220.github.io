name: build-ios-haojing27-v01
on:
  push:
    paths:
      - ".github/workflows/build-ios-haojing27-v01.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Create native SwiftUI app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios/Haojing27/Haojing27
          cat > ios/Haojing27/project.yml <<'YAML'
          name: Haojing27
          options:
            bundleIdPrefix: com.hao
            deploymentTarget:
              iOS: "17.0"
          settings:
            base:
              SWIFT_VERSION: 5.0
              CURRENT_PROJECT_VERSION: 1
              MARKETING_VERSION: 0.1.0
              CODE_SIGN_STYLE: Automatic
          targets:
            Haojing27:
              type: application
              platform: iOS
              sources:
                - Haojing27
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hao.haojing27
                  PRODUCT_NAME: Haojing27
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: 豪竞2.7
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
                  TARGETED_DEVICE_FAMILY: "1"
          YAML

          cat > ios/Haojing27/Haojing27/Haojing27App.swift <<'SWIFT'
          import SwiftUI

          @main
          struct Haojing27App: App {
              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          SWIFT

          cat > ios/Haojing27/Haojing27/RootView.swift <<'SWIFT'
          import SwiftUI

          struct RootView: View {
              var body: some View {
                  TabView {
                      NavigationStack { TodayView() }
                          .tabItem { Label("今日", systemImage: "sportscourt.fill") }
                      NavigationStack { PicksView() }
                          .tabItem { Label("选腿", systemImage: "target") }
                      NavigationStack { HistoryView() }
                          .tabItem { Label("历史", systemImage: "clock.arrow.circlepath") }
                      NavigationStack { SystemView() }
                          .tabItem { Label("系统", systemImage: "shield.lefthalf.filled") }
                  }
                  .tint(Color(red: 90/255, green: 169/255, blue: 1))
              }
          }

          private let bg = Color(red: 7/255, green: 17/255, blue: 31/255)
          private let panel = Color(red: 13/255, green: 27/255, blue: 45/255)

          struct TodayView: View {
              var body: some View {
                  ZStack {
                      bg.ignoresSafeArea()
                      ScrollView {
                          VStack(spacing: 14) {
                              VStack(alignment: .leading, spacing: 8) {
                                  HStack {
                                      Text("豪·体彩预测模型").font(.headline)
                                      Spacer()
                                      Circle().fill(.green).frame(width: 9, height: 9)
                                  }
                                  Text("豪竞2.7 · 原生 iOS 客户端")
                                      .font(.caption).foregroundStyle(.secondary)
                              }
                              .padding(16)
                              .background(panel, in: RoundedRectangle(cornerRadius: 20))

                              ForEach(["001","002","003"], id: \.self) { n in
                                  VStack(alignment: .leading, spacing: 8) {
                                      Text(n).font(.caption.bold()).foregroundStyle(.yellow)
                                      Text("比赛数据接入准备完成").font(.headline)
                                      HStack {
                                          Text("Top1 待接口刷新").foregroundStyle(.cyan)
                                          Spacer()
                                          Text("DQ —").font(.caption).foregroundStyle(.secondary)
                                      }
                                  }
                                  .padding(15)
                                  .background(panel, in: RoundedRectangle(cornerRadius: 18))
                              }
                          }
                          .padding()
                      }
                  }
                  .navigationTitle("豪竞 2.7")
              }
          }

          struct PicksView: View {
              var body: some View {
                  ZStack {
                      bg.ignoresSafeArea()
                      ContentUnavailableView("选腿模块", systemImage: "target", description: Text("下一版接入单选 / 双选 / PASS 与灯号"))
                  }
                  .navigationTitle("选腿")
              }
          }

          struct HistoryView: View {
              var body: some View {
                  ZStack {
                      bg.ignoresSafeArea()
                      ContentUnavailableView("历史模块", systemImage: "chart.xyaxis.line", description: Text("下一版接入命中率与模拟投注账本"))
                  }
                  .navigationTitle("历史")
              }
          }

          struct SystemView: View {
              var body: some View {
                  Form {
                      Section("豪竞2.7") {
                          LabeledContent("App", value: "v0.1")
                          LabeledContent("架构", value: "SwiftUI + Supabase")
                          LabeledContent("状态", value: "原生工程已生成")
                      }
                  }
                  .scrollContentBackground(.hidden)
                  .background(bg)
                  .navigationTitle("系统")
              }
          }
          SWIFT
      - name: Generate project and build
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          cd ios/Haojing27
          xcodegen generate
          xcodebuild -project Haojing27.xcodeproj -scheme Haojing27 -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Debug-iphonesimulator/Haojing27.app' -print -quit)
          test -n "$APP"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/Haojing27-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Haojing27-iOS-v0.1-simulator
          path: ios/Haojing27/out/Haojing27-simulator.zip
