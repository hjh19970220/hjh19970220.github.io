name: one-shot Haolan cumulative hit-rate UI
on:
  push:
    paths:
      - '.github/workflows/haolan-cumulative-v12.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cumulative UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          files=['index.html','latest.html','live.html']
          build='2026-09-05 豪篮累计命中率v12'
          api="https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-basketball-7m-probe-v01"
          new_func=r'''function renderCumulative(){const c=DATA.cumulative||{},h=c.hj||{},r=c.hc||{},b=HB_CUM||{},bo=b.overall||{},bm=b.moneyline||{},bs=b.spread||{},bt=b.total||{},bc=b.core||{};const hbMain=HB_CUM?((bo.hits||0)+'/'+(bo.scored||0)):'加载中';const hbPct=HB_CUM?pct(bo.hits,bo.scored):'读取最终冻结盘';return '<div class="grid4">'+metric('豪竞正式Top1',(h.hits||0)+'/'+(h.scored||0),pct(h.hits,h.scored))+metric('豪竞正式竞彩日',String(h.days||0),'完整正式样本')+metric('豪传9/9',String(r.full9||0),'正式期数 '+String(r.issues||0))+metric('豪传累计票面',(r.hits||0)+'/'+(r.scored||0),pct(r.hits,r.scored))+metric('🏀 豪篮全池首选',hbMain,hbPct,HB_CUM?'good':'warn')+'</div><section class="section"><div class="shead"><h2>🏀 豪篮累计命中率</h2><span>按销售日最终冻结盘去重 · 完场后自动累计</span></div><div class="grid4" style="padding:12px">'+metric('全池冻结首选',HB_CUM?((bo.hits||0)+'/'+(bo.scored||0)):'加载中',HB_CUM?pct(bo.hits,bo.scored):'—')+metric('胜负概率Top1',HB_CUM?((bm.hits||0)+'/'+(bm.scored||0)):'—',HB_CUM?pct(bm.hits,bm.scored):'仅有效概率样本')+metric('让分Top1',HB_CUM?((bs.hits||0)+'/'+(bs.scored||0)):'—',HB_CUM?pct(bs.hits,bs.scored):'仅有效盘口样本')+metric('大小分Top1',HB_CUM?((bt.hits||0)+'/'+(bt.scored||0)):'—',HB_CUM?pct(bt.hits,bt.scored):'仅有效总分样本')+metric('核心腿',HB_CUM?((bc.hits||0)+'/'+(bc.scored||0)):'—',HB_CUM?pct(bc.hits,bc.scored):'核心绿灯样本')+metric('完整结算日',HB_CUM?String(b.days||0):'—','每销售日只计一次，不重复revision')+'</div></section><section class="section"><div class="shead"><h2>胜平负决策质量</h2><span>正式累计</span></div><div class="grid4" style="padding:12px">'+metric('稳腿',(h.anchorHits||0)+'/'+(h.anchorScored||0),pct(h.anchorHits,h.anchorScored))+metric('高信心',(h.highHits||0)+'/'+(h.highScored||0),pct(h.highHits,h.highScored))+metric('PASS隔离',String(h.passIsolated||0),'错误场成功隔离')+metric('PASS误杀',String(h.passFalseKills||0),'被PASS但首选命中')+'</div></section><section class="section"><div class="shead"><h2>让球决策质量</h2><span>仅统计上线后真实赛前灯</span></div><div class="grid4" style="padding:12px">'+metric('🟢绿灯',(h.handicapGreenHits||0)+'/'+(h.handicapGreenScored||0),pct(h.handicapGreenHits,h.handicapGreenScored))+metric('🟡黄灯',(h.handicapYellowHits||0)+'/'+(h.handicapYellowScored||0),pct(h.handicapYellowHits,h.handicapYellowScored))+metric('实际出手',(h.handicapOutHits||0)+'/'+(h.handicapOutScored||0),pct(h.handicapOutHits,h.handicapOutScored))+metric('🔴PASS',String(h.handicapRedPass||0),'避错 '+String(h.handicapPassAvoided||0)+' · 误杀 '+String(h.handicapPassFalseKills||0))+'</div></section>'}'''
          loader=f'''async function loadHbCumulative(){{try{{const r=await fetch(HB_CUM_API+'?t='+Date.now(),{{cache:'no-store'}}),j=await r.json();if(r.ok&&j.ok)HB_CUM=j;else HB_CUM=null}}catch(_){{HB_CUM=null}}if(TAB==='cumulative'&&DATA)render()}}\n'''
          for fn in files:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              if 'const HB_CUM_API=' not in s:
                  s=s.replace("const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';", "const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';\nconst HB_CUM_API='"+api+"';")
              if 'let HB_CUM=null;' not in s:
                  s=s.replace("let DATA=null,TAB='dashboard',AUTO_TIMER=null,DETAIL=null,RESET_HJ_SCROLL=false;", "let DATA=null,TAB='dashboard',AUTO_TIMER=null,DETAIL=null,RESET_HJ_SCROLL=false;\nlet HB_CUM=null;")
              if 'async function loadHbCumulative()' not in s:
                  s=s.replace('function renderCumulative(){',loader+'function renderCumulative(){',1)
              s=re.sub(r"function renderCumulative\(\)\{.*?\}\nfunction renderHistory",new_func+'\nfunction renderHistory',s,flags=re.S)
              s=s.replace("function setTab(t){TAB=t;DETAIL=null;", "function setTab(t){TAB=t;DETAIL=null;if(t==='cumulative')loadHbCumulative();")
              s=s.replace("DATA=j;if(oldHistory)DATA.history=oldHistory;render();", "DATA=j;if(oldHistory)DATA.history=oldHistory;if(TAB==='cumulative')loadHbCumulative();render();")
              s=re.sub(r"const APP_BUILD='[^']+';", "const APP_BUILD='"+build+"';", s, count=1)
              p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':build,'updated_at':'2026-09-05'},ensure_ascii=False)+'\n')
          PY
          rm -f .github/workflows/haolan-cumulative-v12.yml
      - name: Commit
        run: |
          git config user.name "hao-model-bot"
          git config user.email "hao-model-bot@users.noreply.github.com"
          git add index.html latest.html live.html version.json .github/workflows/haolan-cumulative-v12.yml
          git commit -m "feat: add Haolan cumulative hit rates [skip ci]" || exit 0
          git push
