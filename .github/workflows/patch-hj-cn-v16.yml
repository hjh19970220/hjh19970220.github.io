name: Patch HJ Chinese v16
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_hj_cn_v16.py
      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          a=s.index('<script>')+len('<script>')
          b=s.rindex('</script>')
          Path('/tmp/app.js').write_text(s[a:b])
          PY
          node --check /tmp/app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "fix: 豪竞风险诊断全中文 v16 [skip ci]"
          git push
      - run: |
          git pull --rebase
          git rm .github/workflows/patch-hj-cn-v16.yml patch_hj_cn_v16.py
          git commit -m "chore: remove v16 one-shot files [skip ci]"
          git push
