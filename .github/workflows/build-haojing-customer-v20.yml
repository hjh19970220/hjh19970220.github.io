name: Build HaoJing Customer APK v2.0

on:
  push:
    branches: [haojing-android]
    paths: ['.github/workflows/build-haojing-customer-v20.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Validate customer data APIs
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' .github/workflows/build-haojing-apk.yml | head -1)
          BASE='https://tqlibowvnwfkaseqqvvp.supabase.co/rest/v1'
          curl --fail-with-body -sS -H "apikey: $KEY" "$BASE/hao_app_full_snapshot_v14?select=publish_date,match_no,league,home_team,away_team,kickoff_bjt,top1,second_pick,result_text,eval_status,source_kind,frozen_at&order=publish_date.desc,match_no.asc" >/tmp/full.json
          curl --fail-with-body -sS -H "apikey: $KEY" "$BASE/hao_app_picks_snapshot_v14?select=publish_date,match_no,league,home_team,away_team,kickoff_bjt,category,selected_pick,selected_price,selected_model_probability,star_level,short_reason,settle_status,result_text,record_kind&order=publish_date.desc,recommendation_rank.asc" >/tmp/picks.json
          curl --fail-with-body -sS -H "apikey: $KEY" "$BASE/hao_app_risk_stats_v15?select=publish_date,match_no,risk_badge,risk_reason,risk_status&order=publish_date.desc,match_no.asc" >/tmp/risk.json
          test "$(jq length /tmp/full.json)" -gt 0
          test "$(jq length /tmp/picks.json)" -gt 0
          jq -e 'type=="array"' /tmp/risk.json >/dev/null
          echo "CUSTOMER_API_OK full=$(jq length /tmp/full.json) picks=$(jq length /tmp/picks.json) risk=$(jq length /tmp/risk.json)"
      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' .github/workflows/build-haojing-apk.yml | head -1)
          rm -rf customer20
          mkdir -p customer20/app/src/main/java/com/haojing/app customer20/app/src/main/res/values
          cat > customer20/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='HaoJingCustomer20'; include ':app'
          EOF
          cat > customer20/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > customer20/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.haojing.app'; compileSdk 35; defaultConfig { applicationId 'com.haojing.app'; minSdk 26; targetSdk 35; versionCode 200; versionName '2.0.0' } }
          EOF
          cat > customer20/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:statusBarColor">#C85D00</item><item name="android:navigationBarColor">#FFFFFF</item><item name="android:windowLightNavigationBar">true</item></style></resources>
          EOF
          cat > customer20/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/AppTheme" android:label="豪竞引擎" android:usesCleartextTraffic="false"><activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > customer20/app/src/main/java/com/haojing/app/MainActivity.java <<'EOF'
          package com.haojing.app;
          import android.app.*;import android.os.*;import android.content.*;import android.graphics.*;import android.graphics.drawable.*;import android.view.*;import android.view.inputmethod.InputMethodManager;import android.widget.*;import org.json.*;import java.io.*;import java.net.*;import java.nio.charset.StandardCharsets;import java.text.*;import java.util.*;
          public class MainActivity extends Activity{
            static final String HOST="https://tqlibowvnwfkaseqqvvp.supabase.co", REST=HOST+"/rest/v1/", AUTH=HOST+"/auth/v1/", KEY="__KEY__";
            int gold=0xFFD66A08,gold2=0xFFFFF0E0,black=0xFF1E2024,muted=0xFF747980,bg=0xFFF6F6F7,red=0xFFE44B43,green=0xFF168A52,blue=0xFF3478D4,warn=0xFFE78A16,line=0xFFE8E8E8;
            LinearLayout body,nav,dateBar;JSONArray full=new JSONArray(),picks=new JSONArray(),risks=new JSONArray();String page="home",day="";Handler handler=new Handler(Looper.getMainLooper());SharedPreferences sp;String accessToken="",refreshToken="";boolean loading=false;
            Runnable loop=new Runnable(){public void run(){loadAll();handler.postDelayed(this,300000);}};
            int dp(int x){return(int)(x*getResources().getDisplayMetrics().density+.5f);} TextView tv(String s,int z,int c,boolean b){TextView v=new TextView(this);v.setText(s);v.setTextSize(z);v.setTextColor(c);if(b)v.setTypeface(null,1);v.setPadding(dp(4),dp(4),dp(4),dp(4));return v;} GradientDrawable box(int c,int r){GradientDrawable g=new GradientDrawable();g.setColor(c);g.setCornerRadius(dp(r));return g;} GradientDrawable stroke(int c,int r,int sc){GradientDrawable g=box(c,r);g.setStroke(dp(1),sc);return g;} LinearLayout card(){LinearLayout c=new LinearLayout(this);c.setOrientation(LinearLayout.VERTICAL);c.setPadding(dp(14),dp(12),dp(14),dp(12));c.setBackground(box(Color.WHITE,14));LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,-2);p.setMargins(0,dp(5),0,dp(5));c.setLayoutParams(p);return c;} String no3(String n){try{return String.format(Locale.CHINA,"%03d",Integer.parseInt(n));}catch(Exception e){return n;}}
            public void onCreate(Bundle b){super.onCreate(b);sp=getSharedPreferences("haojing",0);accessToken=sp.getString("access_token","");refreshToken=sp.getString("refresh_token","");build();loadAll();handler.postDelayed(loop,300000);}
            protected void onResume(){super.onResume();if(body!=null)loadAll();} protected void onDestroy(){super.onDestroy();handler.removeCallbacks(loop);}
            void build(){LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);root.setBackgroundColor(bg);LinearLayout head=new LinearLayout(this);head.setGravity(Gravity.CENTER_VERTICAL);head.setPadding(dp(14),dp(10),dp(12),dp(10));head.setBackgroundColor(gold);LinearLayout t=new LinearLayout(this);t.setOrientation(LinearLayout.VERTICAL);t.addView(tv("豪竞引擎",23,Color.WHITE,true));t.addView(tv("豪竞核心研判系统",11,0xFFFFE8D4,false));head.addView(t,new LinearLayout.LayoutParams(0,-2,1));TextView sync=tv("同步",13,Color.WHITE,true);sync.setBackground(stroke(0x22FFFFFF,10,0x66FFFFFF));sync.setPadding(dp(12),dp(7),dp(12),dp(7));sync.setOnClickListener(v->loadAll());head.addView(sync);root.addView(head);HorizontalScrollView hs=new HorizontalScrollView(this);hs.setHorizontalScrollBarEnabled(false);dateBar=new LinearLayout(this);dateBar.setPadding(dp(8),dp(7),dp(8),dp(7));hs.addView(dateBar);root.addView(hs);ScrollView sv=new ScrollView(this);body=new LinearLayout(this);body.setOrientation(LinearLayout.VERTICAL);body.setPadding(dp(10),0,dp(10),dp(14));sv.addView(body);root.addView(sv,new LinearLayout.LayoutParams(-1,0,1));nav=new LinearLayout(this);nav.setPadding(0,dp(2),0,0);nav.setBackgroundColor(Color.WHITE);root.addView(nav);setContentView(root);drawNav();}
            void drawNav(){nav.removeAllViews();String[][] xs={{"首页","home"},{"全池","full"},{"精选","picks"},{"战绩","record"},{"我的","me"}};for(String[] q:xs){boolean on=page.equals(q[1]);TextView x=tv(q[0],13,on?gold:muted,on);x.setGravity(Gravity.CENTER);x.setBackgroundColor(Color.WHITE);x.setOnClickListener(v->{page=q[1];render();});nav.addView(x,new LinearLayout.LayoutParams(0,dp(54),1));}}
            void loadAll(){if(loading)return;loading=true;new Thread(()->{JSONArray a=null,b=null,c=null;try{a=getPublic("hao_app_full_snapshot_v14?select=publish_date,match_no,league,home_team,away_team,kickoff_bjt,top1,second_pick,result_text,eval_status,source_kind,frozen_at&order=publish_date.desc,match_no.asc");}catch(Exception ignored){}try{b=getPublic("hao_app_picks_snapshot_v14?select=publish_date,match_no,league,home_team,away_team,kickoff_bjt,category,selected_pick,selected_price,selected_model_probability,star_level,short_reason,settle_status,result_text,record_kind&order=publish_date.desc,recommendation_rank.asc");}catch(Exception ignored){}try{c=getPublic("hao_app_risk_stats_v15?select=publish_date,match_no,risk_badge,risk_reason,risk_status&order=publish_date.desc,match_no.asc");}catch(Exception ignored){}JSONArray fa=a,fb=b,fc=c;runOnUiThread(()->{loading=false;if(fa!=null)full=fa;if(fb!=null)picks=fb;if(fc!=null)risks=fc;if(day.isEmpty())day=latestDate();render();});}).start();}
            JSONArray getPublic(String p)throws Exception{return requestArray("GET",REST+p,null,null);} JSONArray getPrivate(String p)throws Exception{ensureToken();return requestArray("GET",REST+p,null,accessToken);} JSONObject authPost(String path,JSONObject body)throws Exception{return requestObject("POST",AUTH+path,body.toString(),null);} JSONArray requestArray(String method,String url,String body,String token)throws Exception{String s=request(method,url,body,token);return new JSONArray(s);} JSONObject requestObject(String method,String url,String body,String token)throws Exception{String s=request(method,url,body,token);return new JSONObject(s);} String request(String method,String url,String body,String token)throws Exception{HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();c.setRequestMethod(method);c.setConnectTimeout(12000);c.setReadTimeout(16000);c.setRequestProperty("apikey",KEY);c.setRequestProperty("Content-Type","application/json");if(token!=null&&!token.isEmpty())c.setRequestProperty("Authorization","Bearer "+token);if(body!=null){c.setDoOutput(true);c.getOutputStream().write(body.getBytes(StandardCharsets.UTF_8));}int code=c.getResponseCode();InputStream in=code<300?c.getInputStream():c.getErrorStream();String s=in==null?"":new String(in.readAllBytes(),StandardCharsets.UTF_8);if(code>=300)throw new IOException("HTTP "+code+" "+s);return s;}
            void ensureToken()throws Exception{if(accessToken.isEmpty()&&!refreshToken.isEmpty())refreshSession();} void refreshSession()throws Exception{if(refreshToken.isEmpty())return;JSONObject r=authPost("token?grant_type=refresh_token",new JSONObject().put("refresh_token",refreshToken));saveSession(r);} void saveSession(JSONObject r){accessToken=r.optString("access_token");refreshToken=r.optString("refresh_token",refreshToken);sp.edit().putString("access_token",accessToken).putString("refresh_token",refreshToken).apply();}
            String latestDate(){String d="";for(int i=0;i<full.length();i++){String x=full.optJSONObject(i).optString("publish_date");if(x.compareTo(d)>0)d=x;}return d;}
            void render(){drawNav();drawDates();body.removeAllViews();if(page.equals("home"))home();else if(page.equals("full"))fullPage();else if(page.equals("picks"))picksPage();else if(page.equals("record"))recordPage();else mePage();}
            void drawDates(){dateBar.removeAllViews();boolean show=page.equals("full")||page.equals("picks");dateBar.setVisibility(show?View.VISIBLE:View.GONE);if(!show)return;JSONArray src=page.equals("full")?full:picks;LinkedHashSet<String> set=new LinkedHashSet<>();for(int i=0;i<src.length();i++){String d=src.optJSONObject(i).optString("publish_date");if(!d.isEmpty())set.add(d);}int count=0;for(String d:set){if(page.equals("full")&&count++>=15)break;TextView x=tv(d.length()>=10?d.substring(5).replace("-","/"):d,14,d.equals(day)?Color.WHITE:black,true);x.setGravity(Gravity.CENTER);x.setBackground(box(d.equals(day)?gold:Color.WHITE,10));LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(dp(66),dp(38));lp.setMargins(dp(3),0,dp(3),0);x.setLayoutParams(lp);x.setOnClickListener(v->{day=d;render();});dateBar.addView(x);}}
            JSONObject riskFor(String d,String n){String z=no3(n);for(int i=0;i<risks.length();i++){JSONObject r=risks.optJSONObject(i);if(d.equals(r.optString("publish_date"))&&z.equals(no3(r.optString("match_no"))))return r;}return new JSONObject();}
            ArrayList<JSONObject> picksFor(String d,String n){ArrayList<JSONObject> a=new ArrayList<>();HashSet<String> seen=new HashSet<>();for(int i=0;i<picks.length();i++){JSONObject o=picks.optJSONObject(i);if(!d.equals(o.optString("publish_date"))||!no3(n).equals(no3(o.optString("match_no"))))continue;String cat=o.optString("category");if(seen.add(cat)){a.add(o);if(a.size()==2)break;}}return a;}
            String matchEval(String d,String n){ArrayList<JSONObject>a=picksFor(d,n);if(a.isEmpty())return "";boolean pending=false;for(JSONObject o:a){String s=o.optString("settle_status");if(s.equals("命中"))return "评测成功";if(!(s.equals("未中")||s.equals("评测未中")))pending=true;}return pending?"待赛":"评测未中";}
            boolean isFormal(JSONObject o){return "正式前瞻".equals(o.optString("record_kind"));}
            void home(){String today=latestDate();if(!today.isEmpty())day=today;LinearLayout hero=card();hero.setBackground(box(0xFF242529,14));hero.addView(tv("今日研判",13,0xFFFFC58C,true));int total=0,sel=0,risk=0;for(int i=0;i<full.length();i++){JSONObject o=full.optJSONObject(i);if(day.equals(o.optString("publish_date"))){total++;if(!picksFor(day,o.optString("match_no")).isEmpty())sel++;if("冷门预警".equals(riskFor(day,o.optString("match_no")).optString("risk_badge")))risk++;}}hero.addView(tv(total+" 场 · 精选 "+sel+" · 风险预警 "+risk,22,Color.WHITE,true));hero.addView(tv("后台自动同步，比赛、精选、赛果无需更新APK。",12,0xFFD7D7D7,false));body.addView(hero);for(int i=0;i<full.length();i++){JSONObject o=full.optJSONObject(i);if(!day.equals(o.optString("publish_date")))continue;LinearLayout c=card();LinearLayout r=new LinearLayout(this);r.addView(tv(no3(o.optString("match_no"))+"  "+o.optString("league"),13,muted,true),new LinearLayout.LayoutParams(0,-2,1));String ev=matchEval(day,o.optString("match_no"));if(!ev.isEmpty())r.addView(tv(ev,12,ev.equals("评测成功")?green:ev.equals("评测未中")?red:gold,true));c.addView(r);c.addView(tv(o.optString("home_team")+"  vs  "+o.optString("away_team"),17,black,true));String ko=o.optString("kickoff_bjt");String res=o.optString("result_text");c.addView(tv((ko.length()>=16?ko.substring(11,16):"待定")+(res.isEmpty()?" · 待赛":" · 完场 "+res),12,muted,false));ArrayList<JSONObject> pp=picksFor(day,o.optString("match_no"));if(!pp.isEmpty())c.addView(tv("精选",12,gold,true));JSONObject rr=riskFor(day,o.optString("match_no"));if(!rr.optString("risk_badge").isEmpty())c.addView(tv("⚠ "+rr.optString("risk_badge"),12,warn,true));c.setOnClickListener(v->showDetail(o));body.addView(c);}}
            void fullPage(){int n=0;for(int i=0;i<full.length();i++){JSONObject o=full.optJSONObject(i);if(!day.equals(o.optString("publish_date")))continue;n++;LinearLayout c=card();LinearLayout r=new LinearLayout(this);r.addView(tv(no3(o.optString("match_no"))+"  "+o.optString("league"),13,muted,true),new LinearLayout.LayoutParams(0,-2,1));JSONObject rr=riskFor(day,o.optString("match_no"));String rb=rr.optString("risk_badge");if(!rb.isEmpty())r.addView(tv(rb,12,rb.equals("冷门预警")?warn:muted,true));c.addView(r);c.addView(tv(o.optString("home_team")+"  vs  "+o.optString("away_team"),17,black,true));String a=o.optString("top1"),b=o.optString("second_pick");c.addView(tv("双选研判："+a+(b.isEmpty()?"":" / "+b),15,gold,true));String rs=o.optString("result_text");if(!rs.isEmpty())c.addView(tv("完场 "+rs+" · "+o.optString("eval_status"),12,muted,false));if(!rb.isEmpty())c.addView(tv(rr.optString("risk_reason"),12,warn,false));body.addView(c);}if(n==0)body.addView(tv("该日期暂无记录",15,muted,false));}
            String catName(String c){if(c==null)return "精选";c=c.toUpperCase();if(c.contains("HHAD")||c.contains("让球"))return "让球胜平负";if(c.contains("HALF")||c.contains("BQC")||c.contains("半全"))return "半全场";if(c.contains("HAD")||c.contains("FT")||c.contains("胜平负"))return "胜平负";return c;}
            String conf(JSONObject o){int s=o.optInt("star_level",0);double p=o.optDouble("selected_model_probability",0);if(s>=5||p>=.72)return "高";if(s>=4||p>=.62)return "较高";return "稳健";}
            void picksPage(){int matches=0;HashSet<String> done=new HashSet<>();for(int i=0;i<picks.length();i++){JSONObject o=picks.optJSONObject(i);if(!day.equals(o.optString("publish_date")))continue;String key=no3(o.optString("match_no"));if(!done.add(key))continue;matches++;ArrayList<JSONObject> ps=picksFor(day,key);LinearLayout c=card();LinearLayout h=new LinearLayout(this);h.addView(tv(key+"  "+o.optString("league"),13,muted,true),new LinearLayout.LayoutParams(0,-2,1));String kind=o.optString("record_kind");h.addView(tv(kind,11,kind.equals("正式前瞻")?gold:blue,true));c.addView(h);c.addView(tv(o.optString("home_team")+"  vs  "+o.optString("away_team"),17,black,true));for(JSONObject p:ps){String price=p.optString("selected_price");c.addView(tv(catName(p.optString("category"))+"："+p.optString("selected_pick")+(price.isEmpty()?"":"  · SP "+price),16,gold,true));}String ev=matchEval(day,key);c.addView(tv(ev.isEmpty()?"待赛":ev,13,ev.equals("评测成功")?green:ev.equals("评测未中")?red:muted,true));c.setOnClickListener(v->showPickDetail(o,ps));body.addView(c);}if(matches==0)body.addView(tv("该日期暂无精选",15,muted,false));}
            void showDetail(JSONObject o){ArrayList<JSONObject> ps=picksFor(o.optString("publish_date"),o.optString("match_no"));showPickDetail(o,ps);} void showPickDetail(JSONObject base,ArrayList<JSONObject> ps){LinearLayout x=new LinearLayout(this);x.setOrientation(LinearLayout.VERTICAL);x.setPadding(dp(16),dp(8),dp(16),0);x.addView(tv(no3(base.optString("match_no"))+" · "+base.optString("league"),13,muted,true));x.addView(tv(base.optString("home_team")+" vs "+base.optString("away_team"),19,black,true));String ko=base.optString("kickoff_bjt");if(!ko.isEmpty())x.addView(tv("比赛时间："+ko.replace("T"," "),12,muted,false));if(ps.isEmpty())x.addView(tv("本场暂无正式精选方案",15,muted,false));for(JSONObject p:ps){LinearLayout y=card();y.setBackground(box(gold2,12));y.addView(tv(catName(p.optString("category")),13,muted,true));y.addView(tv(p.optString("selected_pick"),19,gold,true));y.addView(tv("信心："+conf(p),13,black,true));String reason=p.optString("short_reason");if(!reason.isEmpty())y.addView(tv("赛前研判："+reason,12,muted,false));x.addView(y);}JSONObject rr=riskFor(base.optString("publish_date"),base.optString("match_no"));if(!rr.optString("risk_badge").isEmpty())x.addView(tv("风险提醒："+rr.optString("risk_reason"),13,warn,true));String res=base.optString("result_text");if(res.isEmpty()&&!ps.isEmpty())res=ps.get(0).optString("result_text");if(!res.isEmpty())x.addView(tv("完场比分："+res+" · "+matchEval(base.optString("publish_date"),base.optString("match_no")),14,black,true));new AlertDialog.Builder(this).setTitle("豪竞精选详情").setView(x).setPositiveButton("关闭",null).show();}
            void recordPage(){Stat s7=stat(7),s30=stat(30),sa=stat(99999);LinearLayout a=card();a.addView(tv("正式实战战绩",20,black,true));a.addView(tv("仅统计赛前冻结且赛果确认的正式前瞻记录",12,muted,false));a.addView(tv("近7日   "+s7.text(),18,gold,true));a.addView(tv("近30日  "+s30.text(),18,black,true));a.addView(tv("累计     "+sa.text(),18,black,true));body.addView(a);LinkedHashSet<String> dates=new LinkedHashSet<>();for(int i=0;i<picks.length();i++){JSONObject o=picks.optJSONObject(i);if(isFormal(o))dates.add(o.optString("publish_date"));}int shown=0;for(String d:dates){if(shown++>60)break;HashSet<String> ms=new HashSet<>();for(int i=0;i<picks.length();i++){JSONObject o=picks.optJSONObject(i);if(isFormal(o)&&d.equals(o.optString("publish_date")))ms.add(no3(o.optString("match_no")));}for(String m:ms){JSONObject b=null;for(int i=0;i<picks.length();i++){JSONObject z=picks.optJSONObject(i);if(isFormal(z)&&d.equals(z.optString("publish_date"))&&m.equals(no3(z.optString("match_no")))){b=z;break;}}if(b==null)continue;String ev=matchEval(d,m);if(ev.equals("待赛")||ev.isEmpty())continue;LinearLayout c=card();c.addView(tv(d+"  "+m+"  "+b.optString("league"),12,muted,true));c.addView(tv(b.optString("home_team")+" vs "+b.optString("away_team"),15,black,true));c.addView(tv((b.optString("result_text").isEmpty()?"":"比分 "+b.optString("result_text")+" · ")+ev,13,ev.equals("评测成功")?green:red,true));body.addView(c);}}}
            class Stat{int h=0,n=0;String text(){return n==0?"暂无结算":h+"/"+n+" · "+String.format(Locale.CHINA,"%.1f%%",100.0*h/n)+"（样本"+n+"）";}} Stat stat(int days){Stat s=new Stat();TreeSet<String> ds=new TreeSet<>(Collections.reverseOrder());for(int i=0;i<picks.length();i++){JSONObject o=picks.optJSONObject(i);if(isFormal(o))ds.add(o.optString("publish_date"));}HashSet<String> keep=new HashSet<>();int c=0;for(String d:ds){if(c++>=days)break;keep.add(d);}HashSet<String> keys=new HashSet<>();for(int i=0;i<picks.length();i++){JSONObject o=picks.optJSONObject(i);if(!isFormal(o)||!keep.contains(o.optString("publish_date")))continue;keys.add(o.optString("publish_date")+"#"+no3(o.optString("match_no")));}for(String k:keys){String[] z=k.split("#");String e=matchEval(z[0],z[1]);if(e.equals("评测成功")){s.h++;s.n++;}else if(e.equals("评测未中"))s.n++;}return s;}
            void mePage(){if(accessToken.isEmpty()){authPanel();return;}LinearLayout top=card();top.addView(tv("我的账户",20,black,true));top.addView(tv("已登录 · 豪竞会员中心",13,green,true));body.addView(top);new Thread(()->{try{JSONArray p=getPrivate("hao_app_profiles?select=display_name,avatar_url,account_status,membership_tier,membership_expires_at&limit=1");JSONArray w=getPrivate("hao_app_wallets?select=currency,balance_cents,frozen_cents&limit=1");JSONArray l=getPrivate("hao_app_wallet_ledger?select=txn_type,amount_cents,balance_after_cents,memo,created_at&order=created_at.desc&limit=20");JSONArray r=getPrivate("hao_app_recharge_orders?select=amount_cents,currency,status,channel,created_at,paid_at&order=created_at.desc&limit=20");runOnUiThread(()->drawAccount(p,w,l,r));}catch(Exception e){runOnUiThread(()->{body.addView(tv("账户信息读取失败，请重新登录。",13,red,true));logoutButton();});}}).start();}
            void drawAccount(JSONArray p,JSONArray w,JSONArray l,JSONArray ro){JSONObject u=p.optJSONObject(0);JSONObject wa=w.optJSONObject(0);LinearLayout c=card();c.addView(tv(u==null?"豪竞用户":u.optString("display_name","豪竞用户"),19,black,true));c.addView(tv("状态："+(u==null?"--":u.optString("account_status","正常"))+" · 会员："+(u==null?"普通用户":u.optString("membership_tier","普通用户")),13,muted,false));if(u!=null&&!u.optString("membership_expires_at").isEmpty())c.addView(tv("会员到期："+u.optString("membership_expires_at"),12,muted,false));body.addView(c);LinearLayout money=card();long bal=wa==null?0:wa.optLong("balance_cents",0);money.addView(tv("我的钱包",16,black,true));money.addView(tv("¥ "+String.format(Locale.CHINA,"%.2f",bal/100.0),25,gold,true));TextView recharge=tv("充值中心",14,black,true);recharge.setBackground(box(gold2,10));recharge.setPadding(dp(12),dp(10),dp(12),dp(10));recharge.setOnClickListener(v->new AlertDialog.Builder(this).setTitle("充值中心").setMessage("充值入口已预留。当前版本尚未接入微信/支付宝真实支付，不会生成虚假付款。\n\n可在后续接入支付渠道后直接启用。").setPositiveButton("知道了",null).show());money.addView(recharge);body.addView(money);LinearLayout hist=card();hist.addView(tv("交易记录",16,black,true));if(l.length()==0)hist.addView(tv("暂无交易记录",13,muted,false));for(int i=0;i<l.length();i++){JSONObject o=l.optJSONObject(i);hist.addView(tv(o.optString("created_at")+"  "+o.optString("txn_type")+"  "+String.format(Locale.CHINA,"%.2f",o.optLong("amount_cents")/100.0),12,muted,false));}body.addView(hist);LinearLayout rc=card();rc.addView(tv("充值记录",16,black,true));if(ro.length()==0)rc.addView(tv("暂无充值记录",13,muted,false));for(int i=0;i<ro.length();i++){JSONObject o=ro.optJSONObject(i);rc.addView(tv(o.optString("created_at")+"  ¥"+String.format(Locale.CHINA,"%.2f",o.optLong("amount_cents")/100.0)+"  "+o.optString("status"),12,muted,false));}body.addView(rc);logoutButton();}
            void authPanel(){LinearLayout c=card();c.addView(tv("登录豪竞",21,black,true));EditText email=new EditText(this);email.setHint("邮箱");email.setSingleLine(true);EditText pwd=new EditText(this);pwd.setHint("密码");pwd.setSingleLine(true);pwd.setInputType(0x81);c.addView(email);c.addView(pwd);LinearLayout bs=new LinearLayout(this);Button login=new Button(this);login.setText("登录");Button reg=new Button(this);reg.setText("注册");bs.addView(login,new LinearLayout.LayoutParams(0,-2,1));bs.addView(reg,new LinearLayout.LayoutParams(0,-2,1));c.addView(bs);TextView forgot=tv("忘记密码",13,gold,true);c.addView(forgot);body.addView(c);login.setOnClickListener(v->doLogin(email.getText().toString().trim(),pwd.getText().toString()));reg.setOnClickListener(v->doSignup(email.getText().toString().trim(),pwd.getText().toString()));forgot.setOnClickListener(v->doRecover(email.getText().toString().trim()));}
            void doLogin(String e,String p){if(e.isEmpty()||p.isEmpty()){toast("请输入邮箱和密码");return;}new Thread(()->{try{JSONObject r=authPost("token?grant_type=password",new JSONObject().put("email",e).put("password",p));saveSession(r);runOnUiThread(()->{toast("登录成功");render();});}catch(Exception x){runOnUiThread(()->toast("登录失败，请检查账号密码"));}}).start();} void doSignup(String e,String p){if(e.isEmpty()||p.length()<6){toast("请输入邮箱，密码至少6位");return;}new Thread(()->{try{JSONObject r=authPost("signup",new JSONObject().put("email",e).put("password",p));if(!r.optString("access_token").isEmpty())saveSession(r);runOnUiThread(()->{toast("注册成功；如开启邮箱验证，请先查收验证邮件");render();});}catch(Exception x){runOnUiThread(()->toast("注册失败，请稍后再试"));}}).start();} void doRecover(String e){if(e.isEmpty()){toast("先输入邮箱");return;}new Thread(()->{try{authPost("recover",new JSONObject().put("email",e));runOnUiThread(()->toast("重置邮件已发送"));}catch(Exception x){runOnUiThread(()->toast("发送失败"));}}).start();}
            void logoutButton(){TextView b=tv("退出登录",15,red,true);b.setGravity(Gravity.CENTER);b.setPadding(dp(8),dp(14),dp(8),dp(14));b.setOnClickListener(v->{accessToken="";refreshToken="";sp.edit().clear().apply();render();});body.addView(b);}void toast(String s){Toast.makeText(this,s,Toast.LENGTH_SHORT).show();}
