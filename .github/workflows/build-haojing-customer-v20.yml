name: Build HaoJing Customer APK v2.0
on:
  push:
    branches: [haojing-android]
    paths:
      - 'haojing-customer-v20/**'
      - '.github/workflows/build-haojing-customer-v20.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Validate public feeds
        shell: bash
        run: |
          set -euo pipefail
          KEY='sb_publishable_FVHoVk1pL1gNtu65-cZ0JQ_lOllpCSs'
          BASE='https://tqlibowvnwfkaseqqvvp.supabase.co/rest/v1'
          curl --fail-with-body -sS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$BASE/hao_app_full_snapshot_v14?select=publish_date,match_no&limit=5" >/tmp/full.json
          curl --fail-with-body -sS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$BASE/hao_app_picks_snapshot_v14?select=publish_date,match_no,record_kind&limit=5" >/tmp/picks.json
          curl --fail-with-body -sS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$BASE/hao_app_risk_stats_v15?select=publish_date,match_no&limit=5" >/tmp/risk.json
          jq empty /tmp/full.json /tmp/picks.json /tmp/risk.json
          test "$(jq length /tmp/full.json)" -gt 0
          test "$(jq length /tmp/picks.json)" -gt 0
          echo PUBLIC_FEEDS_OK
      - name: Assemble Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p haojing-customer-v20/app/src/main/java/com/haojing/app
          cat haojing-customer-v20/srcparts/0*.txt > haojing-customer-v20/app/src/main/java/com/haojing/app/MainActivity.java
          grep -q '豪竞核心研判系统' haojing-customer-v20/app/src/main/java/com/haojing/app/MainActivity.java
          grep -q 'hao_app_submit_manual_recharge' haojing-customer-v20/app/src/main/java/com/haojing/app/MainActivity.java
          grep -q 'qr.alipay.com/tsx19588pb0no8i91mp4cae' haojing-customer-v20/app/src/main/java/com/haojing/app/MainActivity.java
      - name: Build debug APK
        working-directory: haojing-customer-v20
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp haojing-customer-v20/app/build/outputs/apk/debug/app-debug.apk HaoJing-Customer-v2.0-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HaoJing-Customer-v2.0-test
          path: HaoJing-Customer-v2.0-test.apk
          retention-days: 30
