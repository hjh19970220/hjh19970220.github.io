name: Patch Haochuan Hard64 v13
on:
  push:
    paths:
      - '.github/workflows/patch-haochuan-hard64-v13.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          old="const APP_BUILD='2026-09-05 豪篮累计命中率v12';"
          new="const APP_BUILD='2026-09-05 豪传Hard64票面v13';"
          if old not in s: raise SystemExit('build marker not found')
          s=s.replace(old,new,1)
          old="const ready=s.ticket_status==='READY'&&ticketNos.length===9;"
          new="const formalCost=Number(s.cost_rmb||0),formalCombos=Number(s.combination_count||0); const ready=run.formal_allowed===true&&s.ticket_status==='READY'&&ticketNos.length===9&&formalCost>0&&formalCost<=64&&formalCombos>0&&formalCombos<=32;"
          if old not in s: raise SystemExit('ready marker not found')
          s=s.replace(old,new,1)
          old='⚠️ 当前没有通过完整出票闸门，不生成正式下注方案。'
          new='⚠️ 当前没有通过完整出票闸门，不生成正式下注方案。正式金额：未出票（硬上限64元 / 32注）。'
          if old not in s: raise SystemExit('PASS notice marker not found')
          s=s.replace(old,new,1)
          old='当前注数/金额只是由风险结构自然计算出的参考值，不参与留9或单双三决策。'
          new='正式票受32注/64元硬闸门约束；候选超预算只保留审计，绝不作为正式出票。'
          if old not in s: raise SystemExit('ticket note marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          Path('version.json').write_text(json.dumps({'build':'2026-09-05 豪传Hard64票面v13','updated_at':'2026-09-05'},ensure_ascii=False,separators=(',',':'))+'\n')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/patch-haochuan-hard64-v13.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json .github/workflows/patch-haochuan-hard64-v13.yml
          git commit -m "fix: enforce Haochuan 64 RMB formal ticket UI [skip ci]"
          git push
