<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>豪竞3.3｜实战版</title>
<style>
:root{--bg:#07111f;--p:#0d1b2d;--p2:#10233b;--line:#1b3554;--text:#eef6ff;--muted:#8da7c1;--green:#35d48b;--yellow:#ffc95d;--red:#ff7180;--blue:#62adff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 85% -10%,#173a62 0,#07111f 44%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.wrap{max-width:920px;margin:auto;padding:14px 12px 48px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.brand{font-size:23px;font-weight:900}.sub{color:var(--muted);font-size:12px;line-height:1.5;margin-top:4px}.topBtns{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #28547e;background:#102c49;color:#dff0ff;border-radius:10px;padding:8px 10px;font-size:12px;cursor:pointer}.btn.ghost{background:transparent;border-color:#203c59;color:#91abc4}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:linear-gradient(180deg,#10243b,#0b1929);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px;margin-top:5px}.stat span{font-size:11px;color:var(--muted)}.filters{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{border:1px solid #234766;background:#0a1928;color:#9db5cc;border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap}.filter.on{background:#174779;border-color:#2b6ca4;color:#fff}.hint{font-size:11px;color:#7895b1;margin:0 2px 10px}.list{display:grid;gap:10px}.match{background:linear-gradient(180deg,#0f2238,#0a1827);border:1px solid #1c3a58;border-radius:16px;overflow:hidden}.match.reco{border-color:#2b6a91}.match.pass{opacity:.86}.main{padding:13px 14px;cursor:pointer}.head,.pickrow,.meta{display:flex;justify-content:space-between;gap:8px;align-items:center}.no{font-weight:900;color:#f0c86b}.league,.time{font-size:11px;color:#7f9bb7}.teams{font-size:17px;font-weight:850;margin:9px 0 11px;line-height:1.35}.labels{display:flex;gap:6px;flex-wrap:wrap}.tag{border:1px solid #274967;background:#0a1827;border-radius:999px;padding:4px 7px;font-size:10px;color:#b7cce0}.tag.good{border-color:#26734f;color:#8ee6b7}.tag.warn{border-color:#765d27;color:#f4cf7c}.tag.bad{border-color:#6d3440;color:#ff9aa5}.ftLabel{font-size:11px;color:#84a2bf}.ft{font-size:20px;font-weight:900}.best{text-align:right}.best small{display:block;color:#8aa6c0;font-size:10px;margin-bottom:3px}.best strong{font-size:17px;color:#cfeaff}.statusLine{margin-top:10px;padding-top:10px;border-top:1px solid #18334e;display:flex;justify-content:space-between;gap:8px;font-size:12px}.status{font-weight:850}.status.good{color:#7ce0aa}.status.warn{color:#f5cd72}.status.bad{color:#ff91a0}.settle{color:#8aa6bf}.simple{display:none;border-top:1px solid #1a3550;background:#091724;padding:12px 14px}.match.open .simple{display:block}.five{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.signal{background:#0d2033;border:1px solid #1a3b59;border-radius:11px;padding:9px 7px;text-align:center}.signal span{display:block;font-size:10px;color:#7f9ab4;margin-bottom:5px}.signal b{font-size:12px}.reason{margin-top:10px;font-size:12px;color:#9eb4c9;line-height:1.55}.research{margin-top:9px;display:flex;justify-content:flex-end}.empty{padding:45px 15px;text-align:center;color:#819cb6}.login{min-height:85vh;display:grid;place-items:center;padding:16px}.loginBox{width:min(92vw,380px);background:#0d1b2d;border:1px solid #1d3a5a;border-radius:20px;padding:23px}.loginBox h1{margin:0 0 5px;font-size:22px}.loginBox label{display:block;font-size:12px;color:#91a8bf;margin:12px 0 6px}.loginBox input{width:100%;border:1px solid #284866;background:#081522;color:white;border-radius:11px;padding:13px}.loginBox .go{width:100%;margin-top:17px;border:0;border-radius:11px;background:#2e83e6;color:white;padding:13px;font-weight:850}.err{display:none;color:#ff9dad;font-size:12px;margin-top:9px}.footer{font-size:10px;color:#607b95;text-align:center;margin-top:17px;line-height:1.5}.loading{min-height:70vh;display:grid;place-items:center;color:#86a0ba}.badgebar{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{font-size:10px;border:1px solid #203d5a;border-radius:7px;padding:4px 6px;color:#91abc5}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.five{grid-template-columns:repeat(2,1fr)}.signal:last-child{grid-column:span 2}.top{display:block}.topBtns{justify-content:flex-start;margin-top:9px}.teams{font-size:16px}.ft{font-size:19px}.best strong{font-size:15px}}
</style>
</head>
<body><div id="app"><div class="loading">正在读取豪竞3.3…</div></div>
<script>
const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-console-v1';
const BUILD='豪竞3.3实战前端-v1-20260915';
let DATA=null,FILTER='all',TIMER=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=()=>localStorage.getItem('hao_console_token')||'';
const fmt=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return '—'}};
function logout(){localStorage.removeItem('hao_console_token');DATA=null;login()}
function login(){clearInterval(TIMER);document.getElementById('app').innerHTML=`<div class="login"><form class="loginBox" id="lf"><h1>豪竞3.3</h1><div class="sub">实战极简版 · 使用原控制台账号</div><label>用户名</label><input id="u" value="hao" autocomplete="username"><label>密码</label><input id="p" type="password" autocomplete="current-password"><button class="go">进入</button><div class="err" id="err">账号或密码不正确</div></form></div>`;document.getElementById('lf').onsubmit=async e=>{e.preventDefault();try{const r=await fetch(API+'?login=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});const j=await r.json();if(r.ok&&j.token){localStorage.setItem('hao_console_token',j.token);load(true)}else document.getElementById('err').style.display='block'}catch(_){document.getElementById('err').style.display='block'}}}
async function load(show=false){if(!token()){login();return}if(show)document.getElementById('app').innerHTML='<div class="loading">读取最新赛前冻结数据…</div>';try{const r=await fetch(API+'?api=1&t='+Date.now(),{headers:{Authorization:'Bearer '+token()},cache:'no-store'});if(r.status===401){logout();return}const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'读取失败');DATA=j;render();clearInterval(TIMER);TIMER=setInterval(()=>{if(document.visibilityState==='visible')load(false)},60000)}catch(e){document.getElementById('app').innerHTML='<div class="empty">连接失败：'+esc(e.message)+'<br><br><button class="btn" onclick="load(true)">重试</button></div>'}}
function bp(r){const s=r?.source_status||{};return s.hj33_best_play_selector_v01||s.hj32_best_play_selector_v02||s.hj32_best_play_selector_v01||null}
function normMarket(v){v=String(v||'').toUpperCase();if(v.includes('HHAD'))return '官方让球';if(v.includes('FT')||v.includes('HAD'))return '胜平负';return 'PASS'}
function pickText(r){const b=bp(r);if(b&&Array.isArray(b.selected_picks)&&b.selected_picks.length)return b.selected_picks.join(' + ');const s=r?.source_status||{},p=s.single_double_v01?.picks;if(Array.isArray(p)&&p.length)return p.join(' + ');return r.top1||'未确认'}
function recState(r){const b=bp(r);if(b){const m=String(b.selected_market||'PASS').toUpperCase(),p=Array.isArray(b.selected_picks)?b.selected_picks:[];if(m!=='PASS'&&p.length)return {reco:true,market:normMarket(m),picks:p,cls:String(b.class_code||''),action:String(b.action||''),reason:b.reason||''}}
 const s=r?.source_status||{},c=String(s.single_double_v01?.class_code||'').toUpperCase(),p=Array.isArray(s.single_double_v01?.picks)?s.single_double_v01.picks:[];if((c==='SINGLE'||c==='STRONG_DOUBLE')&&p.length)return {reco:true,market:'胜平负',picks:p,cls:c,action:'',reason:''};return {reco:false,market:'PASS',picks:[],cls:'PASS',action:'',reason:''}}
function isSingle(r){const x=recState(r);return x.reco&&x.picks.length===1}
function toneStatus(r){const x=recState(r);if(!x.reco)return ['PASS','warn'];if(x.picks.length===1)return ['可单选','good'];return ['双选保护','good']}
function ftProb(r){const s=r?.source_status||{},pr=s.p_raw||{},map={'主胜':'home','平':'draw','客胜':'away'},k=map[r.top1];const v=k!=null?Number(pr[k]):NaN;if(Number.isFinite(v))return (v*100).toFixed(1)+'%';const t=Number(s.top1_prob);return Number.isFinite(t)?(t*100).toFixed(1)+'%':'—'}
function riskZh(v){v=String(v||'').toUpperCase();if(v.includes('红')||v==='RED')return '高';if(v.includes('黄')||v==='YELLOW')return '中';if(v.includes('绿')||v==='GREEN')return '低';return v||'未确认'}
function marketSignal(r){const s=r?.source_status||{};if(s.market_direction_conflict===true||String(s.market_direction_conflict)==='true')return '有分歧';if(s.market_direction_conflict===false||String(s.market_direction_conflict)==='false')return '同向';const b=bp(r);return b&&b.hhad_market_top1?'已确认':'未确认'}
function eloSignal(r){const s=r?.source_status||{},e=s.elo||{};const d=Number(e.elo_diff);if(!Number.isFinite(d))return '未确认';if(r.top1==='主胜')return d>0?'支持':'背离';if(r.top1==='客胜')return d<0?'支持':'背离';return Math.abs(d)<45?'均衡':'有差距'}
function marginSignal(r){const s=r?.source_status||{};return s.structural_handicap_pick||s.handicap_pick||r.handicap_pick||'未确认'}
function settle(r){if(!r.result_verified)return '待结算';const ft=r.result_1x2==='3'?'主胜':r.result_1x2==='1'?'平':'客胜';return `${r.result_home??'?'}-${r.result_away??'?'} · ${ft}`}
function hit(r){if(!r.result_verified||!r.top1)return null;const c=r.top1==='主胜'?'3':r.top1==='平'?'1':'0';return String(r.result_1x2)===c}
function confRank(r){return ({'高':4,'中高':3,'中':2,'低':1})[r.confidence_label]||0}
function filteredRows(rows){let out=rows.slice();if(FILTER==='reco')out=out.filter(r=>recState(r).reco);if(FILTER==='single')out=out.filter(isSingle);if(FILTER==='pass')out=out.filter(r=>!recState(r).reco);return out}
function setFilter(v){FILTER=v;render()}
function toggle(id){document.getElementById(id)?.classList.toggle('open')}
function openResearch(){location.href='live.html'}
function card(r,i){const x=recState(r),ts=toneStatus(r),b=bp(r),id='m'+i+'_'+String(r.match_no||'').replace(/\W/g,'');const t=fmt(r.kickoff_bjt),tm=t==='—'?'—':t.split(' ').pop()||t;const h=hit(r);return `<div class="match ${x.reco?'reco':'pass'}" id="${id}"><div class="main" onclick="toggle('${id}')"><div class="head"><div><span class="no">${esc(r.match_no)}</span> <span class="league">${esc(r.league||'')}</span></div><span class="time">${esc(tm)}</span></div><div class="teams">${esc(r.home_team)} <span style="color:#607b95">vs</span> ${esc(r.away_team)}</div><div class="pickrow"><div><div class="ftLabel">FT 主判断</div><div class="ft">${esc(r.top1||'未确认')} <span style="font-size:12px;color:#8ba8c3">${esc(ftProb(r))}</span></div></div><div class="best"><small>最佳玩法</small><strong>${x.reco?esc(x.market+' · '+x.picks.join(' + ')):'PASS'}</strong></div></div><div class="badgebar"><span class="tag">信心 ${esc(r.confidence_label||'—')}</span><span class="tag">${esc(r.dq||'DQ未确认')}</span><span class="tag ${riskZh(r.dtr)==='高'?'bad':riskZh(r.dtr)==='中'?'warn':'good'}">平局风险 ${esc(riskZh(r.dtr))}</span><span class="tag ${riskZh(r.hur)==='高'?'bad':riskZh(r.hur)==='中'?'warn':'good'}">冷门风险 ${esc(riskZh(r.hur))}</span></div><div class="statusLine"><span class="status ${ts[1]}">${ts[0]}</span><span class="settle">${esc(settle(r))}${h===true?' · ✅':h===false?' · ❌':''}</span></div></div><div class="simple"><div class="five"><div class="signal"><span>市场</span><b>${esc(marketSignal(r))}</b></div><div class="signal"><span>实力</span><b>${esc(eloSignal(r))}</b></div><div class="signal"><span>平局风险</span><b>${esc(riskZh(r.dtr))}</b></div><div class="signal"><span>冷门风险</span><b>${esc(riskZh(r.hur))}</b></div><div class="signal"><span>净胜球/让球</span><b>${esc(marginSignal(r))}</b></div></div><div class="reason">${esc((b&&b.reason)||'内部证据已折叠；首页只保留决策层信息。')}</div><div class="research"><button class="btn ghost" onclick="event.stopPropagation();openResearch()">打开研究版查看全部证据</button></div></div></div>`}
function render(){const rows=DATA?.hj?.rows||[],reco=rows.filter(r=>recState(r).reco),singles=reco.filter(isSingle),passes=rows.filter(r=>!recState(r).reco),shown=filteredRows(rows);const run=DATA?.hj?.run||{};const version=run.model_version||DATA?.active_models?.[DATA?.role_models?.hj]?.model_version||'3.3';document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div><div class="brand">豪竞${esc(version)} · 实战版</div><div class="sub">只看结论｜FT方向 → 最佳玩法 → 风险状态<br>销售日 ${esc(run.pool_date||'—')} · 冻结/运行 ${esc(fmt(run.run_time))}</div></div><div class="topBtns"><button class="btn" onclick="load(true)">刷新</button><button class="btn ghost" onclick="openResearch()">研究版</button><button class="btn ghost" onclick="logout()">退出</button></div></div><div class="stats"><div class="stat"><span>今日全池</span><b>${rows.length}</b></div><div class="stat"><span>正式推荐</span><b>${reco.length}</b></div><div class="stat"><span>单选</span><b>${singles.length}</b></div><div class="stat"><span>PASS</span><b>${passes.length}</b></div></div><div class="filters"><button class="filter ${FILTER==='all'?'on':''}" onclick="setFilter('all')">全部 ${rows.length}</button><button class="filter ${FILTER==='reco'?'on':''}" onclick="setFilter('reco')">只看推荐 ${reco.length}</button><button class="filter ${FILTER==='single'?'on':''}" onclick="setFilter('single')">只看单选 ${singles.length}</button><button class="filter ${FILTER==='pass'?'on':''}" onclick="setFilter('pass')">PASS ${passes.length}</button></div><div class="hint">点任意比赛展开：市场｜实力｜平局风险｜冷门风险｜净胜球。技术字段全部移到研究版。</div><div class="list">${shown.length?shown.map(card).join(''):'<div class="empty">当前筛选没有比赛</div>'}</div><div class="footer">每60秒自动读取最新数据库。此页不改变豪竞3.3任何模型规则，只简化展示。缺失字段保持“未确认”，不猜值。<br>${esc(BUILD)}</div></div>`}
load(true);
</script></body></html>
