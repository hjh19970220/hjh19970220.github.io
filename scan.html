<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>豪竞2.4 扫盘</title><style>:root{--bg:#07111f;--l:#1b3554;--t:#ecf5ff;--m:#91a8bf}*{box-sizing:border-box}body{margin:0;background:#07111f;color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.w{max-width:1280px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h1{font-size:22px;margin:0}.sub{font-size:12px;color:var(--m);margin-top:5px}.back{color:#cde5ff;text-decoration:none;border:1px solid #2b5681;padding:7px 10px;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:12px 0}.stat,.card,.history{background:linear-gradient(180deg,#0f2238,#0b192a);border:1px solid var(--l);border-radius:14px;padding:12px}.stat b{font-size:21px;display:block;margin-top:6px}.section{font-size:15px;font-weight:850;margin-top:18px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card.high{border-color:#24764f}.card.medium{border-color:#765821}.card.low{border-color:#713342}.head,.line,.result{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.no{font-weight:900;color:#f2c66d}.teams{font-size:16px;font-weight:850;margin:8px 0}.tag{font-size:11px;border:1px solid var(--l);padding:4px 7px;border-radius:999px}.high .level{color:#73e4ad}.medium .level{color:#ffd27c}.low .level{color:#ff91a0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.box{background:#091725;border:1px solid #183655;border-radius:10px;padding:8px}.box span{display:block;color:var(--m);font-size:10px;margin-bottom:4px}.box b{font-size:13px}.result{margin-top:9px;background:#081522;border:1px solid #24425f;border-radius:9px;padding:8px;font-size:12px}.ok{color:#71dfa8}.bad{color:#ff8e9b}.pending{color:#a8bdd0}.reason{margin-top:9px;color:#ff9dad;font-size:11px}.foot{font-size:11px;color:var(--m);margin-top:12px;line-height:1.6}.loading{text-align:center;color:var(--m);padding:80px 10px}.history{overflow:auto}.history table{width:100%;border-collapse:collapse;font-size:12px;min-width:670px}.history th,.history td{padding:8px;border-bottom:1px solid #183655;text-align:center}.history th{color:#9fb8cf;font-weight:650}.note{font-size:11px;color:#f0c46a;margin-top:7px}@media(max-width:760px){.cards{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.top h1{font-size:19px}}</style></head><body><div class="w"><div class="top"><div><h1>豪竞2.4｜多玩法扫盘</h1><div class="sub">胜平负核心 → 总进球 → 半全场 → 比分 → 多玩法共振审计｜影子层，不改变正式选腿</div></div><a class="back" href="/">返回控制台</a></div><div id="app" class="loading">正在读取最新扫盘…</div></div><script>const API='https://tqlibowvnwfkaseqqvvp.supabase.co/functions/v1/hao-euro-odds-consensus-probe-v01?scan_public=1';function pct(x){return x==null?'—':(Number(x)*100).toFixed(1)+'%'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ftProb(x){return x.formal_ft_top1==='主胜'?x.formal_p_home:x.formal_ft_top1==='平'?x.formal_p_draw:x.formal_ft_top1==='客胜'?x.formal_p_away:null}function levelClass(v){return v==='HIGH'?'high':v==='MED'?'medium':'low'}function levelCn(v){return v==='HIGH'?'高共振':v==='MED'?'中等共振':'冲突/观望'}function qualityCn(v){return v==='LEAGUE_CALIBRATED_SHADOW'?'联赛历史校准':v==='GLOBAL_FALLBACK_SHADOW'?'全局历史回退':'研究层'}function divCn(v){const m={E0:'英超历史',E1:'英冠历史',E2:'英甲历史',E3:'英乙历史',SP1:'西甲历史',SP2:'西乙历史',D1:'德甲历史',D2:'德乙历史',I1:'意甲历史',I2:'意乙历史',F1:'法甲历史',F2:'法乙历史',P1:'葡超历史',N1:'荷甲历史',B1:'比甲历史',SC0:'苏超历史',SC1:'苏冠历史',T1:'土超历史',BRA:'巴甲历史',NOR:'挪超历史',JAP:'日本联赛历史',USA:'美职联历史',SWE:'瑞典联赛历史',FIN:'芬兰联赛历史',AUT:'奥甲历史',SUI:'瑞士联赛历史',GLOBAL:'全局历史'};return m[v]||v||'未分类'}function hit(v){return v===true?'<span class="ok">✓命中</span>':v===false?'<span class="bad">✕未中</span>':'<span class="pending">待结算</span>'}async function load(){try{const r=await fetch(API+'&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('接口异常 '+r.status);const j=await r.json(),rows=j.rows||[];if(!rows.length)throw new Error('暂无扫盘数据');render(j)}catch(e){document.getElementById('app').innerHTML='<div class="card low">扫盘读取失败：'+esc(e.message)+'</div>'}}function render(j){const a=j.rows||[],c=j.cumulative||{},d=j.daily||[];let h=a.filter(x=>x.consistency_level==='HIGH').length,m=a.filter(x=>x.consistency_level==='MED').length,l=a.filter(x=>x.consistency_level==='LOW').length,post=a.filter(x=>!x.record_eligible).length;let html='<div class="stats"><div class="stat">本轮比赛<b>'+a.length+'</b></div><div class="stat">高共振<b>'+h+'</b></div><div class="stat">中等共振<b>'+m+'</b></div><div class="stat">冲突/观望<b>'+l+'</b></div></div><div class="section">赛后累计战绩</div><div class="stats"><div class="stat">有效赛前样本<b>'+esc(c.settled_matches??0)+'</b></div><div class="stat">胜平负命中率<b>'+pct(c.ft_hit_rate)+'</b></div><div class="stat">总进球前二覆盖<b>'+pct(c.goals_top2_hit_rate)+'</b></div><div class="stat">比分前三覆盖<b>'+pct(c.score_top3_hit_rate)+'</b></div><div class="stat">高共振胜平负<b>'+pct(c.high_ft_hit_rate)+'</b></div></div><div class="note">统计纪律：只计算“开赛前最后一次冻结”的扫盘。赛中或赛后生成的扫盘可以显示真实赛果，但绝不计入命中率。当前本轮有 '+post+' 场不符合赛前冻结条件。</div><div class="section">本轮逐场扫盘</div><div class="cards">';html+=a.map(x=>{const lev=levelClass(x.consistency_level),go=(x.total_goals_top||[]).map(z=>z.goals+'球 '+pct(z.prob)).join(' / '),sc=(x.score_top||[]).slice(0,3).map(z=>z.score+' '+pct(z.p)).join(' / ');let res='';if(x.result_verified){res='<div class="result"><b>赛果：'+esc(x.result_score)+' · '+esc(x.result_1x2)+'</b>'+(x.record_counted?'<span>胜平负 '+hit(x.ft_top1_hit)+'　进球前二 '+hit(x.total_goals_top2_hit)+'　比分前三 '+hit(x.score_top3_hit)+'</span>':'<span class="pending">仅显示赛果｜该快照不是赛前冻结，不计战绩</span>')+'</div>'}else{res='<div class="result"><b>赛果：待完场核验</b><span class="'+(x.record_eligible?'ok':'pending')+'">'+(x.record_eligible?'有效赛前冻结｜完场后自动计入':'该快照已晚于开赛｜不会计入累计')+'</span></div>'}return '<div class="card '+lev+'"><div class="head"><span><b class="no">'+esc(x.match_no)+'</b> <span class="tag">'+esc(x.league)+'</span></span><b class="level">'+levelCn(x.consistency_level)+'</b></div><div class="teams">'+esc(x.home_team)+' 对阵 '+esc(x.away_team)+'</div><div class="grid"><div class="box"><span>正式胜平负</span><b>'+esc(x.formal_ft_top1)+' '+pct(ftProb(x))+'</b></div><div class="box"><span>总进球前二</span><b>'+esc(go)+'</b></div><div class="box"><span>半全场前二</span><b>'+esc(x.htft_top1)+' '+pct(x.htft_top1_prob)+' / '+esc(x.htft_top2)+' '+pct(x.htft_top2_prob)+'</b></div><div class="box"><span>比分前三</span><b>'+esc(sc)+'</b></div></div>'+res+'<div class="line" style="margin-top:9px"><span class="tag">'+esc(x.script_label)+'</span><span class="sub">半场：主胜 '+pct(x.ht_p_home)+' / 平 '+pct(x.ht_p_draw)+' / 客胜 '+pct(x.ht_p_away)+' · '+esc(divCn(x.ht_calibration_division))+' · 样本 '+esc(x.ht_sample_n)+'场 · '+qualityCn(x.input_quality)+'</span></div>'+(x.conflict_reason?'<div class="reason">⚠ '+esc(x.conflict_reason)+'</div>':'')+'</div>'}).join('')+'</div><div class="section">每日赛后记录</div><div class="history">'+(d.length?'<table><thead><tr><th>日期</th><th>有效场次</th><th>胜平负</th><th>总进球前一</th><th>总进球前二</th><th>比分前一</th><th>比分前三</th><th>高共振胜平负</th></tr></thead><tbody>'+d.map(x=>'<tr><td>'+esc(x.pool_date)+'</td><td>'+esc(x.settled_matches)+'</td><td>'+esc(x.ft_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.ft_hit_rate)+')</td><td>'+esc(x.goals_top1_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.goals_top1_hit_rate)+')</td><td>'+esc(x.goals_top2_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.goals_top2_hit_rate)+')</td><td>'+esc(x.score_top1_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.score_top1_hit_rate)+')</td><td>'+esc(x.score_top3_hits)+'/'+esc(x.settled_matches)+' ('+pct(x.score_top3_hit_rate)+')</td><td>'+esc(x.high_ft_hits)+'/'+esc(x.high_settled)+' ('+pct(x.high_ft_hit_rate)+')</td></tr>').join('')+'</tbody></table>':'<div class="pending">暂无可计入的有效赛前结算样本。今天开赛后才生成的场次不会倒灌进历史成绩。</div>')+'</div><div class="foot">赛果沿用现有完场自动核验链。胜平负、总进球和比分会自动累计；半全场战绩必须拿到可核验的上半场赛果后才结算，目前保持“待半场赛果源”，不根据全场比分反推。页面每60秒自动刷新。</div>';document.getElementById('app').className='';document.getElementById('app').innerHTML=html}load();setInterval(load,60000)</script></body></html>
